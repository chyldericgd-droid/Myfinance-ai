<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<title>Finance AI OS</title>
<meta name="version" content="6.0.0">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#09090f;--surf:#111118;--surf2:#16161f;--surf3:#1c1c28;
  --brd:#1e1e2e;--brd2:#2a2a3e;
  --acc:#8b5cf6;--acc2:#06b6d4;--acc3:#c4b5fd;--acc-glow:rgba(139,92,246,.35);
  --grn:#10b981;--red:#f43f5e;--org:#f97316;--ylw:#fbbf24;
  --txt:#f1f5f9;--txt2:#94a3b8;--mut:#475569;
  --r:22px;--r2:16px;--r3:28px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono','SF Mono','Roboto Mono',ui-monospace,Menlo,Monaco,Consolas,monospace;
}
html,body{height:100%;height:100dvh}
body{font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"cv02","cv03","cv04","cv11";letter-spacing:-0.005em}
/* Keep focused field visible above mobile keyboard */
input,textarea,select{scroll-margin-bottom:160px;scroll-margin-top:80px}
.fi.err{border-color:var(--red) !important;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* SCROLL */
.scroll{position:fixed;top:0;left:0;right:0;bottom:84px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page{max-width:600px;margin:0 auto;padding:14px 14px 24px}

/* NAV */
.nav{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:8px;right:8px;height:64px;background:rgba(20,20,32,0.85);border:1px solid var(--brd2);border-radius:28px;display:flex;align-items:center;justify-content:space-around;padding:0 4px;z-index:100;backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);box-shadow:0 12px 40px -12px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04) inset}
.ni{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--mut);font-size:9px;font-weight:700;letter-spacing:.5px;cursor:pointer;padding:6px 10px;border-radius:10px;transition:all .18s;text-transform:uppercase;min-width:44px}
.ni.on{color:var(--acc3);background:rgba(124,58,237,.12)}
.ni svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.fab{background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:20px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 8px 24px -4px var(--acc-glow),0 0 0 4px rgba(139,92,246,.12);transition:transform .12s,border-radius .2s;margin-top:-22px;flex-shrink:0}
.fab:active{transform:scale(.92);border-radius:28px}
.fab svg{stroke:#fff;width:22px;height:22px;stroke-width:2.5}

/* CARD */
.card{background:linear-gradient(180deg,var(--surf),var(--surf2));border:1px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -16px rgba(0,0,0,.6)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.8px;text-transform:uppercase}
.card-hero{background:linear-gradient(150deg,#100f24,#0a0a16);border-color:var(--brd2)}

/* BALANCE */
.bal{font-family:var(--mono);font-size:clamp(24px,7vw,34px);font-weight:700;letter-spacing:-1px;line-height:1}
.badge{background:rgba(124,58,237,.15);border:1px solid var(--acc);border-radius:20px;padding:3px 10px;font-size:10px;color:var(--acc3);font-weight:700}

/* KPI */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kt{background:var(--surf2);border-radius:var(--r2);padding:12px;border:1px solid var(--brd);cursor:pointer;transition:border-color .2s}
.kt:active{border-color:var(--acc)}
.kl{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.kv{font-size:16px;font-weight:800;margin-top:4px;font-family:var(--mono)}
.ks{font-size:10px;color:var(--mut);margin-top:2px}

/* BAR */
.bar{height:4px;background:var(--surf3);border-radius:10px;overflow:hidden;margin:5px 0}
.bf{height:100%;border-radius:10px;transition:width .5s ease}

/* ALERTS */
.al{padding:9px 12px;border-radius:12px;margin-bottom:7px;font-size:12px;font-weight:600;line-height:1.45;border-left:3px solid}
.al-d{background:rgba(244,63,94,.07);border-color:var(--red)}
.al-w{background:rgba(251,191,36,.07);border-color:var(--ylw)}
.al-g{background:rgba(16,185,129,.07);border-color:var(--grn)}
.al-i{background:rgba(124,58,237,.08);border-color:var(--acc)}

/* TX */
.txi{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--brd)}
.txi:last-child{border-bottom:none}
.txic{width:38px;height:38px;border-radius:11px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.txin{flex:1;min-width:0}
.txn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txm{font-size:10px;color:var(--mut);margin-top:2px}
.txa{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}

/* HEATMAP */
.hg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.hd{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;cursor:pointer;position:relative;transition:transform .1s;color:rgba(255,255,255,.7)}
.hd:active{transform:scale(.85)}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.mo.on{display:flex;animation:fi .15s ease}
.mb{background:linear-gradient(180deg,var(--surf2),var(--surf));border-radius:32px 32px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:6px 20px 36px;border-top:1px solid var(--brd2);box-shadow:0 -20px 60px -10px rgba(0,0,0,.7)}
.mh{width:36px;height:4px;background:var(--brd2);border-radius:10px;margin:10px auto 14px;cursor:pointer}
.mb h3{font-size:17px;font-weight:800;margin-bottom:14px}

/* INPUTS */
.fi{width:100%;background:var(--surf2);border:1px solid var(--brd);border-radius:var(--r2);padding:13px 14px;color:var(--txt);font-family:var(--font);font-size:14px;font-weight:600;margin-bottom:9px;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.fi:focus{border-color:var(--acc)}
.fi::placeholder{color:var(--mut);font-weight:400}
select.fi{cursor:pointer}

/* BUTTONS */
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:18px;padding:15px;font-weight:700;font-size:14px;color:#fff;width:100%;cursor:pointer;transition:transform .12s,box-shadow .2s;font-family:var(--font);letter-spacing:.2px;box-shadow:0 4px 14px -4px var(--acc-glow)}
.btn:active{opacity:.85;transform:scale(.98)}
.btn-ghost{background:transparent;border:1px solid var(--brd2);color:var(--txt2);font-family:var(--font);font-weight:600;font-size:13px}
.btn-red{background:linear-gradient(135deg,var(--red),#be185d)}
.btn-grn{background:linear-gradient(135deg,var(--grn),#059669)}
.btn-sm{padding:8px 14px;width:auto;font-size:12px;border-radius:20px}

/* TYPE TABS */
.ttabs{display:flex;gap:7px;margin-bottom:12px}
.tt{flex:1;padding:12px;border-radius:12px;border:1px solid var(--brd);background:var(--surf2);color:var(--mut);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
.tt.te{border-color:var(--red);color:var(--red);background:rgba(244,63,94,.08)}
.tt.ti{border-color:var(--grn);color:var(--grn);background:rgba(16,185,129,.08)}
.tt.tt2{border-color:var(--acc2);color:var(--acc2);background:rgba(99,102,241,.08)}

/* CHAT */
.chat{height:240px;overflow-y:auto;padding:10px;background:var(--surf2);border-radius:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:7px;scroll-behavior:smooth}
.bub{max-width:88%;padding:9px 13px;border-radius:14px;font-size:12px;line-height:1.5;font-weight:500}
.bai{background:var(--surf3);border:1px solid var(--brd2);border-bottom-left-radius:3px;align-self:flex-start}
.bus{background:linear-gradient(135deg,var(--acc),var(--acc2));border-bottom-right-radius:3px;align-self:flex-end}
.cirow{display:flex;gap:7px;align-items:center}
.cirow .fi{margin-bottom:0;flex:1;padding:10px 13px}
.sbtn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.sbtn svg{stroke:#fff;width:16px;height:16px}
.ald{display:flex;gap:4px;padding:9px 13px}
.add{width:6px;height:6px;border-radius:50%;background:var(--acc3);animation:dp 1.2s ease-in-out infinite}
.add:nth-child(2){animation-delay:.2s}
.add:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}

/* GOAL */
.gi{margin-bottom:12px}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.gn{font-size:13px;font-weight:700}
.gp{font-size:11px;color:var(--mut);font-family:var(--mono)}
.geta{font-size:10px;color:var(--acc3);margin-top:3px}

/* WEEKBAR */
.wb{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:7px}
.wbc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.wbf{width:100%;border-radius:5px 5px 0 0;transition:height .5s cubic-bezier(.34,1.56,.64,1),background .3s;display:block}
.wbl{font-size:9px;color:var(--mut);font-weight:700;text-align:center;line-height:1.1}

/* ACC CHIP */
.ach{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:var(--surf2);border:1px solid var(--brd);margin-bottom:7px;cursor:pointer;transition:border-color .2s}
.ach:active{border-color:var(--acc)}

/* SCORE */
.sring{display:flex;flex-direction:column;align-items:center;gap:5px}

/* SYNC */
.scode{font-family:var(--mono);font-size:12px;letter-spacing:2px;background:var(--surf2);border:1px solid var(--acc);border-radius:12px;padding:14px;text-align:center;color:var(--acc3);word-break:break-all}

/* ANIMS */
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.fin{animation:su .2s ease}

/* MISC */
.flex{display:flex;align-items:center;gap:8px}
.sb{justify-content:space-between}
.tg{color:var(--grn)}.tr{color:var(--red)}.ta{color:var(--acc3)}.tm{color:var(--mut)}
.mono{font-family:var(--mono)}.fw8{font-weight:800}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.div{height:1px;background:var(--brd);margin:10px 0}
.pill{background:var(--surf2);border:1px solid var(--brd);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}

/* TX filter tabs */
.ftabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.ftab{padding:6px 14px;border-radius:20px;border:1px solid var(--brd);background:var(--surf2);color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
.ftab.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* SECTION TITLE */
.stitle{font-size:20px;font-weight:800;margin-bottom:14px;letter-spacing:-.3px}
.ssub{font-size:12px;color:var(--mut);margin-bottom:14px;margin-top:-8px}

/* ONLINE BADGE - hidden (connectivity is now shown via background ambiance) */
.online-badge{display:none !important}

/* DYNAMIC LED AMBIANCE — financial state + connectivity */
body{transition:background .8s ease,filter .6s ease}

/* Connectivity layer — uses ::before pseudo-element so it doesn't clash with financial state bg */
body::before{
  content:'';
  position:fixed;inset:0;
  pointer-events:none;
  z-index:0;
  opacity:0;
  transition:opacity .7s ease;
}
body.online::before{
  background:
    radial-gradient(900px 400px at 12% -10%, rgba(139,92,246,.22), transparent 55%),
    radial-gradient(700px 400px at 100% 110%, rgba(6,182,212,.18), transparent 60%);
  opacity:1;
}
body.offline::before{opacity:0}
body.offline{filter:saturate(.75) brightness(.92)}
body.offline .aifab{filter:grayscale(.6)}

/* Financial State Ambiance Layer */
body.state-critical{
  background:
    radial-gradient(900px 600px at 50% 0%, rgba(244,63,94,.22), transparent 60%),
    radial-gradient(600px 400px at 100% 100%, rgba(190,24,93,.12), transparent 65%),
    var(--bg) !important;
  animation:criticalPulse 3s ease-in-out infinite;
}
@keyframes criticalPulse{0%,100%{filter:saturate(1)}50%{filter:saturate(1.15)}}
body.state-high{
  background:
    radial-gradient(900px 500px at 20% 0%, rgba(249,115,22,.16), transparent 60%),
    radial-gradient(600px 400px at 90% 100%, rgba(251,191,36,.08), transparent 65%),
    var(--bg) !important;
}
body.state-moderate{
  background:
    radial-gradient(1000px 600px at 12% -8%, rgba(251,191,36,.12), transparent 60%),
    radial-gradient(700px 500px at 100% 110%, rgba(249,115,22,.08), transparent 65%),
    var(--bg) !important;
}
body.state-stable{
  background:
    radial-gradient(1200px 700px at 12% -8%, rgba(16,185,129,.14), transparent 60%),
    radial-gradient(900px 600px at 100% 110%, rgba(6,182,212,.10), transparent 65%),
    radial-gradient(600px 400px at 50% 50%, rgba(167,139,250,.04), transparent 70%),
    var(--bg) !important;
}
body.state-zero{
  background:
    radial-gradient(800px 500px at 50% 30%, rgba(139,92,246,.10), transparent 65%),
    var(--bg) !important;
  filter:saturate(.9);
}


/* AI FLOAT */
.aifab{position:fixed;right:14px;bottom:78px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:90;
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 6px 20px rgba(124,58,237,.45),0 0 0 3px rgba(124,58,237,.18);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  transition:transform .15s,opacity .25s;animation:pulseAI 2.4s ease-in-out infinite}
.aifab:active{transform:scale(.9)}
.aifab.off{opacity:.45;animation:none}
.aifab .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--grn);
  box-shadow:0 0 8px var(--grn)}
.aifab.off .dot{background:var(--mut);box-shadow:none}
@keyframes pulseAI{0%,100%{box-shadow:0 6px 20px rgba(124,58,237,.45),0 0 0 3px rgba(124,58,237,.18)}
  50%{box-shadow:0 6px 24px rgba(124,58,237,.65),0 0 0 6px rgba(124,58,237,.10)}}
.mo.on ~ .aifab{opacity:0;pointer-events:none}

/* AI INSIGHT CARD on home */
.ai-insight{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(99,102,241,.05));
  border:1px solid rgba(167,139,250,.35);border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.ai-insight::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(167,139,250,.12),transparent 70%);pointer-events:none}
.ai-insight .ai-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:var(--acc3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.ai-insight .ai-b{font-size:13px;line-height:1.55;color:var(--txt);font-weight:500;position:relative}
.ai-insight .ai-loading{display:inline-block;width:8px;height:8px;background:var(--acc3);border-radius:50%;
  animation:dp 1.2s infinite}

/* TREND CHART */
.trend-svg{width:100%;height:130px;display:block}
.trend-svg .area{fill:url(#trendGrad);opacity:.6}
.trend-svg .line{fill:none;stroke:var(--acc3);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.trend-svg .pt{fill:var(--acc3);stroke:var(--bg);stroke-width:2}
.trend-svg .axis{stroke:var(--brd);stroke-width:1;stroke-dasharray:2 4}
.trend-svg .lbl{fill:var(--mut);font-size:9px;font-family:var(--mono);font-weight:700}

/* CELEBRATION TOAST */
.celebration{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:300;
  background:linear-gradient(135deg,rgba(16,185,129,.95),rgba(124,58,237,.92));
  color:#fff;padding:14px 20px;border-radius:16px;
  font-size:13px;font-weight:700;line-height:1.4;max-width:88%;text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.08);
  animation:celIn .3s cubic-bezier(.2,.9,.3,1.2),celOut .25s ease 3.2s forwards}
@keyframes celIn{from{opacity:0;transform:translate(-50%,-20px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes celOut{to{opacity:0;transform:translate(-50%,-10px) scale(.95)}}
.celebration small{display:block;font-weight:500;opacity:.9;font-size:11px;margin-top:3px}

/* SEARCH */
.search-box{display:flex;align-items:center;gap:8px;background:var(--surf2);border:1px solid var(--brd);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.search-box input{flex:1;background:none;border:none;color:var(--txt);font-size:14px;outline:none;font-family:var(--font)}
.search-box input::placeholder{color:var(--mut)}
.search-box svg{stroke:var(--mut);width:16px;height:16px;flex-shrink:0;fill:none;stroke-width:2}

/* ════════════════════════════════════════
   ANDROID 17 / iOS BUBBLE POLISH (overlay)
   Couleurs/structure inchangées — uniquement
   bordures plus rondes, ressort, glassmorphism
   raffiné, touch targets élargis.
   ════════════════════════════════════════ */
:root{
  --r:24px; --r2:18px; --r3:32px;
  --spring: cubic-bezier(.34,1.56,.64,1);
  --ease-out-quart: cubic-bezier(.25,1,.5,1);
}
@supports (font-variation-settings: normal){
  body{font-feature-settings:"cv11","ss01","ss03";letter-spacing:-.01em}
}

/* Cards — softer depth, inner highlight, hover lift */
.card{
  border-radius:26px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.025), transparent 30%),
    linear-gradient(180deg,var(--surf),var(--surf2));
  box-shadow:
    0 1px 0 rgba(255,255,255,.05) inset,
    0 0 0 1px rgba(255,255,255,.02) inset,
    0 12px 32px -18px rgba(0,0,0,.7);
  transition:transform .35s var(--ease-out-quart), box-shadow .35s var(--ease-out-quart);
}
.card:active{transform:scale(.992)}
.card-hero{
  border-radius:30px;
  background:
    radial-gradient(120% 80% at 0% 0%, rgba(139,92,246,.10), transparent 55%),
    radial-gradient(100% 80% at 100% 100%, rgba(6,182,212,.08), transparent 55%),
    linear-gradient(160deg,#100f24,#0a0a16);
}

// safeStorage — wrapper résilient autour de localStorage
// Fallback mémoire si localStorage indisponible (WebView, mode privé, quota)
// ════════════════════════════════════════
const safeStorage = (function(){
  const mem = {};
  let ls = null;
  try {
    ls = window.localStorage;
    const probe = '__ss_probe__';
    ls.setItem(probe, '1'); ls.removeItem(probe);
  } catch(_) { ls = null; }
  return {
    getItem(k){
      try { return ls ? ls.getItem(k) : (k in mem ? mem[k] : null); }
      catch(_) { return (k in mem) ? mem[k] : null; }
    },
    setItem(k,v){
      try { if(ls) ls.setItem(k, String(v)); else mem[k] = String(v); }
      catch(_) { mem[k] = String(v); }
    },
    removeItem(k){
      try { if(ls) ls.removeItem(k); else delete mem[k]; }
      catch(_) { delete mem[k]; }
    },
    clear(){
      try { if(ls) ls.clear(); } catch(_){}
      for(const k in mem) delete mem[k];
    }
  };
})();

const DB='FinOS_v3';let db=null;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB,3);
  r.onerror=()=>rej(r.error);
  r.onsuccess=()=>{db=r.result;res(db)};
  r.onupgradeneeded=e=>{
    const d=e.target.result;
    ['transactions','accounts','categories','goals','settings','ivy_state','income_profile'].forEach(s=>{
      if(!d.objectStoreNames.contains(s)){
        const st=d.createObjectStore(s,{keyPath:(s==='settings')?'key':'id'});
        if(s==='transactions'){st.createIndex('date','date');st.createIndex('type','type')}
      }
    });
  };
});}
async function dbAll(s){if(!db)await openDB();return new Promise((res,rej)=>{const t=db.transaction(s,'readonly');const r=t.objectStore(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function dbPut(s,d){if(!db)await openDB();return new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');const r=t.objectStore(s).put(d);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function dbDel(s,id){if(!db)await openDB();return new Promise(res=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=()=>res()})}
async function dbClear(s){if(!db)await openDB();return new Promise(res=>{const t=db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=()=>res()})}

function ago(d){

  if(s<3600)return Math.floor(s/60)+t('ago_min');
  if(s<86400)return Math.floor(s/3600)+t('ago_h');

/* ════════════════════════════════════════════════════════════════════════════
   ALADDIN ENGINE v5.0 — Cycle-Aware Behavioral Finance Layer
   ─────────────────────────────────────────────────────────────────────────────
   Implémente les 5 piliers du blueprint v5.0 :
     1. Typage strict des transactions (heuristique rétro-compat)
     2. Détection automatique de cycle de revenu (clustering 90j)
     3. cycleContext + capital projeté + revenus manqués
     4. 3 projections probabilistes parallèles (stress / baseline / optimal)
     5. Matrice comportementale vectorielle + mémoire Ivy + preFlightCheck

   Architecture additive : 0 réécriture de l'existant. Tout est lu/calculé en
   surcouche au-dessus de `txs`, `accs`, `cats`, `settings`, `goals` déjà en
   scope global. Si l'engine échoue, le système retombe sur l'ancien chemin.
   ════════════════════════════════════════════════════════════════════════════ */
const ALADDIN = (function(){
  const MS_DAY = 86400000;
  const TX_TYPES = {
    EXPENSE_FIXED:'fixed_survival', EXPENSE_VARIABLE:'variable_daily',
    EXPENSE_ELASTIC:'elastic_pleasure', EXPENSE_IMPULSIVE:'impulsive_dopamine',
    TRANSFER_SAVINGS:'transfer_savings', TRANSFER_GOAL:'transfer_goal',
    INCOME_PRIMARY:'income_primary', INCOME_SECONDARY:'income_secondary',
    INCOME_EXCEPTIONAL:'income_exceptional'
  };

  /* ─── Pilier 1 : typage strict avec migration auto par heuristique ─── */
  function classifyTx(tx){
    if(tx.txType) return tx.txType;
    if(tx.type==='income'){
      // Salaire = INCOME_PRIMARY ; freelance/business = SECONDARY ; reste = EXCEPTIONAL/SECONDARY
      const cid=(tx.categoryId||'').toLowerCase();
      if(cid==='salary') return TX_TYPES.INCOME_PRIMARY;
      if(['freelance','business','youtube','invest_inc'].includes(cid)) return TX_TYPES.INCOME_SECONDARY;
      return TX_TYPES.INCOME_EXCEPTIONAL;
    }
    if(tx.type!=='expense') return null;
    // Transfert épargne : catégorie 'transfer' OU compte cible = savings
    const acc = (typeof accs!=='undefined') ? accs.find(a=>a.id===tx.accountId) : null;
    if(tx.categoryId==='transfer' || (acc && acc.type==='savings')) return TX_TYPES.TRANSFER_SAVINGS;
    // Heuristique rigid/elastic/invest existante
    const role = (typeof classifyCategoryRole==='function') ? classifyCategoryRole(tx.categoryId) : 'elastic';
    if(role==='rigid'){
      // Loyer/factures = FIXED ; alimentation/transport = VARIABLE
      if(['housing','bills'].includes(tx.categoryId)) return TX_TYPES.EXPENSE_FIXED;
      return TX_TYPES.EXPENSE_VARIABLE;
    }
    if(role==='invest') return TX_TYPES.EXPENSE_VARIABLE; // formation/outils = utilitaire
    // elastic : raffiner via heure + note
    const h = new Date(tx.date).getHours();
    const note = (tx.note||'').toLowerCase();
    const IMPULSE_KW = /snack|fast.?food|livraison|delivery|impulsion|envie|burger|pizza|glace|bonbon/i;
    if((h>=22 || h<5) && (tx.categoryId==='leisure' || tx.categoryId==='clothes' || IMPULSE_KW.test(note)))
      return TX_TYPES.EXPENSE_IMPULSIVE;
    if(['leisure','clothes','unforeseen'].includes(tx.categoryId) || IMPULSE_KW.test(note))
      return TX_TYPES.EXPENSE_IMPULSIVE;
    return TX_TYPES.EXPENSE_ELASTIC;
  }
  function isExpenseInBurn(tx){
    const tt=classifyTx(tx);
    return tt===TX_TYPES.EXPENSE_FIXED||tt===TX_TYPES.EXPENSE_VARIABLE||
           tt===TX_TYPES.EXPENSE_ELASTIC||tt===TX_TYPES.EXPENSE_IMPULSIVE;
  }
  function isEssential(tx){
    const tt=classifyTx(tx);
    return tt===TX_TYPES.EXPENSE_FIXED||tt===TX_TYPES.EXPENSE_VARIABLE;
  }
  function isElasticLike(tx){
    const tt=classifyTx(tx);
    return tt===TX_TYPES.EXPENSE_ELASTIC||tt===TX_TYPES.EXPENSE_IMPULSIVE;
  }

  /* ─── Pilier 2 : détection cycle par clustering 90j ─── */
  function detectIncomeCycle(){
    if(typeof txs==='undefined' || !txs.length) return {mode:'IRREGULAR',confidence:'LOW'};
    const cutoff = Date.now() - 90*MS_DAY;
    const primaries = txs.filter(t=>t.type==='income' && classifyTx(t)===TX_TYPES.INCOME_PRIMARY && new Date(t.date).getTime()>=cutoff)
                         .sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(primaries.length<2) return {mode:'IRREGULAR',confidence:'LOW',reason:'<2 revenus primaires'};
    // Clustering par montant (±15%)
    const clusters=[];
    for(const tx of primaries){
      const c = clusters.find(cl => Math.abs(cl.avg-tx.amount)/cl.avg <= 0.15);
      if(c){ c.items.push(tx); c.avg = c.items.reduce((s,x)=>s+x.amount,0)/c.items.length; }
      else clusters.push({avg:tx.amount,items:[tx]});
    }
    clusters.sort((a,b)=>b.items.length-a.items.length);
    const top = clusters[0];
    if(top.items.length<2) return {mode:'IRREGULAR',confidence:'LOW',reason:'pas de cluster récurrent'};
    // Analyse des deltas
    const deltas=[];
    for(let i=1;i<top.items.length;i++){
      deltas.push((new Date(top.items[i].date)-new Date(top.items[i-1].date))/MS_DAY);
    }
    const avgDelta = deltas.reduce((s,d)=>s+d,0)/deltas.length;
    const variance = deltas.reduce((s,d)=>s+Math.pow(d-avgDelta,2),0)/deltas.length;
    const stddev = Math.sqrt(variance);
    let cycleType='IRREGULAR', cycleLength=30;
    if(Math.abs(avgDelta-30)<=3 && stddev<5){ cycleType='MONTHLY'; cycleLength=30; }
    else if(Math.abs(avgDelta-14)<=2 && stddev<3){ cycleType='BIWEEKLY'; cycleLength=14; }
    else if(Math.abs(avgDelta-7)<=1.5 && stddev<2){ cycleType='WEEKLY'; cycleLength=7; }
    else return {mode:'IRREGULAR',confidence:'LOW',reason:'deltas chaotiques',avgDelta:Math.round(avgDelta)};
    const confidence = top.items.length>=3 ? 'HIGH' : 'MEDIUM';
    const lastIncome = top.items[top.items.length-1];
    return {
      mode:'DETECTED', cycleType, cycleLength,
      avgAmount: Math.round(top.avg),
      occurrences: top.items.length,
      confidence,
      lastIncomeDate: lastIncome.date,
      lastIncomeAmount: lastIncome.amount,
      avgDeltaDays: Math.round(avgDelta*10)/10
    };
  }

  /* ─── Profil déclaré (Mode C) ─── */
  function getDeclaredProfile(){
    try{
      if(typeof settings==='undefined') return null;
      const p = settings.incomeProfile;
      if(!p || !p.type || p.type==='irregular') return null;
      return p; // {type:'monthly'|'biweekly'|'weekly'|'daily', amount, dayOfMonth?, dayOfWeek?}
    }catch(e){return null;}
  }

  /* ─── Pilier 3 : cycleContext ─── */
  function buildCycleContext(){
    const declared = getDeclaredProfile();
    const detected = detectIncomeCycle();
    let cycleType, cycleLength, expectedAmount, confidence, mode, lastIncomeDate, lastIncomeAmount;

    if(declared){
      mode='DECLARED'; confidence='HIGH';
      cycleType = declared.type.toUpperCase();
      cycleLength = cycleType==='MONTHLY'?30:cycleType==='BIWEEKLY'?14:cycleType==='WEEKLY'?7:1;
      expectedAmount = parseFloat(declared.amount)||0;
      // Dernier revenu primary
      const lastP = txs.filter(t=>t.type==='income' && classifyTx(t)===TX_TYPES.INCOME_PRIMARY)
                       .sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      lastIncomeDate = lastP ? lastP.date : null;
      lastIncomeAmount = lastP ? lastP.amount : 0;
    } else if(detected.mode==='DETECTED' && detected.confidence!=='LOW'){
      mode='DETECTED';
      cycleType = detected.cycleType;
      cycleLength = detected.cycleLength;
      expectedAmount = detected.avgAmount;
      confidence = detected.confidence;
      lastIncomeDate = detected.lastIncomeDate;
      lastIncomeAmount = detected.lastIncomeAmount;
    } else {
      return {
        mode:'IRREGULAR', cycleType:'IRREGULAR', confidence:'LOW',
        cycleDay:null, cycleProgress:null, phase:'IRREGULAR',
        expectedAmount:0, receivedThisCycle:0, expectedCycleIncome:0,
        missedPaycheck:false, missedDays:0
      };
    }

    const now = Date.now();
    const daysSinceLast = lastIncomeDate ? Math.floor((now - new Date(lastIncomeDate).getTime())/MS_DAY) : cycleLength;
    const cycleDay = Math.min(cycleLength, daysSinceLast);
    const cycleProgress = cycleLength>0 ? cycleDay/cycleLength : 0;

    // Reçu ce cycle : toutes les transactions PRIMARY depuis cycleLength jours
    const cycleStart = now - cycleLength*MS_DAY;
    const receivedThisCycle = txs.filter(t=>t.type==='income' && classifyTx(t)===TX_TYPES.INCOME_PRIMARY && new Date(t.date).getTime()>=cycleStart)
                                 .reduce((s,t)=>s+t.amount,0);

    // Retard de revenu : si daysSinceLast > cycleLength
    const missedDays = Math.max(0, daysSinceLast - cycleLength);
    const missedPaycheck = missedDays >= 1;

    // expectedCycleIncome = ce qui reste à recevoir
    let expectedCycleIncome;
    if(missedDays >= 7){
      // Bascule auto en Mode A
      expectedCycleIncome = 0;
    } else if(receivedThisCycle >= expectedAmount*0.85){
      expectedCycleIncome = 0; // déjà reçu
    } else {
      expectedCycleIncome = Math.max(0, expectedAmount - receivedThisCycle);
    }

    // Phase
    let phase;
    if(daysSinceLast<=3) phase='POST_RECEPTION';
    else if(cycleProgress<0.2) phase='DEBUT';
    else if(cycleProgress<0.7) phase='MILIEU';
    else phase='FIN';

    return {
      mode, cycleType, cycleLength, cycleDay, cycleProgress, phase,
      expectedAmount, receivedThisCycle, expectedCycleIncome,
      missedPaycheck, missedDays, confidence,
      daysSinceLast, lastIncomeDate, lastIncomeAmount,
      daysToNextExpected: Math.max(0, cycleLength - daysSinceLast)
    };
  }

  /* ─── Pilier 4 : 3 projections parallèles ─── */
  function buildProjections(kpi, ctx){
    const win = Math.max(7, kpi.dataDays||30);
    const w30 = txs.filter(t=>new Date(t.date).getTime() >= Date.now()-30*MS_DAY);
    const essentialExp = w30.filter(t=>t.type==='expense' && isEssential(t)).reduce((s,t)=>s+t.amount,0);
    const elasticExp   = w30.filter(t=>t.type==='expense' && isElasticLike(t)).reduce((s,t)=>s+t.amount,0);
    const dailyEssential = essentialExp / Math.min(30, win);
    const dailyElastic   = elasticExp / Math.min(30, win);
    const dailyTotal     = dailyEssential + dailyElastic;
    // Burn max sur 30j (jour le plus dépensier)
    const byDay={};
    w30.filter(t=>t.type==='expense' && isExpenseInBurn(t)).forEach(t=>{
      const k=new Date(t.date).toDateString();
      byDay[k]=(byDay[k]||0)+t.amount;
    });
    const maxDaily = Math.max(dailyTotal, ...Object.values(byDay), 1);

    const confFactor = ctx.confidence==='HIGH'?0.9:ctx.confidence==='MEDIUM'?0.55:0;
    const projectedIncome = ctx.expectedCycleIncome * confFactor;

    const balance = kpi.activeBalance||0;

    return {
      stress: {
        runwayDays: dailyEssential>0 ? Math.floor(balance / dailyEssential) : (balance>0?9999:0),
        burnRate: Math.round(dailyEssential),
        label:'Si aucun revenu n\'arrive (essentiel uniquement)'
      },
      baseline: {
        runwayDays: dailyTotal>0 ? Math.floor((balance + projectedIncome) / dailyTotal) : (balance>0?9999:0),
        cycleEndBalance: Math.round(balance + projectedIncome - dailyTotal*Math.max(0,ctx.daysToNextExpected||0)),
        burnRate: Math.round(dailyTotal),
        label:'Au rythme actuel (revenu attendu inclus)'
      },
      optimal: {
        savingsPotential: Math.round(elasticExp),
        cycleEndOptimal: Math.round(balance + projectedIncome - dailyEssential*Math.max(0,ctx.daysToNextExpected||0)),
        label:'Si tu coupes tout l\'élastique maintenant'
      },
      _internals:{dailyEssential,dailyElastic,dailyTotal,maxDaily,elasticExp,confFactor,projectedIncome}
    };
  }

  /* ─── Pilier 5 : matrice vectorielle ─── */
  function buildBehavioralVectors(kpi, ctx, proj){
    const now = Date.now();
    const w30 = txs.filter(t=>new Date(t.date).getTime() >= now-30*MS_DAY);
    const w90 = txs.filter(t=>new Date(t.date).getTime() >= now-90*MS_DAY);

    // V1 — Évaporation pulsatile (72h post-revenu)
    const primaries = w30.filter(t=>t.type==='income' && classifyTx(t)===TX_TYPES.INCOME_PRIMARY);
    let evaporation = 0;
    if(primaries.length){
      const samples = primaries.map(inc=>{
        const t0=new Date(inc.date).getTime();
        const spent = txs.filter(t=>t.type==='expense' && new Date(t.date).getTime()>=t0 && new Date(t.date).getTime()<=t0+3*MS_DAY)
                         .reduce((s,t)=>s+t.amount,0);
        return inc.amount>0 ? spent/inc.amount : 0;
      });
      evaporation = samples.reduce((s,v)=>s+v,0)/samples.length;
    }

    // V2 — Index dopamine sémantique
    const impulsive = w30.filter(t=>t.type==='expense' && classifyTx(t)===TX_TYPES.EXPENSE_IMPULSIVE).reduce((s,t)=>s+t.amount,0);
    const totalExp = w30.filter(t=>t.type==='expense' && isExpenseInBurn(t)).reduce((s,t)=>s+t.amount,0);
    const dopamineIndex = totalExp>0 ? Math.round((impulsive/totalExp)*100) : 0;

    // V3 — Indice de gravité (runway essentiel)
    const survivalDays = proj.stress.runwayDays;

    // V4 — Cohérence personnelle (cette semaine vs médiane 90j par catégorie)
    const catMedians={};
    for(let i=0;i<12;i++){
      const wstart = now - (i+1)*7*MS_DAY;
      const wend   = now - i*7*MS_DAY;
      const week = w90.filter(t=>t.type==='expense' && new Date(t.date).getTime()>=wstart && new Date(t.date).getTime()<wend);
      week.forEach(t=>{
        catMedians[t.categoryId] = catMedians[t.categoryId]||[];
        // accumule par semaine
      });
    }
    // simplification : médiane par catégorie sur les sommes hebdo
    const catWeekSums = {};
    for(let i=0;i<12;i++){
      const wstart=now-(i+1)*7*MS_DAY, wend=now-i*7*MS_DAY;
      const sums={};
      w90.filter(t=>t.type==='expense' && new Date(t.date).getTime()>=wstart && new Date(t.date).getTime()<wend)
         .forEach(t=>{sums[t.categoryId]=(sums[t.categoryId]||0)+t.amount;});
      Object.keys(sums).forEach(cid=>{
        catWeekSums[cid]=catWeekSums[cid]||[];
        catWeekSums[cid].push(sums[cid]);
      });
    }
    const median = arr => { if(!arr.length) return 0; const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
    const thisWeek={};
    w30.filter(t=>t.type==='expense' && new Date(t.date).getTime()>=now-7*MS_DAY)
       .forEach(t=>{thisWeek[t.categoryId]=(thisWeek[t.categoryId]||0)+t.amount;});
    let divergences=[];
    Object.keys(thisWeek).forEach(cid=>{
      const med = median(catWeekSums[cid]||[]);
      if(med>0 && thisWeek[cid] > med*1.4){
        divergences.push({cat:cid, week:Math.round(thisWeek[cid]), median:Math.round(med), excess: Math.round((thisWeek[cid]/med-1)*100)});
      }
    });
    const coherence = Math.max(0, 100 - divergences.length*15);

    // V5 — Index de restriction volontaire / survie
    const w7 = w30.filter(t=>new Date(t.date).getTime() >= now-7*MS_DAY);
    const elastic7 = w7.filter(t=>t.type==='expense' && isElasticLike(t)).reduce((s,t)=>s+t.amount,0);
    const elasticMedian = median(catWeekSums['leisure']||[]) + median(catWeekSums['clothes']||[]) + median(catWeekSums['unforeseen']||[]);
    const total7 = w7.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const totalMedian = (kpi.exp30||0)/4;
    let restrictionMode='NORMAL';
    if(elasticMedian>0 && elastic7 < elasticMedian*0.2 && (kpi.activeBalance||0) > totalMedian*0.3){
      restrictionMode='VOLONTAIRE';
    } else if(totalMedian>0 && total7 < totalMedian*0.3 && (proj.stress.runwayDays<7)){
      restrictionMode='SURVIE';
    }

    return {
      evaporationRate: Math.round(evaporation*100),
      dopamineIndex,
      survivalDays,
      coherenceScore: coherence,
      divergences,
      restrictionMode
    };
  }

  /* ─── Pilier 5 bis : mémoire Ivy (IndexedDB ivy_state) ─── */
  let _ivyState = null;
  async function getIvyState(){
    if(_ivyState) return _ivyState;
    try{
      if(typeof db==='undefined' || !db) return _defaultIvyState();
      if(!db.objectStoreNames.contains('ivy_state')) return _defaultIvyState();
      const result = await new Promise((res,rej)=>{
        const tx = db.transaction('ivy_state','readonly');
        const r = tx.objectStore('ivy_state').get('main');
        r.onsuccess = ()=>res(r.result);
        r.onerror = ()=>rej(r.error);
      });
      _ivyState = result || _defaultIvyState();
      return _ivyState;
    }catch(e){ return _defaultIvyState(); }
  }
  function _defaultIvyState(){
    return {
      id:'main',
      activeDirectives:[],
      learnedPatterns:{},
      toneProfile:{complianceRate:1,tone:'GENTLE'},
      recentAssessments:[]
    };
  }
  async function saveIvyState(state){
    try{
      _ivyState = state;
      if(typeof db==='undefined' || !db) return;
      if(!db.objectStoreNames.contains('ivy_state')) return;
      await new Promise((res,rej)=>{
        const tx = db.transaction('ivy_state','readwrite');
        const r = tx.objectStore('ivy_state').put(state);
        r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);
      });
    }catch(e){}
  }
  async function issueDirective(type, threshold, expiresInDays){
    const state = await getIvyState();
    state.activeDirectives = (state.activeDirectives||[]).filter(d=>d.type!==type);
    state.activeDirectives.push({
      id:'dir_'+Date.now(), issued:new Date().toISOString(),
      expiresAt: new Date(Date.now()+expiresInDays*MS_DAY).toISOString(),
      type, threshold, status:'ACTIVE', violationsCount:0
    });
    await saveIvyState(state);
  }
  async function preFlightCheck(newTx){
    try{
      const state = await getIvyState();
      const dirs = (state.activeDirectives||[]).filter(d=>new Date(d.expiresAt)>new Date());
      const violations=[];
      const h = new Date(newTx.date||Date.now()).getHours();
      for(const d of dirs){
        if(d.type==='NIGHT_SPENDING' && newTx.type==='expense' && h>=(d.threshold||22)){
          violations.push(d.type); d.violationsCount=(d.violationsCount||0)+1;
        }
        if(d.type==='ELASTIC_CAP' && newTx.type==='expense'){
          const role = (typeof classifyCategoryRole==='function') ? classifyCategoryRole(newTx.categoryId) : 'elastic';
          if(role==='elastic'){ violations.push(d.type); d.violationsCount++; }
        }
      }
      if(violations.length){
        newTx.complianceFlag='VIOLATION';
        newTx.violatedDirectives=violations;
        state.activeDirectives = dirs;
        await saveIvyState(state);
      }
      return {ok:true, violations};
    }catch(e){ return {ok:true, violations:[]}; }
  }

  /* ─── API publique : snapshot complet pour buildCtx et risk ─── */
  function snapshot(kpi){
    try{
      const ctx = buildCycleContext();
      const proj = buildProjections(kpi, ctx);
      const vectors = buildBehavioralVectors(kpi, ctx, proj);
      // safety effectif cycle-aware
      const safetyReal = proj.stress.runwayDays;
      const safetyProj = proj.baseline.runwayDays;
      let effectiveRisk;
      if(ctx.missedDays>=7 || ctx.mode==='IRREGULAR'){
        // mode A : ne pas écraser
        effectiveRisk = null;
      } else if(safetyReal>15){
        effectiveRisk='STABLE';
      } else if(safetyReal<7 && safetyProj>15){
        effectiveRisk='MODERATE_PENDING_INCOME';
      } else if(safetyReal<7 && safetyProj<7){
        effectiveRisk='CRITICAL';
      } else if(ctx.phase==='FIN'){
        effectiveRisk='HIGH_NORMAL_END_CYCLE';
      } else {
        effectiveRisk='HIGH';
      }
      return {ctx, proj, vectors, effectiveRisk, safetyReal, safetyProj};
    }catch(e){ console.warn('[ALADDIN] snapshot fail',e); return null; }
  }

  return {
    TX_TYPES, classifyTx, isExpenseInBurn, isEssential, isElasticLike,
    detectIncomeCycle, getDeclaredProfile, buildCycleContext,
    buildProjections, buildBehavioralVectors,
    getIvyState, saveIvyState, issueDirective, preFlightCheck,
    snapshot
  };
})();

        </div>
      `;
      if(typeof openModal==='function') openModal(html);
    }
  }catch(e){}
}


// Mémoïsation par tick de render — invalidée par invalidateKPICache()
let _kpiCache=null;
function invalidateKPICache(){ _kpiCache=null; }
function computeKPIs(){
  if(_kpiCache) return _kpiCache;
  const _result = _computeKPIsImpl();
  _kpiCache = _result;
  return _result;
}
function _computeKPIsImpl(){
  const now=new Date();
  // ── Fenêtre adaptative — si moins de 14j de données, on calcule sur les jours réels ──
  const firstTxDate=txs.length?new Date(txs[txs.length-1].date):now;
  const dataDays=Math.max(1,Math.min(30,Math.ceil((now-firstTxDate)/86400000)+1));
  const isShortHistory=dataDays<14;
  const win30=isShortHistory?dataDays:30;
  const win7 =Math.min(7,dataDays);

  // ── DÉTECTION DU SILENCE ─────────────────────────────────────────────────
  const sortedAll=[...txs].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const derniereTx=sortedAll.length?new Date(sortedAll[0].date):null;
  const joursSansSaisie=derniereTx?Math.floor((now-derniereTx)/86400000):null;
  // Silence = aucune saisie depuis 4j ou plus (comportement d'évitement probable)
  const isSilent=txs.length>0 && joursSansSaisie!==null && joursSansSaisie>=4;

  // ── Fenêtres glissantes ──────────────────
  const w7 =txsInWindow(win7);
  const w30=txsInWindow(win30);

  const inc7 =w7 .filter(t=>t.type==='income' ).reduce((s,t)=>s+t.amount,0);
  const exp7 =w7 .filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const inc30=w30.filter(t=>t.type==='income' ).reduce((s,t)=>s+t.amount,0);
  const exp30=w30.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

  // ── Comptes ─────────────────────────────
  const activeBalance=accs.filter(a=>a.type!=='savings').reduce((s,a)=>s+a.balance,0);
  const savingsBalance=accs.filter(a=>a.type==='savings').reduce((s,a)=>s+a.balance,0);
  const balance=activeBalance;

  // ── Burn rate lissé — ADAPTATIF au silence ──────────────────────────────
  // Si silence prolongé (≥4j), le burn rate est mis à 0 : l'utilisateur ne saisit plus,
  // on ne peut pas extrapoler une consommation journalière fictive.
  // On conserve le burnRateHistorique pour les Safety Days "avec épargne".
  const burnRateHistorique=win30>0&&exp30>0?exp30/win30:0;
  const burnRate=isSilent?0:burnRateHistorique;

  // ── Revenus attendus (Cushion prévisionnel) ─────────
  const expectedIncome7d=parseFloat(settings.expectedIncome7d)||0;
  // Safety days : si burnRate=0 (silence) et capital>0, on affiche ∞ pour le capital
  // mais on utilise burnRateHistorique pour calculer les jours avec épargne
  const safetyDays=burnRate>0?Math.floor(balance/burnRate):(balance>0?9999:0);
  const safetyDaysWithSavings=burnRateHistorique>0
    ?Math.floor((balance+savingsBalance+expectedIncome7d)/burnRateHistorique)
    :(balance+savingsBalance>0?9999:0);

  // ── Taux de Rétention — fenêtre adaptative ──
  const retention=inc30>0?Math.max(0,Math.round(((inc30-exp30)/inc30)*100)):null;

  // ── Indice de Pression — désactivé si historique court OU silence ──────
  // En silence, afficher -100% (0 dépenses / habitude normale) est trompeur.
  // On le passe en mode "données insuffisantes" = null.
  let pressureIdx=0;
  let pressureDataOK=false;
  if(!isShortHistory && !isSilent){
    const dailyAvg30=exp30/win30;
    const dailyAvg7 =exp7/win7;
    pressureIdx=dailyAvg30>0?Math.round(((dailyAvg7-dailyAvg30)/dailyAvg30)*100):0;
    pressureDataOK=true;
  }

  // ── Vélocité post-revenu ─────────────────
  let evaporationRate=0;
  const incomeEvents=txs.filter(t=>t.type==='income').slice(0,5);
  if(incomeEvents.length){
    const samples=incomeEvents.map(inc=>{
      const t0=new Date(inc.date).getTime();
      const spent48h=txs.filter(t=>t.type==='expense'&&new Date(t.date).getTime()>=t0&&new Date(t.date).getTime()<=t0+172800000).reduce((s,t)=>s+t.amount,0);
      return inc.amount>0?spent48h/inc.amount:0;
    });
    evaporationRate=Math.round((samples.reduce((s,v)=>s+v,0)/samples.length)*100);
  }

  // ── Dopamine Index ───────────────────────
  const IMPULSE_CATS=['leisure','clothes','unforeseen','other_exp'];
  const FOOD_IMPULSE_KEYWORDS=/snack|fast.?food|livraison|delivery|resto|burger|pizza|glace|bonbon/i;
  const isFoodImpulse=t=>t.categoryId==='food' && t.note && FOOD_IMPULSE_KEYWORDS.test(t.note);
  const INVEST_CATS=['tech','studies','invest_inc','youtube'];
  // Dopamine = catégories explicitement plaisir + food impulsif via mots-clés.
  // On NE compte PAS isElasticExpense ici (double-comptage des leisure/clothes).
  const impulseSpend=w30.filter(t=>t.type==='expense'&&!isRigidExpense(t)&&!isInvestExpense(t)&&(IMPULSE_CATS.includes(t.categoryId)||isFoodImpulse(t))).reduce((s,t)=>s+t.amount,0);
  const investSpend=w30.filter(t=>t.type==='expense'&&(INVEST_CATS.includes(t.categoryId)||isInvestExpense(t))).reduce((s,t)=>s+t.amount,0);
  const dopamineIdx=exp30>0?Math.round((impulseSpend/exp30)*100):0;
  const investIdx  =exp30>0?Math.round((investSpend/exp30)*100):0;
  // ── Effet Fourmi — petites tx <seuil cumulées 30j ──
  const ANT_THRESHOLD=parseFloat(settings.antThreshold)||200;
  const antTotal=w30.filter(t=>t.type==='expense'&&t.amount<=ANT_THRESHOLD).reduce((s,t)=>s+t.amount,0);
  const antCount=w30.filter(t=>t.type==='expense'&&t.amount<=ANT_THRESHOLD).length;
  // ── Mode fin de mois ──
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const isEndOfMonth=(dim-now.getDate())<=4;

  // ── Empreinte chrono (dépenses nocturnes) ─
  const nightTxs=w30.filter(t=>{const h=new Date(t.date).getHours();return t.type==='expense'&&(h>=21||h<5)});
  const nightSpend=nightTxs.reduce((s,t)=>s+t.amount,0);
  const nightPct=exp30>0?Math.round((nightSpend/exp30)*100):0;

  // ── Cat breakdown (30j) ──────────────────
  const catSpend={};
  w30.filter(t=>t.type==='expense').forEach(t=>{catSpend[t.categoryId]=(catSpend[t.categoryId]||0)+t.amount});
  const topCatId=Object.keys(catSpend).sort((a,b)=>catSpend[b]-catSpend[a])[0];
  const topCat=topCatId?catById(topCatId):null;

  // ── Compatibilité rétrograde ──
  const mt=monthTxs();
  const income=mt.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=mt.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const daysPassed=Math.max(1,now.getDate());
  const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const daysLeft=daysInMonth-daysPassed;
  const projExp=burnRateHistorique*daysInMonth;
  // Fix: comparer deux projections complètes (revenus extrapolés vs dépenses projetées)
  // évite le faux-ÉLEVÉ en début de mois quand les revenus ne sont pas encore tous enregistrés
  const dailyIncome=daysPassed>0?income/daysPassed:0;
  const projIncome=dailyIncome*daysInMonth;
  const projDelta=projIncome-projExp;
  // Discipline: en silence, on ne récompense pas l'absence de saisie
  const discipline=isSilent?Math.max(10,retention!==null?Math.min(60,retention):30)
    :retention!==null?Math.min(100,Math.max(0,30+retention)):50;
  const stability=50;

  // ── SCORE DE FRICTION (Ivy) ──────────────
  // En silence, le score reflète l'incohérence comportementale (pas de saisie = dérive)
  let frictionScore=70;
  try{
    if(isSilent){
      // Silence prolongé = dérive garantie, score pénalisé selon durée
      frictionScore=Math.max(0,Math.min(55,60-(joursSansSaisie*3)));
    } else {
      const pg=(typeof getPriorityGoal==='function')?getPriorityGoal():null;
      let alignment=70;
      if(pg && pg.deadline){
        const gap=pg.target-pg.saved;
        const joursDeadline=Math.max(1,Math.ceil((new Date(pg.deadline)-Date.now())/86400000));
        const surplusRequis=gap/joursDeadline;
        const surplusReel=Math.max(0,(inc30/30)-burnRate);
        const ratio=surplusRequis>0?surplusReel/surplusRequis:1;
        alignment=Math.max(0,Math.min(100,Math.round(ratio*70)));
      }
      const penDopamine=Math.max(0,(dopamineIdx-40))*0.4;
      const penNight   =Math.max(0,(nightPct  -15))*0.6;
      const penPressure=pressureDataOK?Math.max(0,pressureIdx)*0.3:0;
      frictionScore=Math.max(0,Math.min(100,Math.round(alignment - penDopamine - penNight - penPressure)));
    }
  }catch(e){}

  const result={
    balance,activeBalance,savingsBalance,expectedIncome7d,
    dataDays,isShortHistory,isEndOfMonth,
    antTotal,antCount,antThreshold:ANT_THRESHOLD,
    safetyDaysWithSavings,
    inc7,exp7,inc30,exp30,
    burnRate,burnRateHistorique,safetyDays,
    retention,pressureIdx,pressureDataOK,evaporationRate,
    dopamineIdx,investIdx,
    nightSpend,nightPct,
    catSpend,topCat,
    income,expense,discipline,stability,
    projDelta,projExp,daysLeft,daysInMonth,daysPassed,
    frictionScore,
    // Silence
    isSilent,joursSansSaisie,
  };
  try{
    const snap = (typeof ALADDIN!=='undefined') ? ALADDIN.snapshot({
      activeBalance, savingsBalance, exp30, inc30, burnRate, dataDays
    }) : null;
    if(snap){
      result.aladdin = snap;
      result.cycleContext = snap.ctx;
      result.projections = snap.proj;
      result.behavioralVectors = snap.vectors;
      result.effectiveRisk = snap.effectiveRisk;
    }
  }catch(e){ console.warn('[ALADDIN] enrich fail',e); }
  return result;
}

// RISK
// ════════════════════════════════════════
function riskLevel(kpi){
  // ── ALADDIN v5 : cycle-aware override ──
  try{
    if(kpi.effectiveRisk && kpi.cycleContext && kpi.cycleContext.mode!=='IRREGULAR'){
      const r = kpi.effectiveRisk;
      if(r==='STABLE')   return{l:t('risk_stable'),c:'var(--grn)'};
      if(r==='MODERATE_PENDING_INCOME') return{l:t('risk_moderate'),c:'var(--ylw)'};
      if(r==='HIGH_NORMAL_END_CYCLE')   return{l:t('risk_moderate'),c:'var(--ylw)'};
      if(r==='HIGH')     return{l:t('risk_high'),c:'var(--org)'};
      if(r==='CRITICAL') return{l:t('risk_critical'),c:'var(--red)'};
    }
  }catch(e){}
  // Fallback : logique d'origine (Mode A irrégulier)
  if(kpi.safetyDays<7||kpi.projDelta<-kpi.income*.3)return{l:t('risk_critical'),c:'var(--red)'};
  if(kpi.safetyDays<15||kpi.projDelta<0)return{l:t('risk_high'),c:'var(--org)'};
  if(kpi.safetyDays<30)return{l:t('risk_moderate'),c:'var(--ylw)'};
  return{l:t('risk_stable'),c:'var(--grn)'};
}

// Background shifts based on financial state
// ════════════════════════════════════════
function updateFinancialAmbiance(){
  try{
    const kpi=computeKPIs();
    const body=document.body;
    body.classList.remove('state-critical','state-high','state-moderate','state-stable','state-zero');
    // L'ambiance reflète l'autonomie RÉELLE (capital actif + épargne + revenus attendus)
    // pour rester cohérente avec le badge hero qui atténue déjà CRITIQUE quand l'épargne couvre.
    const eff = kpi.safetyDaysWithSavings;
    if(!txs.length){
      body.classList.add('state-zero');
    } else if(kpi.effectiveRisk && kpi.cycleContext && kpi.cycleContext.mode!=='IRREGULAR'){
      // ALADDIN v5 cycle-aware ambiance
      const r=kpi.effectiveRisk;
      if(r==='CRITICAL') body.classList.add('state-critical');
      else if(r==='HIGH') body.classList.add('state-high');
      else if(r==='MODERATE_PENDING_INCOME'||r==='HIGH_NORMAL_END_CYCLE') body.classList.add('state-moderate');
      else body.classList.add('state-stable');
    } else if(kpi.safetyDays<7 && eff<7){
      body.classList.add('state-critical');
    } else if(eff<15 || kpi.projDelta<-kpi.income*.3){
      body.classList.add('state-high');
    } else if(eff<30 || kpi.projDelta<0){
      body.classList.add('state-moderate');
    } else {
      body.classList.add('state-stable');
    }
  }catch(e){}
}

// MÉDIANE MOBILE — Moteur anti-panique v4.14
// Évite que les pics de revenus ou dépenses
// faussent les calculs comportementaux
// ════════════════════════════════════════
function calculerMediane(valeurs){
  if(!valeurs||!valeurs.length) return 0;
  const s=[...valeurs].sort((a,b)=>a-b);
  const m=Math.floor(s.length/2);
  return s.length%2!==0?s[m]:(s[m-1]+s[m])/2;
}

function getRevenuHebdoMedian(){
  // Calcule le revenu médian des 4 dernières semaines (semaines glissantes)
  const semaines=[];
  for(let i=0;i<4;i++){
    const debut=new Date(Date.now()-(i+1)*7*86400000);
    const fin=new Date(Date.now()-i*7*86400000);
    const rev=txs.filter(tx=>tx.type==='income'&&new Date(tx.date)>=debut&&new Date(tx.date)<fin).reduce((s,tx)=>s+tx.amount,0);
    semaines.push(rev);
  }
  return calculerMediane(semaines);
}

function getDepenseHebdoMediane(){
  const semaines=[];
  for(let i=0;i<4;i++){
    const debut=new Date(Date.now()-(i+1)*7*86400000);
    const fin=new Date(Date.now()-i*7*86400000);
    const dep=txs.filter(tx=>tx.type==='expense'&&new Date(tx.date)>=debut&&new Date(tx.date)<fin).reduce((s,tx)=>s+tx.amount,0);
    semaines.push(dep);
  }
  return calculerMediane(semaines);
}

// ════════════════════════════════════════
// ANALYSEUR COMPORTEMENTAL POLYVALENT v4.14
// Détecte: revenu exceptionnel, restriction,
// pic dopamine — adapte le rythme sans paniquer
// ════════════════════════════════════════
function analyserComportementFinancier(){
  const kpi=computeKPIs();
  const medRev=getRevenuHebdoMedian();
  const medDep=getDepenseHebdoMediane();

  // Fenêtre 7j courante
  const dep7=kpi.exp7;
  const rev7=kpi.inc7;

  // Catégoriser les dépenses 7j, y compris catégories personnalisées
  const w7txs=txsInWindow(7);
  const dep7Rigides=w7txs.filter(tx=>tx.type==='expense'&&isRigidExpense(tx)).reduce((s,tx)=>s+tx.amount,0);
  const dep7Elastiques=w7txs.filter(tx=>tx.type==='expense'&&isElasticExpense(tx)).reduce((s,tx)=>s+tx.amount,0);

  let profilEtat='NORMAL';
  let rythmeAutorise=medDep||kpi.burnRate*7;
  let messageContextuel='';
  let tamponAmortissement=0;

  // Scénario A: Rentrée exceptionnelle
  if(medRev>0&&rev7>medRev*2.5){
    profilEtat='EXCEPTIONAL_INCOME';
    tamponAmortissement=rev7-medRev;
    rythmeAutorise=medDep;
    messageContextuel=`Rentrée majeure de ${fmtFull(rev7)} détectée (${Math.round(rev7/medRev*10)/10}× ta médiane). Placée en tampon de sécurité. Ton rythme reste calibré sur tes habitudes réelles.`;
  }
  // Scénario B: Restriction alimentaire/essentielle
  else if(medDep>0&&dep7Rigides>0&&dep7Rigides<medDep*0.4){
    profilEtat='USER_RESTRICTION';
    rythmeAutorise=dep7;
    messageContextuel=`Dépenses essentielles en baisse de ${Math.round((1-dep7Rigides/(medDep*0.6))*100)}% vs habitude. Si c'est un effort délibéré, bravo. Attention à ne pas fragiliser l'équilibre physique.`;
  }
  // Scénario C: Pic dopamine/plaisir
  else if(medDep>0&&dep7Elastiques>medDep*1.2){
    profilEtat='PLEASURE_SPIKE';
    const amortissement=dep7Elastiques/4;
    rythmeAutorise=Math.max(0,medDep-amortissement);
    messageContextuel=`Pic de dépenses plaisir (+${Math.round((dep7Elastiques/medDep-1)*100)}%). Pas de panique — amorti sur 4 semaines. Ton rythme hebdo est ajusté de ${fmtFull(amortissement)}.`;
  }
  // Scénario D: Aucun revenu historique (mode subsistance)
  else if(!txs.filter(tx=>tx.type==='income').length){
    profilEtat='NO_INCOME_MODE';
    rythmeAutorise=kpi.activeBalance/30;
    messageContextuel=`Aucun revenu enregistré. Calcul basé sur le capital disponible. Chaque dépense compte double.`;
  }

  return{profilEtat,rythmeAutorise,tamponAmortissement,messageContextuel,medRev,medDep};
}

// ANALYSEUR SÉMANTIQUE LOCAL v4.14
// Parse les notes pour classifier intent
// Fonctionne 100% offline
// ════════════════════════════════════════
const DICT_URGENCE=['pharmacie','hopital','hôpital','maman','papa','reparation','réparation','panne','facture','byu','urgence','médicament','medicament','soin','doctor','docteur','clinique','accident'];
const DICT_PLAISIR=['resto','restaurant','mcdo','burger','pizza','fete','fête','sortie','cadeau','anime','manga','netflix','one piece','les gars','shopping','mode','vêtement','loisir','jeu','jeux'];
const DICT_RESTRICTION=['economie','économie','épargne','epargne','regime','régime','jeune','frugal','coupe','réduis','reduire','serrer','ceinture'];
const DICT_TRAVAIL=['cours','byu','études','etudes','livre','formation','outil','investissement','investir','freelance','mission','contrat'];

function extraireContexteSemantique(noteText, heureSaisie){
  const texte=(noteText||'').toLowerCase();
  const heure=heureSaisie||new Date().getHours();
  let categorieStyle='standard';
  let estUrgent=false;
  let chargeEmotionnelle='neutre';
  let profilHoraire='journee';
  let iconeContexte='';

  if(DICT_URGENCE.some(m=>texte.includes(m))){
    categorieStyle='rigide_urgente';
    estUrgent=true;
    chargeEmotionnelle='pression_subie';
    iconeContexte='🚨';
  } else if(DICT_TRAVAIL.some(m=>texte.includes(m))){
    categorieStyle='investissement';
    chargeEmotionnelle='investissement_futur';
    iconeContexte='📚';
  } else if(DICT_RESTRICTION.some(m=>texte.includes(m))){
    categorieStyle='restriction_volontaire';
    chargeEmotionnelle='discipline';
    iconeContexte='✊';
  } else if(DICT_PLAISIR.some(m=>texte.includes(m))){
    categorieStyle='elastique_plaisir';
    chargeEmotionnelle='dopamine';
    iconeContexte='⚡';
  }

  if(heure>=22||heure<=5){
    profilHoraire='nocturne_impulsif';
    if(!estUrgent&&categorieStyle==='standard') chargeEmotionnelle='impulsion_nocturne';
    iconeContexte=iconeContexte||'🌙';
  } else if(heure>=12&&heure<=14){
    profilHoraire='dejeuner';
  }

  return{categorieStyle,estUrgent,chargeEmotionnelle,profilHoraire,iconeContexte};
}

async function quickCatchupAdd(catId, estimatedAmt){
  if(!estimatedAmt||estimatedAmt<=0){openAddModal();return;}
  const confirmed=confirm(`Enregistrer ~${fmtFull(estimatedAmt)} en "${catById(catId).name}" pour les ${computeKPIs().joursSansSaisie} jours manquants ?`);
  if(!confirmed) return;
  const mainAcc=accs.find(a=>a.type!=='savings')||accs[0];
  if(!mainAcc){openAddModal();return;}
  const tx={id:uid(),type:'expense',amount:estimatedAmt,categoryId:catId,accountId:mainAcc.id,date:new Date().toISOString(),note:'[Rattrapage auto]',mood:null,location:null,semantique:{categorieStyle:'rigide_urgente',estUrgent:false,chargeEmotionnelle:'neutre',profilHoraire:'journee',iconeContexte:'⏱️'}};
  mainAcc.balance=Math.max(0,mainAcc.balance-estimatedAmt);
  await dbPut('transactions',tx);
  await dbPut('accounts',mainAcc);
  txs.unshift(tx);
  showToast('✅ Dépense de rattrapage enregistrée');
  render();
}

// === v4.13 Fetch wrapper with error handling ===
const safeFetch = async (url, options = {}) => {
  try {
    const response = await fetch(url, options);
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    return response;
  } catch (error) {
    console.error('[API] Fetch failed:', url, error.message);
    
    // Show user-friendly error
    if (!navigator.onLine) {
      showNotif('[OFFLINE] No internet connection', 'error');
    } else {
      showNotif('[API ERROR] ' + error.message, 'error');
    }
    
    throw error;
  }
};

async function buildCtx(){
  const k=computeKPIs();

  // ── CONTEXTE TEMPOREL RÉEL (injecté à chaque appel) ──────────────────────
  const now=new Date();
  const currentHour=now.getHours();
  const currentMinute=now.getMinutes();
  const currentDayName=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][now.getDay()];
  const currentDateISO=now.toISOString().slice(0,10);
  const currentDateStr=now.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  let momentOfDay='';
  if(currentHour>=5&&currentHour<12) momentOfDay='matin';
  else if(currentHour>=12&&currentHour<14) momentOfDay='heure du déjeuner';
  else if(currentHour>=14&&currentHour<18) momentOfDay='après-midi';
  else if(currentHour>=18&&currentHour<21) momentOfDay='soirée';
  else momentOfDay='nuit (zone de risque d\'impulsion)';

  // ── DÉTECTION DU SILENCE (jours sans saisie) ─────────────────────────────
  const sortedTxs=[...txs].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const derniereTxDate=sortedTxs.length?new Date(sortedTxs[0].date):null;
  const joursSansSaisie=derniereTxDate
    ? Math.floor((now-derniereTxDate)/86400000)
    : null;
  const todayTxs=txs.filter(tx=>{
    const d=new Date(tx.date);
    return d.toDateString()===now.toDateString();
  });
  const aucuneSaisieAujourdhui=todayTxs.length===0;
  // Drapeaux pour le prompt
  const silenceAlert=joursSansSaisie!==null&&joursSansSaisie>=2;
  const silenceCritique=joursSansSaisie!==null&&joursSansSaisie>=5;

  // ── ANALYSE D'HUMEUR RÉCENTE ─────────────────────────────────────────────
  const recentMoods=sortedTxs.slice(0,5).filter(t=>t.mood).map(t=>t.mood);
  const stressCount=recentMoods.filter(h=>h==='😡'||h==='😫'||h==='😰').length;
  const alerteStressFinancier=stressCount>=2;
  const moodSummary=recentMoods.length
    ? `Humeurs des 5 dernières tx: ${recentMoods.join(' ')} — ${alerteStressFinancier?'ALERTE: dépenses récurrentes sous stress':'humeur stable'}`
    : 'Aucune donnée d\'humeur enregistrée';

  // ── 50 dernières transactions avec métadonnées comportementales ──
  const recentRaw=txs.slice(0,50).map(t=>{
    const d=new Date(t.date);
    return{
      montant:t.amount,
      type:t.type,
      categorie:catById(t.categoryId).name,
      heure:d.getHours(),
      jourSemaine:['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'][d.getDay()],
      note:t.note||'',
      humeur:t.mood||null
    };
  });

  // ── Analyse chrono : clusters horaires ──
  const hourBuckets={matin:[],apresmidi:[],soir:[],nuit:[]};
  recentRaw.filter(t=>t.type==='expense').forEach(t=>{
    if(t.heure>=6&&t.heure<12)hourBuckets.matin.push(t.montant);
    else if(t.heure>=12&&t.heure<18)hourBuckets.apresmidi.push(t.montant);
    else if(t.heure>=18&&t.heure<21)hourBuckets.soir.push(t.montant);
    else hourBuckets.nuit.push(t.montant);
  });
  const bucketSum=b=>b.reduce((s,v)=>s+v,0);

  // ── Détection de l'Effet Domino ──
  // Cherche si une grosse dépense (>2x burn rate) est suivie d'une hausse dans les 48h
  const BIG_TX_THRESHOLD=k.burnRate*2;
  const dominoEvents=[];
  txs.filter(t=>t.type==='expense'&&t.amount>BIG_TX_THRESHOLD).slice(0,5).forEach(big=>{
    const t0=new Date(big.date).getTime();
    const after48h=txs.filter(t=>t.type==='expense'&&new Date(t.date).getTime()>t0&&new Date(t.date).getTime()<=t0+172800000);
    if(after48h.length>=2){
      dominoEvents.push({
        declencheur:catById(big.categoryId).name,
        montant:big.amount,
        depensesSubsequentes:after48h.length,
        totalApres:after48h.reduce((s,t)=>s+t.amount,0)
      });
    }
  });

  // ── Mots-clés récurrents dans les notes ──
  const allNotes=txs.filter(t=>t.note&&t.note.length>2).map(t=>t.note.toLowerCase());
  const wordFreq={};
  allNotes.forEach(note=>note.split(/\s+/).forEach(w=>{if(w.length>3)wordFreq[w]=(wordFreq[w]||0)+1}));
  const topKeywords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([w,n])=>`${w}(×${n})`);

  // ── Objectif prioritaire (deadline la plus proche) ──────────
  const pg=getPriorityGoal();
  let objectifPrioritaire=null;
  if(pg){
    const gap=pg.target-pg.saved;
    const dailySurplus=Math.max(0,(k.inc30/30)-k.burnRate);
    const joursRestantsBudget=dailySurplus>0?Math.ceil(gap/dailySurplus):null;
    const joursRestantsDeadline=pg.deadline?Math.ceil((new Date(pg.deadline)-Date.now())/86400000):null;
    const enRetard=joursRestantsBudget&&joursRestantsDeadline&&joursRestantsBudget>joursRestantsDeadline;
    objectifPrioritaire={
      nom:pg.name,
      cible:pg.target,
      epargneActuelle:pg.saved,
      gapRestant:gap,
      deadline:pg.deadline||'non définie',
      joursAvantDeadline:joursRestantsDeadline,
      joursNecessairesAuRythmeActuel:joursRestantsBudget,
      surplusJournalierDisponible:Math.round(dailySurplus),
      statut:enRetard?'EN RETARD — rythme insuffisant':'sur la trajectoire',
    };
  }

  // ── Tous les comptes (vue patrimoine totale, avec rôle) ──
  // type='savings' = verrouillé (l'IA doit traiter cet argent comme INTOUCHABLE sans transfert explicite via objectif).
  // type autre = compte actif / principal (dispo immédiate pour dépenses).
  const allAccounts=accs.map(a=>({
    id:a.id,
    nom:a.name,
    type:a.type||'main',
    role:(a.type==='savings')?'EPARGNE_VERROUILLEE':'COMPTE_ACTIF',
    solde:a.balance||0,
    estPrincipal:(a.type!=='savings'),
  }));
  const comptesPrincipaux=allAccounts.filter(a=>a.estPrincipal);
  const comptesEpargne=allAccounts.filter(a=>!a.estPrincipal);

  // ── Tous les objectifs (pas seulement le prioritaire) ──
  const allGoals=goals.map(g=>({
    nom:g.name,
    cible:g.target,
    epargne:g.saved||0,
    progression:g.target?Math.round(((g.saved||0)/g.target)*100)+'%':'0%',
    deadline:g.deadline||'aucune',
  }));

  // ── Top 5 catégories de dépense ce mois (avec montants) ──
  const monthExp=monthTxs().filter(t=>t.type==='expense');
  const catTotals={};
  monthExp.forEach(t=>{const n=catById(t.categoryId).name;catTotals[n]=(catTotals[n]||0)+t.amount});
  const topCategories=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([n,v])=>`${n}: ${Math.round(v)} ${cur()}`);

  // ── Enrichissement v4.14: Analyse comportementale adaptative ──
  let analyseAdaptative=null;
  try{
    const comport=analyserComportementFinancier();
    analyseAdaptative={
      profilEtat:comport.profilEtat,
      revenuMedianHebdo:Math.round(comport.medRev),
      depenseMedianeHebdo:Math.round(comport.medDep),
      rythmeAutorise:Math.round(comport.rythmeAutorise),
      tamponAmortissement:Math.round(comport.tamponAmortissement),
      messageContextuel:comport.messageContextuel||'aucun',
      transactionsAvecContexteSemantique:txs.slice(0,10).filter(tx=>tx.semantique).map(tx=>({
        montant:tx.amount,
        type:tx.type,
        categorieStyle:tx.semantique?.categorieStyle,
        chargeEmotionnelle:tx.semantique?.chargeEmotionnelle,
        profilHoraire:tx.semantique?.profilHoraire,
        classificationRevenu:tx.classificationRevenu||null,
      })),
    };
  }catch(e){}

  // ── Payload JSON structuré pour l'IA ──────
  const payload={
    // ── RÉALITÉ TEMPORELLE (injectée systématiquement) ──
    contexteTemporel:{
      dateAujourdhui:currentDateStr,
      dateISO:currentDateISO,
      heureActuelle:`${currentHour}h${currentMinute<10?'0'+currentMinute:currentMinute}`,
      momentDeLaJournee:momentOfDay,
      jourDeLaSemaine:currentDayName,
    },
    // ── ÉTAT DES DONNÉES (anti-hallucination) ──
    etatDesDonnees:{
      nbTransactionsTotal:txs.length,
      aucuneTransactionJamais:txs.length===0,
      aucuneSaisieAujourdhui:aucuneSaisieAujourdhui,
      nbTransactionsAujourdhui:todayTxs.length,
      derniereSaisieDate:derniereTxDate?derniereTxDate.toISOString().slice(0,10):'jamais',
      joursSansAucuneSaisie:joursSansSaisie!==null?joursSansSaisie:'N/A (aucune donnée)',
      alerteSilence:silenceAlert?`ALERTE: ${joursSansSaisie} jours sans saisie — comportement d'évitement probable`:'Saisie régulière',
      silenceCritique:silenceCritique,
      analyseChronologiqueValide:txs.length>=3?'OUI':'NON — données insuffisantes pour analyse comportementale',
    },
    // ── HUMEUR COMPORTEMENTALE ──
    analyseHumeur:{
      résumé:moodSummary,
      alerteStressFinancier:alerteStressFinancier,
    },
    devise:cur(),
    objectifPrioritaire,
    tousLesObjectifs:allGoals,
    comptes:allAccounts,
    comptesPrincipauxResume:{nombre:comptesPrincipaux.length,totalDisponible:comptesPrincipaux.reduce((s,a)=>s+a.solde,0)},
    comptesEpargneResume:{nombre:comptesEpargne.length,totalEpargne:comptesEpargne.reduce((s,a)=>s+a.solde,0)},
    toutesLesCategories:cats.map(c=>({id:c.id,nom:c.name,icone:c.icon,type:c.type})),
    indicateurs:{
      capitalActif:k.activeBalance,
      epargne:k.savingsBalance,
      patrimoineTotal_ATTENTION_comprend_epargne_verrouillee:(k.activeBalance||0)+(k.savingsBalance||0),
    liquiditeReelle_SEUL_montant_depensable:k.activeBalance||0,
      joursDeDonneesDisponibles:k.dataDays,
      historiqueCourtAttention:k.isShortHistory?'YES — less than 14d of data, do NOT compare to 30d':'No',
      safetyDays:k.safetyDays===9999?'infinite':k.safetyDays,
      safetyDaysAvecEpargneEtRevenusAttendus:k.safetyDaysWithSavings===9999?'infinite':k.safetyDaysWithSavings,
      revenusAttendus7j:k.expectedIncome7d||0,
      modeFinDeMois:k.isEndOfMonth?'ACTIVE — high decision fatigue':'No',
      effetFourmi:`${k.antCount} tx ≤${k.antThreshold} = ${k.antTotal} ${cur()}`,
      burnRateLisse30j:Math.round(k.burnRate),
      tauxRetention30j:k.retention!==null?`${k.retention}%`:'N/A',
      indicePression7j:k.pressureIdx>0?`+${k.pressureIdx}% vs habit`:`${k.pressureIdx}% vs habit`,
      evaporationPost_revenu:`${k.evaporationRate}% spent within 48h of income`,
      dopamineIndex:`${k.dopamineIdx}% of spending = impulse/immediate pleasure`,
      investissementIndex:`${k.investIdx}% of spending = future value`,
      depensesNocturnes:txs.length>=3?`${k.nightPct}% of total (${Math.round(k.nightSpend)} ${cur()})`:'Données insuffisantes',
      disciplineScore:k.discipline+'/100',
      scoreDeFriction:k.frictionScore+'/100 (consistency between actions and priority goal)',
    },
    topCategoriesDuMois:topCategories,
    repartitionChronologique:txs.length>=3?{
      morning_6h_12h:`${bucketSum(hourBuckets.matin)} ${cur()} (${hourBuckets.matin.length} tx)`,
      afternoon_12h_18h:`${bucketSum(hourBuckets.apresmidi)} ${cur()} (${hourBuckets.apresmidi.length} tx)`,
      evening_18h_21h:`${bucketSum(hourBuckets.soir)} ${cur()} (${hourBuckets.soir.length} tx)`,
      night_fatigue_21h_6h:`${bucketSum(hourBuckets.nuit)} ${cur()} (${hourBuckets.nuit.length} tx)`,
    }:{note:'Analyse chronologique impossible — moins de 3 transactions disponibles'},
    effetDomino:dominoEvents.length?dominoEvents:[],
    motsClesNotes:topKeywords.length?topKeywords:[],
    flux50dernieresTx:recentRaw,
    statsTotales:{
      nbTransactions:txs.length,
      nbCategoriesUtilisees:Object.keys(catTotals).length,
      premiereTx:txs.length?new Date(txs[txs.length-1].date).toISOString().slice(0,10):'none',
    },
    // v4.14: Moteur adaptatif anti-panique
    analyseAdaptative,
    // v4.17: Analyse sémantique des notes
    analyseNotes:{
      totalTransactionsAvecNotes:txs.filter(tx=>tx.note&&tx.note.length>1).length,
      totalTransactions:txs.length,
      tauxAnnotation:txs.length>0?Math.round(txs.filter(tx=>tx.note&&tx.note.length>1).length/txs.length*100):0,
      notesAujourdhui:txs.filter(tx=>{
        return new Date(tx.date).toDateString()===new Date().toDateString()&&tx.note&&tx.note.length>1;
      }).map(tx=>({note:tx.note,montant:tx.amount,categorie:catById(tx.categoryId).name,type:tx.type})),
      alimentationAujourdhui:{
        count:txs.filter(tx=>{const d=new Date(tx.date);return d.toDateString()===new Date().toDateString()&&tx.type==='expense'&&(tx.categoryId==='food'||/repas|resto|déj|dîner|manger|pizza|burger|snack/i.test(tx.note||''))}).length,
        total:txs.filter(tx=>{const d=new Date(tx.date);return d.toDateString()===new Date().toDateString()&&tx.type==='expense'&&(tx.categoryId==='food'||/repas|resto|déj|dîner|manger|pizza|burger|snack/i.test(tx.note||''))}).reduce((s,tx)=>s+tx.amount,0),
      },
      motsClesFrequents:topKeywords,
      dernièresNotes:txs.filter(tx=>tx.note&&tx.note.length>1).slice(0,10).map(tx=>({
        date:new Date(tx.date).toISOString().slice(0,10),
        note:tx.note,
        montant:tx.amount,
        type:tx.type,
        categorie:catById(tx.categoryId).name,
      })),
    },
    // v4.17: Paramètres utilisateur (pour personnalisation)
    parametresUtilisateur:{
      tauxHoraire:parseFloat(settings.hourlyRate)||0,
      revenuAttendu7j:parseFloat(settings.expectedIncome7d)||0,
      seuilFourmi:parseFloat(settings.antThreshold)||200,
      devise:cur(),
    },
  };

  // ── ALADDIN v5 : couche cycle-aware injectée dans le contexte IA ──
  try{
    if(k.aladdin){
      const ctx=k.cycleContext, proj=k.projections, vec=k.behavioralVectors;
      payload.aladdinV5 = {
        cycle: {
          mode: ctx.mode,
          type: ctx.cycleType,
          jour_dans_cycle: ctx.cycleDay,
          progression: ctx.cycleProgress!==null ? Math.round(ctx.cycleProgress*100)+'%' : 'N/A',

          revenu_attendu: ctx.expectedAmount,
          revenu_recu_ce_cycle: ctx.receivedThisCycle,
          revenu_restant_attendu: ctx.expectedCycleIncome,
          retard_revenu_jours: ctx.missedDays,
          jours_avant_prochain_revenu: ctx.daysToNextExpected,
          confiance: ctx.confidence
        },
        projections: {
          pessimiste_runway: proj.stress.runwayDays,
          baseline_runway: proj.baseline.runwayDays,
          fin_de_cycle_solde: proj.baseline.cycleEndBalance,
          potentiel_epargne_optimal: proj.optimal.savingsPotential
        },
        vecteurs_comportementaux: {

          dopamine_index: vec.dopamineIndex,
          jours_survie_essentiel: vec.survivalDays,
          coherence_personnelle: vec.coherenceScore,
          mode_restriction: vec.restrictionMode,
          divergences_categories: vec.divergences
        },
        risque_effectif: k.effectiveRisk,
        directive_explicite_pour_ivy: (
          k.effectiveRisk==='CRITICAL' ? 'Capital + revenu projeté insuffisants. Frappe fort.' :
          k.effectiveRisk==='MODERATE_PENDING_INCOME' ? 'Capital bas mais revenu confirmé arrive. NE PAS paniquer. Contextualise.' :
          k.effectiveRisk==='HIGH_NORMAL_END_CYCLE' ? 'Fin de cycle normale. Capital bas attendu. NE PAS dramatiser.' :
          ctx.phase==='POST_RECEPTION' ? 'Revenu reçu récemment. Fenêtre evaporation. Protège le capital frais.' :
          ctx.phase==='DEBUT' ? 'Début de cycle. Pousse l\'allocation épargne avant les élastiques.' :
          'Pilotage normal.'
        )
      };
    }
    // Mémoire Ivy
    try{
      const ivy = await ALADDIN.getIvyState();

        ton_calibré: ivy.toneProfile?.tone || 'GENTLE',
        derniers_assessments: (ivy.recentAssessments||[]).slice(-5)
      };
    }catch(_){}
  }catch(e){ console.warn('[ALADDIN] ctx inject fail',e); }

  return JSON.stringify(payload,null,0);
}

  const isAboutFood=['mang','alim','repas','nourriture','resto','déj','dîner','lunch','food','eat'].some(w=>ql.includes(w));

  const isAboutToday=['aujourd','today','journée','day'].some(w=>ql.includes(w));
  const isAboutNote=['note',"j'ai",'j ai',"j'avais",'écrit','marqué'].some(w=>ql.includes(w));

  if(isAboutFood||isAboutNote){

    }

    const notes=todayFoodTxs.map(tx=>tx.note).filter(Boolean).join(', ');

      :`🍽️ Alimentation aujourd'hui: ${fmtFull(totalFood)} (${todayFoodTxs.length} fois)${notes?' — '+notes:''}. ${isExpensive?'C\'est '+Math.round((totalFood/avgFoodCost-1)*100)+'% au-dessus de ta moyenne alimentation.':'Dans ta norme habituelle.'} Manger est nécessaire — c'est le lieu et la fréquence qui coûtent.`;

      ?`🎯 "${pg.name}": ${pct}% done (${fmtFull(pg.saved)}/${fmtFull(pg.target)}). ${daysNeeded?'At current pace: ~'+daysNeeded+' days away.':'No surplus available right now — cut one recurring expense to accelerate.'} Every ${fmtFull(Math.round(gap/Math.max(1,daysNeeded||90)))}/day gets you there.`

  // ── RÉPONSE SUR AUJOURD'HUI ───────────────────────────────────────────

  const balKw =_lang==='en'?['balance','wealth','money','net worth']:_lang==='es'?['saldo','patrimonio']:_lang==='pt'?['saldo','patrimônio']:['solde','patrimoine','argent'];
  const discKw=_lang==='en'?['discipline','score']:_lang==='es'?['disciplina']:_lang==='pt'?['disciplina']:['discipline','score'];
  const advKw =_lang==='en'?['advice','improve','help','tip']:_lang==='es'?['consejo','mejorar']:_lang==='pt'?['conselho','melhorar']:['conseil','améliorer','aide'];
  const accKw =_lang==='en'?['account','wallet','cash']:_lang==='es'?['cuenta','billetera']:_lang==='pt'?['conta','carteira']:['compte','argent','espèce','wallet'];

  if(riskKw.some(w=>ql.includes(w))){
    const r=riskLevel(k);
    const safe=k.safetyDays===9999?t('local_safe_inf'):t('local_safe_days').replace('{n}',k.safetyDays);
    const sens=k.projDelta>=0?t('local_risk_good'):t('local_risk_bad');
    const delta=(k.projDelta>=0?'+':'')+fmtFull(k.projDelta);
    // Add savings context
    const savingsCtx=k.savingsBalance>0?(_lang==='en'?` Savings buffer: ${fmtFull(k.savingsBalance)} (+${k.safetyDaysWithSavings}d).`:` Épargne: ${fmtFull(k.savingsBalance)} (+${k.safetyDaysWithSavings}j de tampon).`):'';
    return t('local_risk_msg').replace('{level}',r.l).replace('{sens}',sens).replace('{delta}',delta).replace('{br}',fmtFull(k.burnRate)).replace('{safe}',safe)+savingsCtx;
  }
  if(expKw.some(w=>ql.includes(w))){
    if(!k.topCat) return t('local_no_top_cat');

    // Add period context
    const periodCtx=k.isShortHistory?(_lang==='en'?` (${k.dataDays}-day sample — numbers will stabilize over time).`:` (Échantillon ${k.dataDays}j — les chiffres s'affinent avec le temps).`):'';

  if(accKw.some(w=>ql.includes(w))||balKw.some(w=>ql.includes(w))){

  if(advKw.some(w=>ql.includes(w))){
    const issues=[];

    if(!issues.length) return t('local_advice_ok').replace('{br}',fmtFull(k.burnRate));
    return t('local_advice_issues').replace('{issues}',issues.join('\n• '));

  // ── Fallback enrichi avec contexte temporel ───────────────────────────

  return t('local_default').replace('{active}',fmtFull(k.activeBalance||k.balance)).replace('{exp}',fmtFull(k.expense)).replace('{disc}',k.discipline)+timeCtx;
