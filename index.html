      ? `Today: ${_todayExpenses.length} expense(s), ${Math.round(_todayExpTotal)} ${cur()} spent${_todayNotes?' (notes: '+_todayNotes+')':''}${_todayFoodCount>=2?' — '+_todayFoodCount+' food expenses':''}.`
      : _todayIncomeTotal>0
        ? `Today: 0 expenses. Income received: ${Math.round(_todayIncomeTotal)} ${cur()}. IMPORTANT: Do NOT comment on spending — there is none today. Comment only on income retention or goal progress.`
        : 'No transactions today.';
    const _pgI=(()=>{const pg=getPriorityGoal();return pg?`Goal "${pg.name}": ${Math.round((pg.saved/pg.target)*100)}%.`:'';})();
    const sys = `You are IVY, brutal financial coach. ${hInsight}h (${momentInsight}). ${silenceCtx} ${_todayCtx} ${_pgI} CRITICAL: if 0 expenses today, DO NOT invent or infer spending behavior. Only comment what the data explicitly shows. ONE sentence max 30 words: silence→break it, notes with food/impulse→cite them, goal behind→flag it, all good→specific insight. Real numbers. No jargon. No greeting. ${langInstr()}`;
    const ctx = (await buildCtx());
    // BUG 1 — bypass fetch interceptor pour préserver max_tokens:60 et sys prompt ciblé
    const resp = await _origFetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+getGroqKey()},
      body:JSON.stringify({
        model:'llama-3.1-8b-instant',
        max_tokens:60,
        temperature:0.4,
        messages:[{role:'system',content:sys},{role:'user',content:ctx+'\n\nGive ONE targeted insight based on the data above.'}]
      })
    });
    if(!resp.ok) return null;
    const d = await resp.json();
    const t = d.choices?.[0]?.message?.content?.trim();
    if(t){_lastInsight=t;_lastInsightTime=Date.now();_lastInsightSource='cloud';return t}
    return null;
  }catch(e){
    // Repli heuristique si l'appel cloud échoue
    const local=buildOfflineInsight();
    _lastInsight=local;_lastInsightTime=Date.now();_lastInsightSource='offline';
    return local;
  }
}

// ALERTES COMPORTEMENTALES (Nudges)
// Basées sur les indicateurs dynamiques,
// pas sur le calendrier mensuel.
// ════════════════════════════════════════
function dismissAlert(type){
  try{ safeStorage.setItem('alert_dismissed_'+type+'_'+new Date().toDateString(),'1'); }catch(e){}
  try{ render(); }catch(e){}
}
function getAlerts(kpi){
  // BUG 3 — dismiss par type, valable pour la journée
  const isDismissed=(type)=>{try{return !!safeStorage.getItem('alert_dismissed_'+type+'_'+new Date().toDateString());}catch(e){return false;}};
  const pool=[];
  const critical=[];

  // ── ALADDIN v5 : alertes cycle-aware (haute priorité, AVANT les randoms) ──
  try{
    const ctx = kpi.cycleContext;
    if(ctx && ctx.mode!=='IRREGULAR'){
      if(ctx.missedDays>=7){
        critical.push({t:'d',m:`🚨 Revenu attendu en retard de ${ctx.missedDays}j — bascule en mode prudent. Capital réel uniquement.`});
      } else if(ctx.missedDays>=3){
        critical.push({t:'w',m:`⚠️ Revenu attendu en retard de ${ctx.missedDays}j. Recalcul prudent activé.`});
      } else if(ctx.missedDays>=1){
        pool.push({t:'i',m:`📅 Revenu attendu hier non reçu. Tout va bien ?`,prio:1});
      }
      if(ctx.phase==='POST_RECEPTION' && kpi.behavioralVectors && kpi.behavioralVectors.evaporationRate>40){
        pool.push({t:'w',m:`💸 Évaporation ${kpi.behavioralVectors.evaporationRate}% sur les 72h post-revenu. Bloque maintenant 20% en épargne.`,prio:1});
      }
      if(ctx.phase==='DEBUT' && ctx.daysSinceLast<=2 && kpi.savingsBalance>0===false){
        pool.push({t:'i',m:`🎯 Début de cycle — fenêtre idéale pour allouer l'épargne avant les dépenses.`,prio:1});
      }
      if(ctx.phase==='FIN' && kpi.effectiveRisk==='HIGH_NORMAL_END_CYCLE'){
        pool.push({t:'i',m:`🧭 Fin de cycle normale — capital bas attendu. Prochain revenu dans ${ctx.daysToNextExpected}j (${ctx.expectedCycleIncome} ${cur()}).`,prio:1});
      }
      if(kpi.behavioralVectors && kpi.behavioralVectors.restrictionMode==='VOLONTAIRE'){
        pool.push({t:'g',m:`✨ Mode restriction volontaire détecté. Tu maîtrises ton rythme — garde le cap.`,prio:2});
      }
    }
  }catch(e){ console.warn('[ALADDIN] alerts fail',e); }

  // ── CAS 0 : Aucune donnée ──────────────────────────────────────────────
  if(!txs.length){
    return [{t:'i',m:t('no_tx_first')}];
  }

  // ── CAS 1 : SILENCE — priorité absolue ────────────────────────────────
  // Si l'utilisateur n'a rien saisi depuis ≥4 jours, on ne génère PAS d'alertes
  // sur des données stales. On brise le silence d'abord.
  if(kpi.isSilent){
    const j=kpi.joursSansSaisie;
    critical.push({t:'d',m:t('alert_silence_body').replace('{n}',j)});
    // Si l'épargne peut couvrir la période silencieuse, on rassure
    if(kpi.savingsBalance>0 && kpi.burnRateHistorique>0){
      const couverture=Math.floor(kpi.savingsBalance/kpi.burnRateHistorique);
      pool.push({t:'i',m:t('alert_silence_savings').replace('{n}',couverture).replace('{br}',fmtFull(kpi.burnRateHistorique)),prio:1});
    }
    // Pas d'autres alertes en silence — les données sont obsolètes
    const out=[...critical,...pool.slice(0,2)];
    return out.length?out:[{t:'i',m:t('alert_silence_body').replace('{n}',j)}];
  }

  // ── CAS 2 : HISTORIQUE COURT ───────────────────────────────────────────
  if(kpi.isShortHistory){
    const s=kpi.dataDays>1?'s':'';
    pool.push({t:'i',m:t('alert_short_history').replace('{n}',kpi.dataDays).replace('{s}',s).replace('{r}',14-kpi.dataDays),prio:1});
  }

  // ── ALERTES CRITIQUES ─────────────────────────────────────────────────
  if(kpi.safetyDays!==9999&&kpi.safetyDays<7){
    const s=kpi.safetyDays>1?'s':'';
    const extStr=kpi.safetyDaysWithSavings>kpi.safetyDays?' '+t('alert_safety_ext').replace('{n}',kpi.safetyDaysWithSavings):'';
    critical.push({t:'d',m:t('alert_safety_low').replace('{n}',kpi.safetyDays).replace('{s}',s).replace('{ext}',extStr).replace('{br}',fmtFull(kpi.burnRate||kpi.burnRateHistorique))});
  }
  // Pression uniquement si les données sont fiables (pressureDataOK)
  if(kpi.pressureDataOK && kpi.pressureIdx>40 && !isDismissed('pressure'))
    critical.push({t:'d',dt:'pressure',m:t('alert_pressure_high').replace('{n}',kpi.pressureIdx)});
  if(kpi.isEndOfMonth)
    critical.push({t:'w',m:t('alert_end_month')});

  // ── ALERTE CONTEXTUELLE NOTES ──────────────────────────────────────
  // Si l'utilisateur a dépensé pour alimentation 2+ fois aujourd'hui → signal
  const todayFoodTx=txs.filter(tx=>{
    const d=new Date(tx.date);
    return d.toDateString()===new Date().toDateString()&&tx.type==='expense'&&
      (tx.categoryId==='food'||(tx.note&&/repas|resto|déj|dîner|manger|pizza|burger|snack/i.test(tx.note||'')));
  });
  if(todayFoodTx.length>=3){
    const totalFood=todayFoodTx.reduce((s,t)=>s+t.amount,0);
    pool.push({t:'w',m:`🍽️ ${todayFoodTx.length} dépenses alimentation aujourd'hui (${fmtFull(totalFood)}). Vérifier si toutes étaient nécessaires.`,prio:2});
  }
  // ── ALERTE SAISIE JOURNALIÈRE ──────────────────────────────────────
  const todayTxAll=txs.filter(tx=>new Date(tx.date).toDateString()===new Date().toDateString());
  const currentHourAlert=new Date().getHours();
  if(todayTxAll.length===0&&currentHourAlert>=14&&!kpi.isSilent){
    pool.push({t:'i',m:`📝 Aucune saisie aujourd'hui (${currentHourAlert}h). Ton cerveau oublie 60% des dépenses en 3h — note maintenant.`,prio:1});
  }
  // ── ALERTE COMPTE ACTIF VIDE + ÉPARGNE DISPO ──────────────────────
  if(kpi.activeBalance<=0&&kpi.savingsBalance>0&&!kpi.isSilent){
    pool.push({t:'w',m:`💰 Capital actif: ${fmtFull(kpi.activeBalance)}. Ton épargne (${fmtFull(kpi.savingsBalance)}) reste verrouillée — ne la touche pas sans décision consciente.`,prio:1});
  }

  // ── ALERTES MODÉRÉES ─────────────────────────────────────────────────
  if(kpi.pressureDataOK && kpi.pressureIdx>20 && kpi.pressureIdx<=40 && !isDismissed('pressure_mid'))
    pool.push({t:'w',dt:'pressure_mid',m:t('alert_pressure_mid').replace('{n}',kpi.pressureIdx),prio:2});
  if(kpi.exp7>kpi.inc7 && kpi.inc7>0)
    pool.push({t:'w',m:t('alert_weekly_deficit').replace('{exp}',fmtFull(kpi.exp7)).replace('{inc}',fmtFull(kpi.inc7)),prio:2});
  if(kpi.evaporationRate>50 && !isDismissed('evaporation'))
    pool.push({t:'w',dt:'evaporation',m:t('alert_evaporation').replace('{n}',kpi.evaporationRate),prio:3});
  if(kpi.nightPct>20)
    pool.push({t:'w',m:t('alert_night').replace('{n}',kpi.nightPct),prio:3});
  if(kpi.dopamineIdx>60)
    pool.push({t:'w',m:t('alert_dopamine').replace('{n}',kpi.dopamineIdx).replace('{inv}',kpi.investIdx),prio:3});
  if(kpi.antCount>=10 && kpi.antTotal>=kpi.antThreshold*5)
    pool.push({t:'i',m:t('alert_ant').replace('{count}',kpi.antCount).replace('{thr}',fmtFull(kpi.antThreshold)).replace('{total}',fmtFull(kpi.antTotal)).replace('{days}',kpi.dataDays),prio:3});
  if(kpi.retention!==null && kpi.retention>=25 && (!kpi.pressureDataOK||kpi.pressureIdx<=10)){
    const safetyStr=kpi.safetyDays===9999?t('alert_retention_safety_inf'):t('alert_retention_safety_days').replace('{n}',kpi.safetyDays);
    pool.push({t:'g',m:t('alert_retention').replace('{n}',kpi.retention).replace('{safety}',safetyStr),prio:3});
  }
  if(kpi.pressureDataOK && kpi.pressureIdx<=-15)
    pool.push({t:'g',m:t('alert_pressure_low').replace('{n}',Math.abs(kpi.pressureIdx)),prio:3});
  if(kpi.retention!==null && kpi.retention>=70 && kpi.exp7>0){
    const todayExp=txs.filter(tx=>tx.type==='expense'&&new Date(tx.date).toDateString()===new Date().toDateString()).reduce((s,tx)=>s+tx.amount,0);
    if(todayExp>kpi.burnRate*1.5)
      pool.push({t:'w',m:t('alert_moral_license').replace('{exp}',fmtFull(todayExp)).replace('{x}',Math.round(todayExp/kpi.burnRate)),prio:1});
  }

  const seed=Math.floor(Date.now()/10800000);// Refresh every 3h — alerts feel alive
  const shuffled=pool.map((a,i)=>({a,r:((seed+i*31)%97)})).sort((x,y)=>x.a.prio-y.a.prio||x.r-y.r).map(x=>x.a);
  const out=[...critical];
  for(const a of shuffled){
    if(out.length>=3) break;
    out.push(a);
  }
  return out.length?out:[{t:'g',m:t('all_good').replace('{br}',fmtFull(kpi.burnRate||kpi.burnRateHistorique)).replace('{sd}',kpi.safetyDays===9999?'∞':kpi.safetyDays)}];
}

async function initNotifs(){
  try{
    if(!('Notification' in window))return;
    // Don't auto-request — wait for user gesture (Android offline crash fix)
    setInterval(()=>{try{checkNotifs()}catch(e){}},60000);
    setTimeout(()=>{try{checkNotifs()}catch(e){}},3000);
  }catch(e){console.warn('initNotifs',e)}
}
function sendNotif(title,body,tag){
  if(Notification.permission!=='granted')return;
  const opts={
    body,
    tag:tag||'finos',
    icon:'./icon-192.png',
    badge:'./icon-96.png',
    vibrate:[200,100,200,100,300],  // son + vibration sur Android
    requireInteraction:false,
    silent:false,
    data:{url:'./index.html'}
  };
  // Priorité SW (fonctionne en arrière-plan, lock screen, son réel)
  if('serviceWorker' in navigator && navigator.serviceWorker.controller){
    navigator.serviceWorker.ready.then(reg=>{
      reg.showNotification(title,opts);
    }).catch(()=>{ try{new Notification(title,{body,tag,silent:false})}catch(e){} });
  } else {
    // Fallback direct (app ouverte seulement)
    try{ new Notification(title,{body,tag,icon:'./icon-192.png',silent:false}) }catch(e){}
  }
}
function checkNotifs(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date(),h=now.getHours(),m=now.getMinutes(),today=now.toDateString();
  const kpi=computeKPIs();

  // ── 0. Alerte silence (priorité maximale — journalière) ──────────────
  if(kpi.isSilent && h===9&&m<5){
    const k='silenceAlert'+today;
    if(!safeStorage.getItem(k)){
      sendNotif(
        t('notif_silence_title')||'Finance AI OS',
        (t('notif_silence_body')||'Aucune saisie depuis {n}j. Reprends le suivi.').replace('{n}',kpi.joursSansSaisie),
        'silence'
      );
      safeStorage.setItem(k,'1');
    }
    return; // On n'envoie pas d'autres notifs si en silence
  }

  // ── 1. Rappel saisie journalière ─────────────────────────────
  const rh=parseInt(settings.remindHour||20);
  if(h===rh&&m<5){
    const todayTxs=txs.filter(t=>new Date(t.date).toDateString()===today);
    if(!todayTxs.length)sendNotif('Finance AI OS',t('notif_daily'),'daily');
  }

  // ── 2. Réserve critique ──────────────────────────────────────
  if(!kpi.isSilent&&kpi.safetyDays!==9999&&kpi.safetyDays<5&&h===8&&m<5){
    const k='safetyAlert'+today;
    if(!safeStorage.getItem(k)){
      const msg=(t('notif_safety_body')||'{n} jours de réserve au rythme actuel.').replace('{n}',kpi.safetyDays);
      sendNotif(t('notif_safety_title')||'🚨 Réserve critique',msg,'safety');
      safeStorage.setItem(k,'1');
    }
  }

  // ── 3. Surchauffe court terme ────────────────────────────────
  if(!kpi.isSilent&&kpi.pressureDataOK&&kpi.pressureIdx>35&&h===12&&m<5){
    const k='pressureAlert'+today;
    if(!safeStorage.getItem(k)){
      const msg=(t('notif_pressure_body')||'Tes dépenses cette semaine sont +{n}% vs ton habitude.').replace('{n}',kpi.pressureIdx);
      sendNotif(t('notif_pressure_title')||'🔥 Surchauffe détectée',msg,'pressure');
      safeStorage.setItem(k,'1');
    }
  }

  // ── 4. Sentinelle "Fenêtre de risque" ────────────────────────
  if(!kpi.isSilent&&kpi.nightPct>20&&h===20&&m<5){
    const k='riskWindow'+today;
    const pg=getPriorityGoal();
    const body=pg
      ? (t('notif_risk_goal')||'Zone de risque proche. Rappelle-toi ton objectif "{g}" — il manque {amt}.').replace('{g}',pg.name).replace('{amt}',fmtFull(pg.target-pg.saved))
      : (t('notif_risk_body')||'Tes dépenses nocturnes = {n}% du total. Reste vigilant.').replace('{n}',kpi.nightPct);
    if(!safeStorage.getItem(k)){sendNotif(t('notif_risk_title')||'🌙 Fenêtre de risque',body,'riskWindow');safeStorage.setItem(k,'1')}
  }

  // ── 5. Objectif en retard — alerte matinale ──────────────────
  if(!kpi.isSilent&&h===7&&m<5){
    const pg=getPriorityGoal();
    if(pg&&pg.deadline){
      const joursDeadline=Math.ceil((new Date(pg.deadline)-Date.now())/86400000);
      const gap=pg.target-pg.saved;
      const dailySurplus=Math.max(0,(kpi.inc30/30)-kpi.burnRate);
      const joursNecessaires=dailySurplus>0?Math.ceil(gap/dailySurplus):null;
      if(joursNecessaires&&joursNecessaires>joursDeadline){
        const k='goalAlert'+today;
        if(!safeStorage.getItem(k)){
          const msg=(t('notif_goal_late')||'Il te faut {need}j mais la deadline est dans {dl}j.').replace('{need}',joursNecessaires).replace('{dl}',joursDeadline);
          sendNotif(`⏳ "${pg.name}"`,msg,'goalAlert');
          safeStorage.setItem(k,'1');
        }
      }
    }
  }

  // ── 6. Bilan de cohérence du soir ───────────────────────────
  if(!kpi.isSilent&&h===22&&m<5){
    const pg=getPriorityGoal();
    if(pg){
      const todayDopamine=txs.filter(t=>{
        const d=new Date(t.date);
        return t.type==='expense'&&isDopamineTx(t)&&d.toDateString()===today;
      }).reduce((s,t)=>s+t.amount,0);
      if(todayDopamine>0){
        const days=opportunityCostDays(todayDopamine);
        const k='coherence'+today;
        if(!safeStorage.getItem(k)&&days&&days>=0.5){
          const msg=(t('notif_coherence_body')||'{amt} en impulsions = {d}j de retard sur "{g}".').replace('{amt}',fmtFull(todayDopamine)).replace('{d}',days).replace('{g}',pg.name);
          sendNotif(t('notif_coherence_title')||'📊 Bilan du jour',msg,'coherence');
          safeStorage.setItem(k,'1');
        }
      }
    }
  }
}

let _cycleSuggestionShown=false;
async function render(){
  if(!_cycleSuggestionShown){_cycleSuggestionShown=true;setTimeout(()=>{try{maybeOfferCycleSuggestion()}catch(e){}},2500);}

  try{await loadAll()}catch(e){console.warn('loadAll',e)}
  invalidateKPICache(); // tout render = nouveau tick = nouveau cache KPI
  const screens={home:renderHome,txlist:renderTxList,analytics:renderAnalytics,ai:renderAI,settings:renderSettings};
  let html='';
  try{html=(screens[screen]||renderHome)()}
  catch(e){console.error('render screen',e);html='<div class="card"><div class="ch">⚠️ Erreur</div><div style="font-size:12px;color:var(--mut)">'+(e.message||e)+'</div><button class="btn" style="margin-top:10px" onclick="screen=\'home\';render()">Retour accueil</button></div>'}
  $('root').innerHTML='<div class="fin">'+html+'</div>';
  try{renderNav()}catch(e){console.warn(e)}
  try{updateOnlineStatus()}catch(e){console.warn(e)}
  if(screen==='ai'){try{setupChat()}catch(e){console.warn(e)}}
  if(screen==='home'){setTimeout(()=>{try{maybeAutoInsight()}catch(e){};try{checkCelebrations()}catch(e){}},150)}
  // v4.14: Mise à jour ambiance financière
  try{updateFinancialAmbiance()}catch(e){}
}

function miniRing(score,color){
  const r=17,c=2*Math.PI*r,fill=c-(c*score/100);
  return`<div style="display:flex;align-items:center;gap:8px;margin-top:4px">
    <svg width="42" height="42" viewBox="0 0 42 42">
      <circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--surf3)" stroke-width="3"/>
      <circle cx="21" cy="21" r="${r}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${c}" stroke-dashoffset="${fill}" stroke-linecap="round" style="transform:rotate(-90deg);transform-origin:center"/>
    </svg>
    <div><div class="kv" style="color:${color}">${score}</div><div class="ks">/100</div></div>
  </div>`;
}

function timeOf(amt){
  const r=parseFloat(settings.hourlyRate)||0;
  if(!r||!amt) return '';
  const h=amt/r;
  if(h<1) return Math.round(h*60)+'min';
  if(h<8) return h.toFixed(1).replace('.0','')+'h';
  const d=h/8;
  if(d<5) return d.toFixed(1).replace('.0','')+'j travail';
  return Math.round(d)+'j travail';
}

let analyticsPeriod='month'; // 'day','week','month','year'

function getPeriodTxs(period){
  const now=new Date();
  let s,e;
  if(period==='day'){s=new Date(now);s.setHours(0,0,0,0);e=new Date(now);e.setHours(23,59,59,999);}
  else if(period==='week'){s=new Date(now);s.setDate(now.getDate()-((now.getDay()+6)%7));s.setHours(0,0,0,0);e=new Date(now);e.setHours(23,59,59,999);}/* BUG 5 lundi */
  else if(period==='month'){s=new Date(now.getFullYear(),now.getMonth(),1);e=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59);}
  else{s=new Date(now.getFullYear(),0,1);e=new Date(now.getFullYear(),11,31,23,59,59);}
  return txs.filter(t=>new Date(t.date)>=s&&new Date(t.date)<=e);
}

function getPrevPeriodTxs(period){
  const now=new Date();
  let s,e;
  if(period==='day'){s=new Date(now);s.setDate(s.getDate()-1);s.setHours(0,0,0,0);e=new Date(s);e.setHours(23,59,59,999);}
  else if(period==='week'){s=new Date(now);s.setDate(now.getDate()-((now.getDay()+6)%7)-7);s.setHours(0,0,0,0);e=new Date(s);e.setDate(s.getDate()+6);e.setHours(23,59,59,999);}/* BUG 5 lundi */
  else if(period==='month'){s=new Date(now.getFullYear(),now.getMonth()-1,1);e=new Date(now.getFullYear(),now.getMonth(),0,23,59,59);}
  else{s=new Date(now.getFullYear()-1,0,1);e=new Date(now.getFullYear()-1,11,31,23,59,59);}
  return txs.filter(t=>new Date(t.date)>=s&&new Date(t.date)<=e);
}

// Heatmap adaptative : day=24h / week=7j / month=daysInMonth / year=12mois
// Chaque cellule contient: amt (dépenses), inc (revenus), net (net)
function buildHeatmap(period){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const cells=[];let maxExp=1,maxInc=1;
  if(period==='day'){
    const today=new Date(y,m,now.getDate());
    for(let h=0;h<24;h++){
      const s=new Date(today);s.setHours(h,0,0,0);
      const e=new Date(s);e.setHours(h+1);
      const amt=txs.filter(t=>t.type==='expense'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0);
      const inc=txs.filter(t=>t.type==='income'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0);
      const isNow=h===now.getHours();
      cells.push({label:String(h),short:String(h),amt,inc,isNow,key:`hour-${h}`});
      if(amt>maxExp)maxExp=amt;
      if(inc>maxInc)maxInc=inc;
    }
  } else if(period==='week'){
    const start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);/* BUG 5 lundi */
    const wn=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    for(let i=0;i<7;i++){
      const s=new Date(start);s.setDate(start.getDate()+i);
      const e=new Date(s);e.setDate(s.getDate()+1);
      const amt=txs.filter(t=>t.type==='expense'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0);
      const inc=txs.filter(t=>t.type==='income'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0);
      const isNow=s.toDateString()===now.toDateString();
      cells.push({label:wn[i],short:wn[i],amt,inc,isNow,key:`day-${s.toISOString().slice(0,10)}`,date:s});
      if(amt>maxExp)maxExp=amt;if(inc>maxInc)maxInc=inc;
    }
  } else if(period==='month'){
    const dim=new Date(y,m+1,0).getDate();
    for(let d=1;d<=dim;d++){
      const s=new Date(y,m,d),e=new Date(y,m,d+1);
      const amt=txs.filter(t=>t.type==='expense'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0);
      const inc=txs.filter(t=>t.type==='income'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0);
      const isNow=d===now.getDate();
      cells.push({label:String(d),short:String(d),amt,inc,isNow,key:`day-${s.toISOString().slice(0,10)}`,date:s});
      if(amt>maxExp)maxExp=amt;if(inc>maxInc)maxInc=inc;
    }
  } else { // year
    const mn=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
    for(let mm=0;mm<12;mm++){
      const s=new Date(y,mm,1),e=new Date(y,mm+1,1);
      const amt=txs.filter(t=>t.type==='expense'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0);
      const inc=txs.filter(t=>t.type==='income'&&new Date(t.date)>=s&&new Date(t.date)<e).reduce((a,t)=>a+t.amount,0);
      const isNow=mm===now.getMonth();
      cells.push({label:mn[mm],short:mn[mm],amt,inc,isNow,key:`month-${y}-${mm}`,date:s});
      if(amt>maxExp)maxExp=amt;if(inc>maxInc)maxInc=inc;
    }
  }
  return {cells,max:maxExp,maxInc};
}

// Couleur nuancée selon intensité : vert (calme) → jaune → orange → rouge (intense)
function intensityColor(ratio){
  if(ratio<=0)return 'var(--surf2)';
  if(ratio<.25)return `rgba(16,185,129,${.20+ratio*.6})`;
  if(ratio<.5)return `rgba(234,179,8,${.25+ratio*.5})`;
  if(ratio<.75)return `rgba(249,115,22,${.30+ratio*.5})`;
  return `rgba(244,63,94,${.35+ratio*.55})`;
}

function periodHeatmapClick(cell,period){
  // Reconstituer l'objet date depuis l'ISO string (JSON.stringify transforme Date en string)
  const cellDate=cell.date?new Date(cell.date):new Date();
  if(period==='day'){
    // Pour day: la cellule représente une heure, on passe hour = short (index heure)
    return openHourModal({date:new Date().toISOString(),hour:parseInt(cell.short)||0});
  }
  if(period==='week'||period==='month') return openDayModal(cellDate.getDate(),cellDate.getMonth(),cellDate.getFullYear());
  if(period==='year') return openMonthModal(cellDate.getMonth(),cellDate.getFullYear());
}

function localPeriodComment(p,d){
  const lbl=periodLabel(p),prev=periodPrevLabel(p);
  const kpi=computeKPIs();

  if(kpi.isSilent){
    return t('analyse_silence').replace('{n}',kpi.joursSansSaisie);
  }
  if(d.curExp===0&&d.curInc===0) return t('no_data_period').replace('{p}',lbl);

  const parts=[];
  // ── Comparaison avec période précédente ────────────────────────────
  if(d.curExp>0&&d.prevExp>0){
    if(d.expDpct>30) parts.push(t('analyse_exp_up').replace('{pct}',d.expDpct).replace('{prev}',prev));
    else if(d.expDpct<-20) parts.push(t('analyse_exp_down').replace('{pct}',Math.abs(d.expDpct)).replace('{prev}',prev));
    else parts.push(t('analyse_exp_stable').replace('{pct}',d.expDpct>=0?'+'+d.expDpct:d.expDpct).replace('{prev}',prev));
  } else if(d.curExp>0){
    parts.push(t('analyse_exp_only').replace('{amt}',fmtFull(d.curExp)).replace('{p}',lbl));
  }
  // ── Déficit ──────────────────────────────────────────────────────
  if(d.curInc>0&&d.curExp>d.curInc) parts.push('⚠️ '+t('over_budget')+' '+lbl+'. Solde: '+fmtFull(d.curInc-d.curExp)+'.');
  // ── Top cat ──────────────────────────────────────────────────────
  if(d.topCat) parts.push(t('analyse_top_cat').replace('{icon}',catById(d.topCat[0]).icon).replace('{name}',catById(d.topCat[0]).name).replace('{amt}',fmtFull(d.topCat[1])));
  // ── Analyse des notes de la période (offline behavioral insight) ──
  const ptxs=getPeriodTxs(p);
  const notedTxs=ptxs.filter(tx=>tx.note&&tx.note.length>1);
  if(notedTxs.length>=2){
    const topNotes=notedTxs.slice(0,3).map(tx=>tx.note).join(', ');
    parts.push(_lang==='en'?`Notes logged: "${topNotes}" — these give context for spending decisions.`:`Notes: "${topNotes}" — ces informations permettent de mieux contextualiser.`);
  }
  // ── Taux de rétention local ──────────────────────────────────────
  if(d.curInc>0){
    const retPct=Math.round(((d.curInc-d.curExp)/d.curInc)*100);
    if(retPct<0) parts.push(_lang==='en'?'⚠️ You spent more than you earned this period.':'⚠️ Tu as dépensé plus que tu n\'as gagné sur cette période.');
    else if(retPct>=30) parts.push(_lang==='en'?`✅ You kept ${retPct}% of income — strong retention.`:`✅ Tu as conservé ${retPct}% de tes revenus — bonne rétention.`);
  }
  // ── Histogramme court-circuit : affiche "pas assez de données" si besoin ──
  if(kpi.isShortHistory&&p!=='day'){
    parts.push(_lang==='en'?`(${kpi.dataDays}-day sample — data stabilizes after 14+ days)`:`(Échantillon de ${kpi.dataDays}j — données plus fiables après 14j+)`);
  }
  return parts.filter(Boolean).join(' ');
}

Period: ${periodLabel(p)} (${totalTxCount} transactions). Currency: ${cur()}.
Expenses: ${Math.round(curExp)} vs previous ${periodPrevLabel(p)}: ${Math.round(prevExp)} (${prevExp>0?Math.round((curExp-prevExp)/prevExp*100):0}% change).

Behavioral KPIs: dopamine=${kpiCtx.dopamineIdx}%, evaporation=${kpiCtx.evaporationRate}%, night spending=${kpiCtx.nightPct}%.
${kpiCtx.isShortHistory?'NOTE: Short history ('+kpiCtx.dataDays+'d) — do not compare to 30-day norms. Only analyze actual available data.':''}
Give ONE neuro/behavioral insight based on actual notes and spending + ONE concrete action. Cite specific amounts. No jargon. Max 3 sentences.`;

function renderTrendChartAdaptive(p,ptxs){
  // Day = 24 points (heures), Week = 7 points (jours), Month = jours du mois, Year = 12 points (mois)
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  let buckets=[],labels=[];
  if(p==='day'){
    for(let h=0;h<24;h++){
      const s=new Date(y,m,now.getDate(),h),e=new Date(y,m,now.getDate(),h+1);
      const dt=ptxs.filter(t=>new Date(t.date)>=s&&new Date(t.date)<e);
      buckets.push({exp:dt.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),inc:dt.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),lbl:h+'h'});
    }
  } else if(p==='week'){
    const start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);
    const wn=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    for(let i=0;i<7;i++){
      const s=new Date(start);s.setDate(start.getDate()+i);const e=new Date(s);e.setDate(s.getDate()+1);
      const dt=ptxs.filter(t=>new Date(t.date)>=s&&new Date(t.date)<e);
      buckets.push({exp:dt.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),inc:dt.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),lbl:wn[i]});
    }
  } else if(p==='month'){
    const dim=new Date(y,m+1,0).getDate();
    for(let d=1;d<=dim;d++){
      const s=new Date(y,m,d),e=new Date(y,m,d+1);
      const dt=ptxs.filter(t=>new Date(t.date)>=s&&new Date(t.date)<e);
      buckets.push({exp:dt.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),inc:dt.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),lbl:d});
    }
  } else {
    const mn=['J','F','M','A','M','J','J','A','S','O','N','D'];
    for(let mm=0;mm<12;mm++){
      const s=new Date(y,mm,1),e=new Date(y,mm+1,1);
      const dt=ptxs.filter(t=>new Date(t.date)>=s&&new Date(t.date)<e);
      buckets.push({exp:dt.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),inc:dt.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),lbl:mn[mm]});
    }
  }
  const max=Math.max(...buckets.map(x=>Math.max(x.exp,x.inc)),1);
  const W=320,H=150,pad=24,n=buckets.length;
  const xs=i=>pad+((W-pad*2)*i/Math.max(1,n-1));
  const ys=v=>H-pad-((H-pad*2)*v/max);
  const ptsExp=buckets.map((b,i)=>xs(i)+','+ys(b.exp)).join(' ');
  const ptsInc=buckets.map((b,i)=>xs(i)+','+ys(b.inc)).join(' ');
  const areaExp=`M${xs(0)},${H-pad} L${ptsExp.split(' ').join(' L')} L${xs(n-1)},${H-pad} Z`;
  const lineExp='M'+ptsExp.split(' ').join(' L');
  const lineInc='M'+ptsInc.split(' ').join(' L');
  const avg=buckets.reduce((s,b)=>s+b.exp,0)/n;
  const yAvg=ys(avg);
  return`<div class="card">
    <div class="ch">📊 ${t('trend_label')} — ${periodLabel(p)} <span class="tm" style="font-weight:600">${t('an_avg')} ${fmtFull(avg)}</span></div>
    <div style="display:flex;gap:14px;font-size:10px;color:var(--mut);margin-bottom:6px;font-weight:700;text-transform:uppercase">
      <span><span style="display:inline-block;width:10px;height:3px;background:var(--acc3);vertical-align:middle;margin-right:4px"></span>${t('an_sorties')}</span>
      <span><span style="display:inline-block;width:10px;height:3px;background:var(--grn);vertical-align:middle;margin-right:4px"></span>${t('an_entrees')}</span>
    </div>
    <svg class="trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:150px">
      <defs><linearGradient id="trendGradAdaptive" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="var(--acc3)" stop-opacity=".35"/>
        <stop offset="100%" stop-color="var(--acc3)" stop-opacity="0"/>
      </linearGradient></defs>
      <line class="axis" x1="${pad}" y1="${yAvg}" x2="${W-pad}" y2="${yAvg}"/>
      <text class="lbl" x="${W-pad}" y="${yAvg-3}" text-anchor="end">${L('moy','avg','prom','méd')}</text>
      <path class="area" d="${areaExp}" fill="url(#trendGradAdaptive)"/>
      <path class="line" d="${lineExp}"/>
      <path d="${lineInc}" fill="none" stroke="var(--grn)" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>
      ${buckets.map((b,i)=>`<circle class="pt" cx="${xs(i)}" cy="${ys(b.exp)}" r="2.5"><title>${b.lbl}: ${fmtFull(b.exp)} sorti, ${fmtFull(b.inc)} entré</title></circle>`).join('')}
      <text class="lbl" x="${pad}" y="${H-6}">${buckets[0].lbl}</text>
      <text class="lbl" x="${W-pad}" y="${H-6}" text-anchor="end">${buckets[n-1].lbl}</text>
    </svg>
  </div>
  ${renderCategoryBarsAdaptive(p,ptxs)}`;
}

// v4.16: Génère des actions concrètes selon l'état comportemental réel
function getNextActions(kpi){
  const actions=[];
  const c=cur();
  // 1. Aucune transaction
  if(!txs.length){
    actions.push({icon:'🚀',text:t('ai_act_no_tx'),btn:t('ai_act_btn_add'),btnAction:'openAddModal()'});
    return actions;
  }
  // 2. Silence prolongé
  if(kpi.isSilent && kpi.joursSansSaisie>=4){
    actions.push({icon:'⏰',text:t('ai_act_silence').replace('{n}',kpi.joursSansSaisie),btn:t('ai_act_btn_add'),btnAction:'openAddModal()'});
  }
  // 3. Calibration insuffisante
  if(txs.length<7){
    actions.push({icon:'🎚️',text:t('ai_act_calibrate'),btn:t('ai_act_btn_add'),btnAction:'openAddModal()'});
  }
  // 4. Sécurité faible
  if(kpi.safetyDays<15 && kpi.safetyDays<9999){
    actions.push({icon:'🛡️',text:t('ai_act_low_security').replace('{n}',kpi.safetyDays),btn:t('ai_act_btn_goals'),btnAction:"go('settings')"});
  }
  // 5. Évaporation élevée
  if(kpi.evaporationRate>40){
    actions.push({icon:'💸',text:t('ai_act_evap_high').replace('{v}',kpi.evaporationRate),btn:t('ai_act_btn_goals'),btnAction:"go('settings')"});
  }
  // 6. Nocturne élevé
  if(kpi.nightPct>15){
    actions.push({icon:'🌙',text:t('ai_act_night_high').replace('{v}',kpi.nightPct)});
  }
  // 7. Dopamine élevée
  if(kpi.dopamineIdx>50){
    actions.push({icon:'🎯',text:t('ai_act_dopamine_high').replace('{v}',kpi.dopamineIdx).replace('{c}',c),btn:t('ai_act_btn_analyse'),btnAction:"go('analytics')"});
  }
  // 8. Aucun objectif
  try{
    const pg=(typeof getPriorityGoal==='function')?getPriorityGoal():null;
    if(!pg){
      actions.push({icon:'⭐',text:t('ai_act_review_goal'),btn:t('ai_act_btn_goals'),btnAction:"go('settings')"});
    }
  }catch(e){}
  const backupGap=getBackupGapDays();
  if(backupGap>=7){
    actions.push({icon:'💾',text:t('ai_act_backup_due').replace('{n}',backupGap),btn:t('ai_act_btn_backup'),btnAction:'doExport()'});
  }
  // 9. Tout va bien — féliciter
  if(actions.length===0){
    const mastery=Math.max(0,100-kpi.dopamineIdx);
    actions.push({icon:'✅',text:t('ai_act_keep_mastery').replace('{v}',mastery),btn:t('ai_act_btn_categories'),btnAction:"go('analytics')"});
  }
  return actions.slice(0,4);
}

function getBackupGapDays(){
  const d=settings.lastBackupAt?new Date(settings.lastBackupAt):null;
  return d&&!isNaN(d)?Math.floor((Date.now()-d.getTime())/86400000):999;
}

function checkConsistency(kpi){
  const out=[];
  const dopamineLike=tx=>tx.type==='expense'&&!isRigidExpense(tx)&&(isElasticExpense(tx)||/snack|fast.?food|livraison|delivery|resto|burger|pizza|glace|bonbon|shopping|jeu/i.test(tx.note||''));
  const recent=txs.filter(tx=>dopamineLike(tx)&&Date.now()-new Date(tx.date).getTime()<=7*86400000);
  const latest=recent[0];
  if(latest){
    const ld=new Date(latest.date).getTime();
    const prev=txs.find(tx=>tx.id!==latest.id&&dopamineLike(tx)&&tx.categoryId===latest.categoryId&&new Date(tx.date).getTime()<ld-21600000&&ld-new Date(tx.date).getTime()<=21*86400000);
    if(prev){
      const day=new Date(prev.date).toLocaleDateString(getLocaleForDates(),{weekday:'long'});
      out.push({icon:'🔁',text:t('ai_hardcore_repeat').replace('{day}',day).replace('{cat}',catById(latest.categoryId).name).replace('{amt}',fmtFull(latest.amount)),btn:t('ai_hardcore_btn_analyse'),btnAction:"go('analytics')"});
    }
  }
  try{if(!getPriorityGoal()&&kpi.exp30>0)out.push({icon:'🎯',text:t('ai_hardcore_no_goal'),btn:t('ai_hardcore_btn_goal'),btnAction:"go('settings')"});}catch(e){}
  if(getBackupGapDays()>=7)out.push({icon:'💾',text:t('ai_hardcore_backup'),btn:t('ai_hardcore_btn_backup'),btnAction:'doExport()'});
  return out.slice(0,3);
}

function renderAI(){

      })()}
    </div>
  </div>
  `;
}

function setupChat(){
  const ca=$('chatArea'),sb=$('sendBtn'),ci=$('chatInput');
  if(ca)ca.scrollTop=ca.scrollHeight;
  if(!sb||!ci)return;
  async function send(){
    const q=ci.value.trim();if(!q||aiTyping)return;
    ci.value='';
    aiMsgs.push({r:'user',c:q});aiTyping=true;render();
    try{const res=await askAI(q);aiMsgs.push({r:'ai',c:res.text,src:res.src})}
    catch(e){aiMsgs.push({r:'ai',c:localAI(q),src:'Local'})}
    aiTyping=false;render();
  }
  sb.onclick=send;
  ci.onkeydown=e=>{if(e.key==='Enter')send()};
}
function quickAsk(q){const ci=$('chatInput');if(ci){ci.value=q;$('sendBtn')&&$('sendBtn').click()}}

// Catégories considérées comme "dopamine" pour le coût d'opportunité
// 'food' exclu par défaut — réintégré ponctuellement via mots-clés (snack, livraison, etc.)
const DOPAMINE_CATS=['leisure','clothes','unforeseen','other_exp'];
const FOOD_IMPULSE_RE=/snack|fast.?food|livraison|delivery|resto|burger|pizza|glace|bonbon/i;
function isDopamineTx(t){return DOPAMINE_CATS.includes(t.categoryId)||(t.categoryId==='food'&&t.note&&FOOD_IMPULSE_RE.test(t.note))}

function getPriorityGoal(){
  // Objectif prioritaire = non atteint, avec deadline la plus proche
  const active=goals.filter(g=>g.saved<g.target&&g.deadline);
  if(!active.length) return goals.find(g=>g.saved<g.target)||null;
  return active.sort((a,b)=>new Date(a.deadline)-new Date(b.deadline))[0];
}

function opportunityCostDays(amt){
  // Combien de jours de progression vers l'objectif cette somme représente-t-elle ?
  const g=getPriorityGoal();if(!g) return null;
  const gap=g.target-g.saved;if(gap<=0) return null;
  const k=computeKPIs();
  // Surplus journalier disponible pour épargner = revenus 30j/30 - burnRate
  const dailySurplus=Math.max(0,(k.inc30/30)-k.burnRate);
  if(dailySurplus<=0) return null;
  // Combien de jours de surplus = cette dépense ?
  return Math.round(amt/dailySurplus*10)/10;
}

// ════════════════════════════════════════
// COMPTEUR DE DESTIN — date d'atteinte de l'objectif
// ════════════════════════════════════════
function goalMonthly(g){
  // Découpe l'objectif en jalon mensuel : combien doit être épargné CE mois pour rester sur trajectoire
  if(!g||!g.deadline) return null;
  const gap=g.target-(g.saved||0);
  if(gap<=0) return {done:true};
  const now=new Date();
  const deadline=new Date(g.deadline);
  const monthsLeft=Math.max(1,(deadline.getFullYear()-now.getFullYear())*12+(deadline.getMonth()-now.getMonth())+1);
  const monthlyTarget=Math.ceil(gap/monthsLeft);
  // Ce qui a été épargné CE MOIS
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const savedThisMonth=(g.deposits||[]).filter(d=>new Date(d.date)>=monthStart).reduce((s,d)=>s+d.amount,0);
  const pct=Math.min(100,Math.round((savedThisMonth/monthlyTarget)*100));
  return {monthlyTarget,savedThisMonth,pct,monthsLeft,done:false};
}
function goalETA(g){
  if(!g) return null;
  const gap=g.target-(g.saved||0);
  if(gap<=0) return {done:true,date:null,days:0};
  const k=computeKPIs();
  // Surplus journalier — inclut les revenus attendus 7j si configurés
  const expectedDaily=(k.expectedIncome7d||0)/7;
  const dailySurplus=Math.max(0,(k.inc30/30)+expectedDaily-k.burnRate);
  if(dailySurplus<=0) return {done:false,date:null,days:null,impossible:true};
  const days=Math.ceil(gap/dailySurplus);
  const date=new Date(Date.now()+days*86400000);
  return {done:false,date,days,impossible:false};
}

// IVY — INTERVENTION PROACTIVE après une dépense
// ════════════════════════════════════════
function ivyVerdict({amt,catId,mood,location,hour,note}){
  // Exclure les dépenses rigides (besoin réel) — pas de verdict moralisateur sur la nourriture/santé/transport
  const fakeTx={categoryId:catId,note:note||''};
  if(isRigidExpense(fakeTx)) return null;
  const g=getPriorityGoal();
  const days=opportunityCostDays(amt);
  const isDopamine=DOPAMINE_CATS.includes(catId) || (catId==='food' && /snack|fast.?food|livraison|delivery|resto|burger|pizza/i.test(note||''));
  const isNight=hour>=21||hour<5;
  const tiredMood=['😫','😡','😴'].includes(mood);
  const triggers=[];
  if(isDopamine && days!==null && days>=0.5) triggers.push('opp');
  if(isNight) triggers.push('night');
  if(tiredMood) triggers.push('mood');
  if(location && location.length>1) triggers.push('loc');
  if(triggers.length<1) return null;
  const cat=catById(catId);
  const lines=[];
  if(g && days!==null && days>=0.5){
    const dayU=L('jour','day','día','dia'), daysU=L('jours','days','días','dias'), hoursU=L('heures','hours','horas','horas');
    const unit=days>=1?`${days} ${days>1?daysU:dayU}`:`${Math.round(days*24)} ${hoursU}`;
    lines.push(L(`⚡ Tu viens de repousser <strong>"${esc(g.name)}"</strong> de <strong>${unit}</strong>. Pour ${cat.name.toLowerCase()}.`,
      `⚡ You just pushed back <strong>"${esc(g.name)}"</strong> by <strong>${unit}</strong>. For ${cat.name.toLowerCase()}.`,
      `⚡ Acabas de retrasar <strong>"${esc(g.name)}"</strong> en <strong>${unit}</strong>. Para ${cat.name.toLowerCase()}.`,
      `⚡ Acabaste de adiar <strong>"${esc(g.name)}"</strong> em <strong>${unit}</strong>. Para ${cat.name.toLowerCase()}.`));
  }
  if(tiredMood) lines.push(L(`🧠 Humeur ${mood} au moment de payer. C'est pas l'envie — c'est l'épuisement qui décide à ta place (fatigue décisionnelle).`,
    `🧠 Mood ${mood} when paying. It's not desire — it's exhaustion deciding for you (decision fatigue).`,
    `🧠 Humor ${mood} al pagar. No es deseo — es agotamiento decidiendo por ti (fatiga de decisión).`,
    `🧠 Humor ${mood} ao pagar. Não é desejo — é exaustão a decidir por ti (fadiga de decisão).`));
  if(isNight) lines.push(L(`🌙 ${hour}h. Ton cortex préfrontal (le frein) dort. Ton cerveau primitif (la pulsion) signe.`,
    `🌙 ${hour}:00. Your prefrontal cortex (the brake) is asleep. Your primitive brain (the impulse) signs.`,
    `🌙 ${hour}h. Tu corteza prefrontal (el freno) duerme. Tu cerebro primitivo (el impulso) firma.`,
    `🌙 ${hour}h. O teu córtex pré-frontal (o travão) dorme. O teu cérebro primitivo (o impulso) assina.`));
  if(location && location.length>1) lines.push(L(`📍 <em>${esc(location)}</em> — ce lieu déclenche tes craquages. Note-le. Évite-le quand t'es fatigué.`,
    `📍 <em>${esc(location)}</em> — this place triggers your slips. Note it. Avoid it when tired.`,
    `📍 <em>${esc(location)}</em> — este lugar dispara tus deslices. Anótalo. Evítalo cuando estés cansado.`,
    `📍 <em>${esc(location)}</em> — este lugar dispara as tuas falhas. Nota. Evita quando cansado.`));
  lines.push(L(`<strong>Ordre du jour :</strong> demain matin, vire ${fmtFull(amt)} sur ton épargne. Réparation immédiate.`,
    `<strong>Action:</strong> tomorrow morning, transfer ${fmtFull(amt)} to your savings. Immediate repair.`,
    `<strong>Acción:</strong> mañana por la mañana, transfiere ${fmtFull(amt)} a tus ahorros. Reparación inmediata.`,
    `<strong>Ação:</strong> amanhã de manhã, transfere ${fmtFull(amt)} para a tua poupança. Reparação imediata.`));
  return lines.join('<br><br>');
}

async function saveTx(){
  const amtEl=$('txAmt');
  const amt=parseFloat(amtEl?.value);
  if(!amt||amt<=0){
    if(amtEl){amtEl.classList.add('err');setTimeout(()=>amtEl.classList.remove('err'),500);amtEl.focus();}
    haptic([20,40,20]);
    return;
  }
  const date=new Date($('txDate')?.value||new Date()).toISOString();
  const note=$('txNote')?.value||'';
  const mood=document.querySelector('input[name="txMood"]:checked')?.value||'';
  const location=$('txLoc')?.value?.trim()||'';

  if(_txType==='transfer'){
    const fromId=$('txFrom')?.value,toId=$('txTo')?.value;
    if(!fromId||!toId){alert(t('err_select_both_accs'));return}
    if(fromId===toId){alert(t('err_same_accs'));return}
    const from=accs.find(a=>a.id===fromId),to=accs.find(a=>a.id===toId);
    if(from.balance<amt){alert(t('err_insufficient_balance'));return}
    from.balance-=amt;to.balance+=amt;
    await dbPut('accounts',from);await dbPut('accounts',to);
    await dbPut('transactions',{id:uid(),amount:amt,type:'transfer',categoryId:'transfer',accountId:fromId,toAccountId:toId,date,note,mood,location,createdAt:new Date().toISOString()});
    closeModal();await render();return;
  }

  const catId=$('txCat')?.value,accId=$('txAcc')?.value;
  if(!catId||!accId){alert(t('err_select_cat_acc'));return}

  // ── Friction Prédictive (avant validation) ──
  if(_txType==='expense' && (DOPAMINE_CATS.includes(catId) || (catId==='food' && note && FOOD_IMPULSE_RE.test(note)))){
    const days=opportunityCostDays(amt);
    const g=getPriorityGoal();
    if(days!==null && g && days>=0.5){
      const h=Math.round(days*24);
      const msg=days>=1
        ? t('confirm_push_goal_days').replace('{amt}',fmtFull(amt)).replace('{g}',g.name).replace('{n}',days).replace('{s}',days>1?'s':'')
        : t('confirm_push_goal_hours').replace('{amt}',fmtFull(amt)).replace('{g}',g.name).replace('{h}',h);
      if(!confirm(msg)) return;
    }
  }

  const acc=accs.find(a=>a.id===accId);
  if(_txType==='expense' && acc.balance < amt){
    alert(t('err_balance_logic').replace('{acc}',acc.icon+' '+acc.name).replace('{bal}',fmtFull(acc.balance)).replace('{amt}',fmtFull(amt)));
    return;
  }
  acc.balance+=_txType==='income'?amt:-amt;
  await dbPut('accounts',acc);

  // ── v4.14: Enrichissement sémantique de chaque transaction ──
  const heureSaisie=new Date(date).getHours();
  const semantique=extraireContexteSemantique(note, heureSaisie);

  // ── v4.14: Classification comportementale du revenu ──
  let classificationRevenu=null;
  if(_txType==='income'){
    const medRev=getRevenuHebdoMedian();
    if(medRev>0&&amt>medRev*2.5){
      classificationRevenu='EXCEPTIONNEL'; // Cadeau, contrat unique, remboursement
    } else if(medRev===0){
      classificationRevenu='PREMIER_REVENU';
    } else {
      classificationRevenu='RECURRENT';
    }
  }

  await dbPut('transactions',{id:uid(),amount:amt,type:_txType,categoryId:catId,accountId:accId,date,note,mood,location,semantique,classificationRevenu,createdAt:new Date().toISOString()});
  try{ await saveSet('lastUsedAccountId', accId); }catch(e){}
  haptic(15);
  closeModal();
  // Invalide le cache de l'insight home pour forcer un refresh contextuel
  _lastInsight='';_lastInsightTime=0;
  await render();
  // Mise à jour de l'ambiance visuelle
  try{updateFinancialAmbiance()}catch(e){}

  // ── v4.14: Message contextuel pour revenu exceptionnel ──
  if(_txType==='income'&&classificationRevenu==='EXCEPTIONNEL'){
    const comport=analyserComportementFinancier();
    if(comport.messageContextuel){
      setTimeout(()=>{
        openModal(`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--grn),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:18px">🛡️</div>
          <div><div style="font-weight:800;font-size:15px">IVY · Rentrée Détectée</div><div style="font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px">Médiane protégée</div></div>
        </div>
        <div style="background:var(--surf2);border-left:3px solid var(--grn);padding:14px;border-radius:10px;font-size:13px;line-height:1.6;margin-bottom:14px">${comport.messageContextuel}</div>
        <button class="btn" onclick="closeModal()">✓ Compris</button>`);
      },400);
    }
  }

  // ── IVY : verdict proactif après coup (dépenses uniquement) ──
  if(_txType==='expense'){
    const hour=new Date(date).getHours();
    const verdict=ivyVerdict({amt,catId,mood,location,hour,note});
    if(verdict) setTimeout(()=>showIvyVerdict(verdict),350);
  }
}

async function delTx(id){
  const tx=txs.find(x=>x.id===id);if(!tx)return;
  if(!confirm(t('confirm_del_tx')))return;
  const acc=accs.find(a=>a.id===tx.accountId);
  if(acc){acc.balance+=tx.type==='expense'?tx.amount:-tx.amount;await dbPut('accounts',acc)}
  if(tx.type==='transfer'&&tx.toAccountId){
    const to=accs.find(a=>a.id===tx.toAccountId);
    if(to){to.balance-=tx.amount;await dbPut('accounts',to)}
  }
  await dbDel('transactions',id);closeModal();await render();
}

    <input type="datetime-local" id="etxDate" class="fi" value="${dtVal}">

async function saveEditTx(id){
  const tx=txs.find(x=>x.id===id);if(!tx)return;
  const newAmt=parseFloat(document.getElementById('etxAmt')?.value);
  if(!newAmt||newAmt<=0){alert(t('confirm_del_tx'));return;}
  const newAcc=document.getElementById('etxAcc')?.value||tx.accountId;
  const newCat=document.getElementById('etxCat')?.value||tx.categoryId;
  const newDate=document.getElementById('etxDate')?.value;
  const newNote=document.getElementById('etxNote')?.value||'';
  // BUG 4 — Revert old balance impact (gère transfer)
  const oldAcc=accs.find(a=>a.id===tx.accountId);
  if(tx.type==='transfer'){
    if(oldAcc){ oldAcc.balance+=tx.amount; await dbPut('accounts',oldAcc); }
    if(tx.toAccountId){
      const oldTo=accs.find(a=>a.id===tx.toAccountId);
      if(oldTo){ oldTo.balance-=tx.amount; await dbPut('accounts',oldTo); }
    }
  } else {
    if(oldAcc){ oldAcc.balance+=tx.type==='expense'?tx.amount:-tx.amount; await dbPut('accounts',oldAcc); }
  }
  // Apply new
  tx.amount=newAmt; tx.accountId=newAcc; tx.categoryId=newCat;
  if(newDate) tx.date=new Date(newDate).toISOString();
  tx.note=newNote;
  const a=accs.find(x=>x.id===newAcc);
  if(tx.type==='transfer'){
    if(a){ a.balance-=newAmt; await dbPut('accounts',a); }
    if(tx.toAccountId){
      const newTo=accs.find(x=>x.id===tx.toAccountId);
      if(newTo){ newTo.balance+=newAmt; await dbPut('accounts',newTo); }
    }
  } else {
    if(a){ a.balance-=tx.type==='expense'?newAmt:-newAmt; await dbPut('accounts',a); }
  }
  await dbPut('transactions',tx);
  closeModal();await render();
}

function openDayModal(day,monthArg,yearArg){
  const now=new Date();
  const m=(monthArg!==undefined&&monthArg!==null)?monthArg:now.getMonth();
  const y=(yearArg!==undefined&&yearArg!==null)?yearArg:now.getFullYear();
  const date=new Date(y,m,day);
  const dayTxs=txs.filter(t=>new Date(t.date).toDateString()===date.toDateString());
  const total=dayTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const inc=dayTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const label=date.toLocaleDateString(getLocaleForDates(),{weekday:'long',day:'numeric',month:'long'});
  // Drill par heure
  const hours=new Array(24).fill(0);
  dayTxs.filter(t=>t.type==='expense').forEach(t=>hours[new Date(t.date).getHours()]+=t.amount);
  const maxH=Math.max(...hours,1);
  openModal(`
    <h3>📅 ${label}</h3>
    <div style="display:flex;gap:12px;margin-bottom:12px">
      <div><div class="tm" style="font-size:10px">DÉPENSES</div><div class="mono fw8" style="color:var(--red);font-size:18px">-${fmtFull(total)}</div></div>
      <div><div class="tm" style="font-size:10px">REVENUS</div><div class="mono fw8" style="color:var(--grn);font-size:18px">+${fmtFull(inc)}</div></div>
    </div>
    <div style="font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;margin-bottom:6px">Par heure</div>
    <div style="display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-bottom:14px">
      ${hours.map((v,h)=>`<div title="${h}h: ${fmtFull(v)}" style="height:28px;background:${intensityColor(v/maxH)};border-radius:3px;cursor:pointer" onclick="openHourModal({date:'${date.toISOString()}',hour:${h}})"></div>`).join('')}
    </div>
    <div style="font-size:10px;color:var(--mut);text-align:center;margin-bottom:10px">0h ←→ 23h · clique une barre pour les transactions</div>
    ${dayTxs.length?dayTxs.map(txItem).join(''):`<div class="tm">${t('no_tx_day')}</div>`}
  `);
}

function openHourModal(cell){
  const dt=cell.date?new Date(cell.date):new Date();
  const h=cell.hour!==undefined?cell.hour:dt.getHours();
  const s=new Date(dt);s.setHours(h,0,0,0);
  const e=new Date(s);e.setHours(h+1);
  const list=txs.filter(t=>new Date(t.date)>=s&&new Date(t.date)<e);
  const total=list.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const inc=list.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  openModal(`
    <h3>⏰ ${String(h).padStart(2,'0')}h — ${s.toLocaleDateString(getLocaleForDates(),{weekday:'short',day:'numeric',month:'short'})}</h3>
    <div style="display:flex;gap:14px;margin-bottom:10px">
      ${total>0?`<div><div class="tm" style="font-size:10px">DÉPENSES</div><div class="mono fw8" style="color:var(--red);font-size:18px">-${fmtFull(total)}</div></div>`:''}
      ${inc>0?`<div><div class="tm" style="font-size:10px">REVENUS</div><div class="mono fw8" style="color:var(--grn);font-size:18px">+${fmtFull(inc)}</div></div>`:''}
      ${total===0&&inc===0?`<div class="tm" style="font-size:13px">${t('no_tx_hour')}</div>`:''}
    </div>
    ${list.length?list.map(txItem).join(''):''}
  `);
}

function openMonthModal(monthIdx,yearArg){
  const y=yearArg||new Date().getFullYear();
  const s=new Date(y,monthIdx,1),e=new Date(y,monthIdx+1,1);
  const list=txs.filter(t=>new Date(t.date)>=s&&new Date(t.date)<e);
  const total=list.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const inc=list.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  const mn=Array.from({length:12},(_,i)=>new Date(y,i,1).toLocaleDateString(getLocaleForDates(),{month:'long'})).map(s=>s.charAt(0).toUpperCase()+s.slice(1));
  // Heatmap par jour
  const dim=new Date(y,monthIdx+1,0).getDate();
  const days=[];let max=1;
  for(let d=1;d<=dim;d++){
    const ds=new Date(y,monthIdx,d),de=new Date(y,monthIdx,d+1);
    const a=list.filter(t=>t.type==='expense'&&new Date(t.date)>=ds&&new Date(t.date)<de).reduce((x,t)=>x+t.amount,0);
    days.push({d,a});if(a>max)max=a;
  }
  openModal(`
    <h3>🗓 ${mn[monthIdx]} ${y}</h3>
    <div style="display:flex;gap:12px;margin-bottom:12px">
      <div><div class="tm" style="font-size:10px">DÉPENSES</div><div class="mono fw8" style="color:var(--red);font-size:18px">-${fmtFull(total)}</div></div>
      <div><div class="tm" style="font-size:10px">REVENUS</div><div class="mono fw8" style="color:var(--grn);font-size:18px">+${fmtFull(inc)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px">
      ${days.map(({d,a})=>`<div onclick="closeModal();setTimeout(()=>openDayModal(${d},${monthIdx},${y}),100)" style="aspect-ratio:1;background:${intensityColor(a/max)};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer">${d}</div>`).join('')}
    </div>
    <div style="font-size:10px;color:var(--mut);text-align:center">Clique un jour pour drill-down heure</div>
  `);
}

function openCategoryModal(catId,period){
  const cat=catById(catId);
  const ptxs=getPeriodTxs(period||'month').filter(t=>t.categoryId===catId&&t.type==='expense');
  const total=ptxs.reduce((s,t)=>s+t.amount,0);
  openModal(`

async function saveDeposit(id){
  const g=goals.find(x=>x.id===id);
  const amt=parseFloat($('depAmt')?.value);
  const fromId=$('depFrom')?.value;
  if(!g||!amt||amt<=0){alert(t('err_amount_invalid'));return}
  const from=accs.find(a=>a.id===fromId);
  let savingsAcc=accs.find(a=>a.type==='savings');
  if(!from){alert(t('err_choose_source'));return}
  if(from.balance<amt){alert(t('err_deposit_insufficient').replace('{acc}',from.icon+' '+from.name).replace('{bal}',fmtFull(from.balance)).replace('{amt}',fmtFull(amt)));return}
  // Crée le compte épargne s'il manque (cas extrême)
  if(!savingsAcc){
    savingsAcc={id:'savings',name:t('savings_default_name'),icon:'💰',type:'savings',balance:0};
    accs.push(savingsAcc);
  }
  // Mouvement réel d'argent
  from.balance-=amt;
  savingsAcc.balance+=amt;
  await dbPut('accounts',from);
  await dbPut('accounts',savingsAcc);
  // Mise à jour de l'objectif
  g.saved=(g.saved||0)+amt;
  if(!g.deposits)g.deposits=[];
  g.deposits.push({date:new Date().toISOString(),amount:amt,fromAccountId:fromId});
  await dbPut('goals',g);
  // Trace cette opération comme transfert pour l'historique
  await dbPut('transactions',{id:uid(),amount:amt,type:'transfer',categoryId:'transfer',accountId:fromId,toAccountId:savingsAcc.id,date:new Date().toISOString(),note:`→ Objectif : ${g.name}`,goalId:g.id,createdAt:new Date().toISOString()});
  closeModal();
  await render();
  showToast(t('toast_set_aside').replace('{amt}',fmtFull(amt)).replace('{g}',g.name));
}

async function doWithdrawGoal(id){
  const g=goals.find(x=>x.id===id);
  const amt=parseFloat($('wdAmt')?.value);
  const toId=$('wdTo')?.value;
  if(!g||!amt||amt<=0){alert(t('err_amount_invalid'));return}
  if(amt>g.saved){alert(t('err_savings_overflow'));return}
  const savingsAcc=accs.find(a=>a.type==='savings');
  const to=accs.find(a=>a.id===toId);
  if(!savingsAcc||!to){alert(t('err_account_not_found'));return}
  if(savingsAcc.balance<amt){alert(t('err_savings_insufficient'));return}
  savingsAcc.balance-=amt;to.balance+=amt;
  await dbPut('accounts',savingsAcc);await dbPut('accounts',to);
  g.saved-=amt;
  if(!g.deposits)g.deposits=[];
  g.deposits.push({date:new Date().toISOString(),amount:-amt,toAccountId:toId});
  await dbPut('goals',g);
  await dbPut('transactions',{id:uid(),amount:amt,type:'transfer',categoryId:'transfer',accountId:savingsAcc.id,toAccountId:toId,date:new Date().toISOString(),note:`↩︎ Repris de : ${g.name}`,goalId:g.id,createdAt:new Date().toISOString()});

async function delGoal(id){
  const g=goals.find(x=>x.id===id);if(!g)return;
  if(g.saved>0){
    const sources=accs.filter(a=>a.type!=='savings');
    const def=sources[0];
    const choice=confirm(t('confirm_del_goal_savings').replace('{amt}',fmtFull(g.saved)).replace('{dest}',def?def.icon+' '+def.name:t('main_account_default')));
    if(choice && def){
      const savingsAcc=accs.find(a=>a.type==='savings');
      if(savingsAcc && savingsAcc.balance>=g.saved){
        savingsAcc.balance-=g.saved;def.balance+=g.saved;
        await dbPut('accounts',savingsAcc);await dbPut('accounts',def);
        await dbPut('transactions',{id:uid(),amount:g.saved,type:'transfer',categoryId:'transfer',accountId:savingsAcc.id,toAccountId:def.id,date:new Date().toISOString(),note:`↩︎ Objectif supprimé : ${g.name}`,createdAt:new Date().toISOString()});
      }
    }
  } else {
    if(!confirm(t('confirm_del_goal')))return;
  }
  await dbDel('goals',id);await render();
}

async function checkCelebrations(){
  if(!txs.length) return;
  const seen=settings.celebrationsSeen||{};
  // 1. Première semaine complète de saisie (7 jours distincts avec au moins 1 tx)
  if(!seen.firstWeek){
    const days=new Set(txs.map(t=>new Date(t.date).toDateString()));
    if(days.size>=7){
      celebrate('Première semaine complète !','7 jours de saisie — l\'habitude commence.');
      seen.firstWeek=Date.now();
      await saveSet('celebrationsSeen',seen);
    }
  }
  // 2. Premier jalon mensuel atteint
  if(!seen.firstMilestone){
    for(const g of goals){
      const m=goalMonthly(g);
      if(m && !m.done && m.pct>=100){
        celebrate(`Jalon de "${g.name}" atteint !`,`Tu as épargné ce qu'il fallait ce mois.`);
        seen.firstMilestone=Date.now();
        await saveSet('celebrationsSeen',seen);
        break;
      }
    }
  }
  // 3. 7 jours de rétention positive
  if(!seen.weekRetention){
    const k=computeKPIs();
    if(k.retention!==null && k.retention>=25 && k.dataDays>=7){
      celebrate('7 jours de rétention positive','Tu gardes plus que tu ne dépenses. Ton cerveau apprend.');
      seen.weekRetention=Date.now();
      await saveSet('celebrationsSeen',seen);
    }
  }
}

// Capture le token quand l'utilisateur revient du lien de confirmation email / OAuth
async function cloudHandleAuthCallback(c){
  try{
    // 1) Implicit flow — token dans le hash
    const hash = window.location.hash || '';
    if(hash.includes('access_token=') || hash.includes('error=')){
      const params = new URLSearchParams(hash.replace(/^#/,''));
      const access_token = params.get('access_token');
      const refresh_token = params.get('refresh_token');
      const err = params.get('error_description')||params.get('error');
      if(access_token && refresh_token){
        await c.auth.setSession({ access_token, refresh_token });
      } else if(err){
        alert('❌ '+err);
      }
      // Nettoie l'URL pour ne pas re-tenter au prochain refresh
      history.replaceState(null,'',window.location.pathname+window.location.search);
    }
    // 2) PKCE flow — ?code=... dans la query string
    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    if(code && typeof c.auth.exchangeCodeForSession === 'function'){
      try{ await c.auth.exchangeCodeForSession(code); }catch(e){ console.warn('exchangeCode', e); }
      url.searchParams.delete('code');
      history.replaceState(null,'',url.pathname+url.search);
    }
  }catch(e){ console.warn('cloudHandleAuthCallback', e); }
}

async function cloudSignOut(){
  const c = cloudClient(); if(!c) return;
  await c.auth.signOut();
  cloud.user = null;
  cloudUpdateUI();
}

async function cloudBackup(silent){
  const c = cloudClient(); if(!c || !cloud.user) return;
  try{
    const payload = cloudBuildPayload();
    const { error } = await c.from('cloud_snapshots').upsert({
      user_id: cloud.user.id, data: payload, updated_at: new Date().toISOString()
    }, { onConflict:'user_id' });
    if(error) throw error;
    cloud.dirty = false; cloudUpdateUI();
    if(!silent) alert(t('cloud_saved'));
  }catch(e){
    console.warn('cloudBackup', e);
    if(!silent) alert(t('cloud_save_fail')+cloudErrMsg(e));
  }
}

async function cloudRestore(skipConfirm){
  const c = cloudClient(); if(!c || !cloud.user){ alert(t('cloud_signin_first')); return; }
  try{
    const { data:row, error } = await c.from('cloud_snapshots').select('data').eq('user_id', cloud.user.id).maybeSingle();
    if(error) throw error;
    if(!row){ alert(t('cloud_none_found')); return; }
    if(!skipConfirm && !confirm(t('cloud_confirm_restore'))) return;
    const p = row.data || {};
    for(const s of ['transactions','accounts','categories','goals','settings']) await dbClear(s);
    for(const tx of p.txs||[]) await dbPut('transactions', tx);
    for(const a of p.accs||[]) await dbPut('accounts', a);
    for(const cat of p.cats||[]) await dbPut('categories', cat);
    for(const g of p.goals||[]) await dbPut('goals', g);
    for(const sset of p.settings||[]) await dbPut('settings', sset);
    await loadAll(); await render();
    alert(t('cloud_restored'));
  }catch(e){ console.warn('cloudRestore', e); alert(t('cloud_restore_fail')+cloudErrMsg(e)); }
}

function cloudUpdateUI(){
  const st  = document.getElementById('cloudStatus');
  const fm  = document.getElementById('cloudAuthForm');
  const act = document.getElementById('cloudActions');
  if(!st || !fm || !act) return;
  if(cloud.user){
    st.textContent = t('cloud_connected')+' · '+cloud.user.email;
    st.style.color = 'var(--grn)';
    fm.style.display = 'none';
    act.style.display = '';
  }else{
    st.textContent = t('cloud_disconnected');
    st.style.color = 'var(--mut)';
    fm.style.display = '';
    act.style.display = 'none';
  }
}

// Hook auto-sync into mutating writes (debounced 3s)
const _origDbPut = dbPut, _origDbDel = dbDel, _origDbClear = dbClear;
function cloudMarkDirty(){
  cloud.dirty = true;
  if(navigator.onLine && cloud.user){
    clearTimeout(cloud._t);
    cloud._t = setTimeout(()=>cloudBackup(true), 3000);
  }
}
dbPut   = async function(s,d){ const r=await _origDbPut(s,d); if(s!=='settings' || (d && !/^gdrive_|^cloud_/.test(d.key))) cloudMarkDirty(); return r; };
dbDel   = async function(s,id){ const r=await _origDbDel(s,id); cloudMarkDirty(); return r; };
dbClear = async function(s){ const r=await _origDbClear(s); cloudMarkDirty(); return r; };


// === v4.13 Cleanup on unload ===
window.addEventListener('beforeunload', async ()=>{
  // Sync IndexedDB before leaving
  try {
    if(typeof cloudBackup === 'function' && navigator.onLine) {
      await cloudBackup(true);
    }
  } catch(e) {
    console.warn('[Unload] Backup failed:', e);
  }
});

window.addEventListener('pagehide', ()=>{
  console.log('[App] Page hidden - cleanup');
});

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') {
    console.log('[App] App minimized');
  } else if(document.visibilityState === 'visible') {
    console.log('[App] App restored');
    updateOnlineStatus();
  }
});


// === v4.13 Global error handler ===
window.addEventListener('error', (event) => {
  console.error('[GLOBAL ERROR]', event.error);
  // Don't show on every error, just log
});

window.addEventListener('unhandledrejection', (event) => {
  console.error('[UNHANDLED REJECTION]', event.reason);
  event.preventDefault();
});

window.addEventListener('online', ()=>{ if(cloud.dirty) cloudBackup(true); });

// FIRST-LAUNCH ONBOARDING (lang + currency)

// WELCOME FLOW — onboarding + tutorial fusionnés
// Slide 0 : Langue + Devise
// Slides 1-4 : Tutorial dans la langue choisie
// ════════════════════════════════════════
const ONB_CURRENCIES=['XOF','XAF','EUR','USD','GBP','CAD','MAD','NGN'];
let _onbLang=null,_onbCur=null;
let _wStep=0;
const W_STEPS=5; // 0=lang/cur, 1-4=tutorial

function onboardingNeeded(){
  return !safeStorage.getItem('app_onboarded');
}
function tutNeeded(){
  return !safeStorage.getItem('app_tutorial_done');
}
function welcomeNeeded(){
  return onboardingNeeded() || tutNeeded();
}

function showWelcome(){
  _onbLang = safeStorage.getItem('app_lang') || _lang || 'fr';
  _onbCur  = safeStorage.getItem('app_currency') || detectCurrency() || 'XOF';
  // Si onboarding déjà fait, sauter directement slide 1
  _wStep = onboardingNeeded() ? 0 : 1;
  const ov = document.createElement('div');
  ov.id = 'tutOv';
  ov.innerHTML = welcomeHTML();
  document.body.appendChild(ov);
  wAttachSwipe();
}

function welcomeHTML(){
  // Slide 0 : Langue + Devise
  const langBtns = LANG_OPTIONS.map(l=>`<button class="opt ${_onbLang===l.code?'sel':''}" onclick="wPickLang('${l.code}')">${l.label}</button>`).join('');
  const curBtns  = ONB_CURRENCIES.map(c=>`<button class="curOpt ${_onbCur===c?'sel':''}" onclick="wPickCur('${c}')">${c}</button>`).join('');
  const slide0 = `
    <div class="tut-slide" style="justify-content:flex-start;padding-top:max(48px,env(safe-area-inset-top,20px))">
      <div class="tut-icon">👋</div>
      <div class="tut-title">${t('onb_title')}</div>
      <div class="tut-body" style="margin-bottom:0">${t('onb_sub')}</div>
      <div style="width:100%;max-width:340px;text-align:left">
        <div class="tut-label">${t('onb_lang')}</div>
        <div class="opts">${langBtns}</div>
        <div class="tut-label" style="margin-top:16px">${t('onb_choose_cur')}</div>
        <div class="curRow">${curBtns}</div>
        <input class="fi" id="wCurInp" placeholder="${t('onb_currency_other')}" value="${ONB_CURRENCIES.includes(_onbCur)?'':_onbCur}" oninput="wCustomCur(this.value)" style="margin-top:8px">
      </div>
    </div>`;

  // Slides 1-4 : tutorial
  const tutSlides = [
    {icon:t('tut_s1_icon'),title:t('tut_s1_title'),body:t('tut_s1_body'),extra:''},
    {icon:t('tut_s2_icon'),title:t('tut_s2_title'),body:t('tut_s2_body'),extra:''},
    {icon:t('tut_s3_icon'),title:t('tut_s3_title'),body:t('tut_s3_body'),extra:''},
    {icon:t('tut_s4_icon'),title:t('tut_s4_title'),body:t('tut_s4_body'),extra:`
      <div class="tut-steps">
        <div class="tut-step">${t('tut_s4_step1')}</div>
        <div class="tut-step">${t('tut_s4_step2')}</div>
        <div class="tut-step">${t('tut_s4_step3')}</div>
      </div>
      <div class="tut-key-input-wrap">
        <input id="tutGroqInput" type="text" placeholder="gsk_..." autocomplete="off" spellcheck="false">
        <button onclick="tutSaveKey()">OK</button>
      </div>`},
  ];
  const tutHTML = tutSlides.map(s=>`
    <div class="tut-slide">
      <div class="tut-icon">${s.icon}</div>
      <div class="tut-title">${s.title}</div>
      <div class="tut-body">${s.body}</div>
      ${s.extra}
    </div>`).join('');

  const allSlides = slide0 + tutHTML;
  const offset = _wStep * 100;

  // Dots — only tutorial slides (1-4) show dots, slide 0 hides them
  const showDots = _wStep > 0;
  const dots = showDots
    ? Array.from({length:4},(_,i)=>`<div class="tut-dot${i===(_wStep-1)?' active':''}"></div>`).join('')
    : '';

  const isFirst = _wStep === 0;
  const isLast  = _wStep === W_STEPS - 1;

  let btnNext, btnSkip;
  if(isFirst){
    btnNext = `<button class="tut-btn-next" onclick="wNext()">${t('onb_start')} →</button>`;
    btnSkip = ''; // pas de skip sur slide langue/devise
  } else if(isLast){
    btnNext = `<button class="tut-btn-next" onclick="wFinish()">${t('tut_start')}</button>`;
    btnSkip = `<button class="tut-btn-skip" onclick="wFinish()" style="font-size:12px">${t('tut_s4_later')}</button>`;
  } else {
    btnNext = `<button class="tut-btn-next" onclick="wNext()">${t('tut_next')}</button>`;
    btnSkip = `<button class="tut-btn-skip" onclick="wFinish()">${t('tut_skip')}</button>`;
  }

  return `
    <div class="tut-wrap">
      <div class="tut-slides" id="wSlides" style="transform:translateX(-${offset}%)">
        ${allSlides}
      </div>
    </div>
    <div class="tut-footer">
      <div class="tut-dots">${dots}</div>
      <div class="tut-btns" style="${isFirst?'justify-content:center':''}">
        ${btnSkip}
        ${btnNext}
      </div>
    </div>`;
}

function wPickLang(c){
  _onbLang=c;
  setLang(c);
  const ov=document.getElementById('tutOv');
  if(ov){ ov.innerHTML=welcomeHTML(); wAttachSwipe(); }
}
function wPickCur(c){
  _onbCur=c;
  const ov=document.getElementById('tutOv');
  if(ov){ ov.innerHTML=welcomeHTML(); wAttachSwipe(); }
}
function wCustomCur(v){
  v=(v||'').trim().toUpperCase();
  if(v) _onbCur=v;
}

async function wNext(){
  // Si on quitte le slide 0, persister langue+devise
  if(_wStep===0){
    setLang(_onbLang);
    safeStorage.setItem('app_currency',_onbCur);
    try{ await dbPut('settings',{key:'lang',value:_onbLang}); }catch(e){}
    try{ await dbPut('settings',{key:'currency',value:_onbCur}); settings.currency=_onbCur; }catch(e){}
    safeStorage.setItem('app_onboarded','1');
    try{ await render(); }catch(e){}
  }
  _wStep = Math.min(W_STEPS-1, _wStep+1);
  const ov=document.getElementById('tutOv');
  if(ov){ ov.innerHTML=welcomeHTML(); wAttachSwipe(); }
}

function tutSaveKey(){
  const inp = document.getElementById('tutGroqInput');
  const val = (inp ? inp.value : '').trim();
  if(val.startsWith('gsk_') && val.length > 20){
    safeStorage.setItem('groq_api_key', val);
    try{ dbPut('settings',{key:'groq_api_key',value:val}); }catch(e){}
    haptic(30);
    if(inp){ inp.style.border='1px solid var(--grn)'; inp.value=''; inp.placeholder='✅ '+t('groq_saved').replace(/[✅!]/g,'').trim(); }
    setTimeout(()=>wFinish(), 900);
  } else {
    haptic([20,40,20]);
    if(inp){ inp.style.border='1px solid var(--red)'; }
  }
}

async function wFinish(){
  safeStorage.setItem('app_onboarded','1');
  safeStorage.setItem('app_tutorial_done','1');
  const ov=document.getElementById('tutOv');
  if(ov){ ov.style.animation='fo .35s ease forwards'; setTimeout(()=>ov.remove(),340); }
  try{ updateOnlineStatus(); }catch(e){}
  try{ await render(); }catch(e){}
}

// Legacy aliases (au cas où appelés ailleurs)
function showOnboarding(){ showWelcome(); }
function showTutorial(){ showWelcome(); }
async function onbFinish(){ await wFinish(); }
function tutFinish(){ wFinish(); }

function wAttachSwipe(){
  const wrap = document.getElementById('tutOv');
  if(!wrap) return;
  let sx=0, sy=0;
  wrap.addEventListener('touchstart', e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true,once:true});
  wrap.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
      if(dx<0 && _wStep<W_STEPS-1) wNext();
      else if(dx>0 && _wStep>0){ _wStep--; const ov=document.getElementById('tutOv'); if(ov){ov.innerHTML=welcomeHTML();wAttachSwipe();} }
    }
  },{passive:true,once:true});
}

// Alias swipe pour rétrocompat
function tutAttachSwipe(){ wAttachSwipe(); }

})();

<script>
// PATCH v4.13.0 — Loader natif APK/PWA, multilingue, polling robuste
(function(){
  'use strict';
  console.log('[LOADER v4.19.0] init');

  var L = (function(){
    var raw = '';
    try { raw = (localStorage.getItem('app_lang')||navigator.language||'en').toLowerCase(); } catch(_){ raw='en'; }
    if (raw.indexOf('fr')===0) return 'fr';
    if (raw.indexOf('es')===0) return 'es';
    if (raw.indexOf('pt')===0) return 'pt';
    return 'en';
  })();
  var T = {
    fr:{loading:'Chargement…',title:'Finance AI OS',err:'Erreur initialisation',retry:'Réessayer',offline:'Hors ligne — réessaie une fois connecté',clear:'Vider le cache & recharger'},
    en:{loading:'Loading…',title:'Finance AI OS',err:'Initialization error',retry:'Retry',offline:'Offline — retry when connected',clear:'Clear cache & reload'},
    es:{loading:'Cargando…',title:'Finance AI OS',err:'Error de inicialización',retry:'Reintentar',offline:'Sin conexión — reintenta al conectar',clear:'Borrar caché y recargar'},
    pt:{loading:'Carregando…',title:'Finance AI OS',err:'Erro de inicialização',retry:'Tentar novamente',offline:'Offline — tente quando conectado',clear:'Limpar cache e recarregar'}
  }[L];

  var overlay = document.createElement('div');
  overlay.id = 'loadingScreen';
  overlay.setAttribute('style','position:fixed;inset:0;background:#09090f;display:flex;align-items:center;justify-content:center;z-index:99999;color:#f1f5f9;font-family:Inter,-apple-system,sans-serif;');
  overlay.innerHTML = '<div style="text-align:center;padding:20px"><div style="font-size:48px;margin-bottom:16px">💰</div><div style="font-size:14px;margin-bottom:20px;color:#94a3b8">'+T.title+'</div><div style="width:40px;height:40px;border:3px solid rgba(139,92,246,.2);border-top-color:#8b5cf6;border-radius:50%;animation:fa-spin 1s linear infinite;margin:0 auto"></div><div id="ldStatus" style="margin-top:18px;font-size:12px;color:#64748b">'+T.loading+'</div><style>@keyframes fa-spin{to{transform:rotate(360deg)}}</style></div>';
  function attach(){ if(document.body && !document.getElementById('loadingScreen')) document.body.appendChild(overlay); }
  if (document.body) attach(); else document.addEventListener('DOMContentLoaded', attach);

  function hideLoader(){
    var el = document.getElementById('loadingScreen');
    if (!el) return;
    el.style.transition='opacity .4s ease';
    el.style.opacity='0';
    setTimeout(function(){ try{ el.remove(); }catch(_){}}, 450);
  }
  function setStatus(s){ var el=document.getElementById('ldStatus'); if(el) el.textContent=s; }

  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }

  function showError(msg, details){
    attach();
    var el = document.getElementById('loadingScreen');
    if (!el) return;
    var diagText = '';
    try {
      var errs = (window.__earlyErrors||[]).slice(-5).map(function(e){
        return '- '+(e.message||'')+(e.line?' @'+e.line+':'+e.col:'');
      }).join('\n');
      diagText = (errs?errs+'\n\n':'') + (details||'');
    } catch(_) { diagText = details||''; }
    var offlineNote = navigator.onLine ? '' : '<div style="color:#fbbf24;font-size:12px;margin-bottom:10px">⚠ '+T.offline+'</div>';
    el.innerHTML = '<div style="background:rgba(244,63,94,.08);border:2px solid #f43f5e;border-radius:14px;padding:22px;max-width:380px;margin:16px;text-align:center;color:#f1f5f9"><div style="font-size:38px;margin-bottom:10px">⚠️</div><div style="font-weight:700;margin-bottom:12px;font-size:16px">'+T.err+'</div>'+offlineNote+'<div style="font-size:12px;color:#cbd5e1;margin-bottom:14px;line-height:1.5;text-align:left;background:rgba(0,0,0,.35);padding:10px;border-radius:8px;max-height:160px;overflow:auto;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word"><strong>'+escapeHtml(msg)+'</strong>\n\n'+escapeHtml(diagText)+'</div><button id="btnRetry" style="background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;border:0;border-radius:10px;padding:13px 20px;font-weight:700;font-size:14px;width:100%;margin-bottom:8px;cursor:pointer">'+T.retry+'</button><button id="btnClear" style="background:transparent;color:#94a3b8;border:1px solid #2a2a3e;border-radius:10px;padding:11px 20px;font-size:13px;width:100%;cursor:pointer">'+T.clear+'</button></div>';
    var br=document.getElementById('btnRetry'); if(br) br.onclick=function(){location.reload();};
    var bc=document.getElementById('btnClear'); if(bc) bc.onclick=function(){
      try{ if('caches' in window){ caches.keys().then(function(ks){ Promise.all(ks.map(function(k){return caches.delete(k);})).then(function(){
        if(navigator.serviceWorker){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){r.unregister();}); location.reload(true); }); } else location.reload(true);
      }); }); } else location.reload(true);
      }catch(_){ location.reload(true); }
    };
  }

  var START = Date.now();
  var MAX_WAIT = 20000;
  var POLL_MS  = 150;
  var triedRender = false;

  function rootHasContent(){
    var r = document.getElementById('root');
    return !!(r && r.innerHTML && r.innerHTML.replace(/\s+/g,'').length > 30);
  }

  function poll(){
    if (rootHasContent()) { console.log('[LOADER] root has content — hide'); hideLoader(); return; }

    if (!triedRender && typeof window.render === 'function') {
      triedRender = true;
      try {
        setStatus(T.loading);
        var p = window.render();
        if (p && typeof p.then === 'function') {
          p.then(function(){ if(rootHasContent()) hideLoader(); else setTimeout(poll, POLL_MS); })
           .catch(function(e){ console.error('[LOADER] render() rejected', e); setTimeout(poll, POLL_MS); });
          return;
        } else {
          if (rootHasContent()) { hideLoader(); return; }
        }
      } catch(e){ console.error('[LOADER] render() threw', e); }
    }

    if (Date.now() - START < MAX_WAIT) { setTimeout(poll, POLL_MS); return; }

    var errs = (window.__earlyErrors||[]);
    var msg = errs.length ? (errs[0].message||'Script error') : 'App did not initialize in time';
    var details = '';
    try {
      details = 'render=' + (typeof window.render) +
                ' | root=' + (document.getElementById('root') ? 'OK' : 'MISSING') +
                ' | online=' + navigator.onLine +
                ' | sw=' + (('serviceWorker' in navigator) ? 'yes':'no') +
                ' | ua=' + (navigator.userAgent||'').slice(0,80);
    } catch(_){}
    showError(msg, details);
  }

  function start(){ setTimeout(poll, 300); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  function syncOnline(){
    try { document.documentElement.setAttribute('data-online', navigator.onLine ? '1':'0'); } catch(_){}
  }
  window.addEventListener('online', syncOnline);
  window.addEventListener('offline', syncOnline);
  syncOnline();

  console.log('[LOADER v4.19.0] armed — lang='+L);
})();
</script>

   Finance AI OS — UPGRADE v5.1 (non destructif)

   • Contextual payload + system prompt durci (tutoiement / JSON)
   • Conversion automatique des montants au changement de devise
