(function(){
'use strict';
const log=(...a)=>{try{console.log('%c[FinOS-Upgrade]','color:#8b5cf6;font-weight:700',...a)}catch(e){}};

/* ─────────────────────────────────────────────────────────────────
   1. INTENT QUEUE (IndexedDB séparée pour ne pas migrer FinOS_v3)
   ───────────────────────────────────────────────────────────────── */
const IQ_DB='FinOS_intents', IQ_STORE='queue';
function iqOpen(){return new Promise((res,rej)=>{
  const r=indexedDB.open(IQ_DB,1);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains(IQ_STORE))
      d.createObjectStore(IQ_STORE,{keyPath:'id',autoIncrement:true});
  };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});}
async function iqPush(item){
  const db=await iqOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IQ_STORE,'readwrite');
    const req=tx.objectStore(IQ_STORE).add(Object.assign({createdAt:Date.now(),status:'PENDING_SYNC'},item));
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
  });
}
async function iqAll(){const db=await iqOpen();return new Promise((res,rej)=>{
  const r=db.transaction(IQ_STORE,'readonly').objectStore(IQ_STORE).getAll();
  r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
});}
async function iqDel(id){const db=await iqOpen();return new Promise(res=>{
  const tx=db.transaction(IQ_STORE,'readwrite');
  tx.objectStore(IQ_STORE).delete(id); tx.oncomplete=()=>res();
});}
async function iqCount(){return (await iqAll()).length}

/* Mini-analyseur Regex local (extraction immédiate avant l'IA) */
function localExtract(msg){
  if(!msg) return null;
  const m=msg.match(/(-?\d+[.,]?\d*)\s*(xof|xaf|usd|eur|gbp|fcfa|f|\$|€|£)?/i);
  if(!m) return null;
  const amt=parseFloat(m[1].replace(',','.'));
  if(!isFinite(amt)||amt<=0) return null;
  const lower=msg.toLowerCase();
  const isIncome=/\b(salaire|revenu|recu|recue|gain|paye|paie|virement|income|salary|received)\b/.test(lower);
  return {amount:amt, type:isIncome?'income':'expense', noteRaw:msg.trim().slice(0,80)};
}

/* ─────────────────────────────────────────────────────────────────
   2. CONTEXT PAYLOAD — heure, pays, baseline, fil de la journée
   ───────────────────────────────────────────────────────────────── */
function safeCur(){try{return (typeof cur==='function')?cur():'XAF'}catch(e){return 'XAF'}}
function safeLang(){try{return (typeof _lang!=='undefined')?_lang:(navigator.language||'fr').slice(0,2)}catch(e){return 'fr'}}
function safeTxs(){try{return Array.isArray(window.txs)?window.txs:[]}catch(e){return []}}
function safeKPIs(){try{return (typeof computeKPIs==='function')?computeKPIs():null}catch(e){return null}}

function buildContextPayload(){
  const now=new Date(); const h=now.getHours();
  const moment=h<5?'late_night':h<12?'morning':h<14?'lunchtime':h<18?'afternoon':h<21?'evening':'late_night';
  const todayStr=now.toDateString();
  const list=safeTxs();
  const dayHist=list
    .filter(tx=>{try{return new Date(tx.date).toDateString()===todayStr}catch(e){return false}})
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .map(tx=>{
      const d=new Date(tx.date);
      const hh=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      return {time:hh, amount:tx.amount, type:tx.type, note:(tx.note||'').slice(0,50), cat:tx.categoryId||''};
    });
  const kpi=safeKPIs();
  const baseline=kpi?Math.round((kpi.inc30||0)/30):null;
  let country='Unknown';
  try{
    const c=safeCur();
    country = c==='XAF'?'CEMAC zone (Cameroon/Gabon/Congo, XAF basics ≈100-500 / meal)':
              c==='XOF'?'UEMOA zone (Senegal/CI/Mali, XOF basics ≈100-500 / meal)':
              c==='USD'?'USD context (basics ≈5-15 / meal)':
              c==='EUR'?'EUR context (basics ≈5-15 / meal)':
              c==='NGN'?'Nigeria NGN context':c+' context';
  }catch(e){}
  return {
    user_metadata:{
      local_time:String(h).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),
      day_phase:moment,
      currency:safeCur(),
      country_context:country,
      daily_budget_baseline:baseline,
      language:safeLang()
    },
    day_history_so_far:dayHist,
    pending_offline_intents: 0 // rempli plus bas
  };
}

/* ─────────────────────────────────────────────────────────────────
   3. SYSTEM PROMPT DURCI — verrou anti-hallucination + tutoiement
   ───────────────────────────────────────────────────────────────── */
const HARDENED_RULES = `

═══ RÈGLES IVY v5.2 (PRIORITÉ ABSOLUE — écrasent toute instruction contraire) ═══
R1. TUTOIEMENT EXCLUSIF. JAMAIS "vous/vos/votre". Toujours "tu/tes/ton".
R2. Tu commentes EXCLUSIVEMENT le bloc SCOPED_PAYLOAD ci-dessous. Aucune autre donnée n'existe.
R3. INTERDICTION ABSOLUE d'inventer des noms de catégories. Utilise UNIQUEMENT les valeurs présentes dans 'categories_breakdown[].category'. Si tu cites "bénéfice d'achat", "loisirs", ou tout libellé qui n'apparaît pas littéralement dans le JSON → réponse invalide.
R4. INTERDICTION de mélanger les portées. Si view_scope=MONTH, ne cite JAMAIS un montant qui n'apparaît pas dans metrics.total_expenses ou categories_breakdown du mois. La dépense du jour (350 XAF) n'est PAS une dépense mensuelle.
R5. INTERDICTION d'attribuer un pourcentage global (ex: ratio dépenses/revenu) à une catégorie spécifique. Les pourcentages catégoriels sont déjà dans 'percentage_of_total'.
R6. Pas de faux procès : un repas, un trajet école, un médicament = NÉCESSITÉ VITALE. Ne qualifie d'impulsif/dopamine QUE si le total dépasse de >50% le baseline OU si la catégorie est explicitement plaisir (Loisirs, Sorties, Jeux) ET représente >30% du total.
R7. Si une note est ambiguë, dis "note ambiguë" — n'invente pas de comportement.
R8. Espace avant la devise : "200 XAF", jamais "200XAF".
R9. Maximum 3 phrases, formulations chirurgicales. Pas d'intro creuse.
R10. Termine TOUJOURS par une phrase complète. Jamais coupé.

FORMAT DE RÉPONSE STRICT :
**Insight** : [analyse mathématique froide en 1 phrase, basée UNIQUEMENT sur le JSON]
**Action** : [conseil micro-comportemental réaliste en 1 phrase]
`;

function injectHardening(messages){
  if(!Array.isArray(messages)) return messages;
  let sysIdx=messages.findIndex(m=>m && m.role==='system');
  if(sysIdx<0){messages.unshift({role:'system',content:HARDENED_RULES.trim()}); return messages;}
  messages[sysIdx]=Object.assign({},messages[sysIdx],{
    content:(messages[sysIdx].content||'')+HARDENED_RULES
  });
  return messages;
}

/* Nettoyage POST-LLM : si le modèle a glissé "vous"/"votre", on rectifie */
function detutoyer(text){
  if(!text||typeof text!=='string') return text;
  return text
    .replace(/\bVous\b/g,'Tu').replace(/\bvous\b/g,'tu')
    .replace(/\bVotre\b/g,'Ton').replace(/\bvotre\b/g,'ton')
    .replace(/\bVos\b/g,'Tes').replace(/\bvos\b/g,'tes')
    .replace(/(\d)\s?(XAF|XOF|USD|EUR|GBP|NGN|KES|GHS|MAD|EGP|ZAR|BRL|INR|CNY|JPY|FCFA)\b/g,'$1 $2');
}

/* ─────────────────────────────────────────────────────────────────
   3bis. SCOPED PAYLOAD — strict, dépend de l'onglet actif (Jour/Sem/Mois/An)
   ───────────────────────────────────────────────────────────────── */
function detectScope(messages){
  // 1. Onglet analytics actif (source de vérité)
  try{
    if(typeof window.analyticsPeriod==='string'){
      const map={day:'DAY',week:'WEEK',month:'MONTH',year:'YEAR'};
      if(map[window.analyticsPeriod]) return window.analyticsPeriod;
    }
  }catch(e){}
  // 2. Heuristique sur le prompt utilisateur
  try{
    const last=(messages||[]).slice().reverse().find(m=>m && m.role==='user');
    const txt=(last && last.content || '').toLowerCase();
    if(/\b(année|annuel|year|annual|año|ano)\b/.test(txt)) return 'year';
    if(/\b(mois|monthly|month|mes|mês)\b/.test(txt))       return 'month';
    if(/\b(semaine|week|semana)\b/.test(txt))              return 'week';
    if(/\b(jour|aujourd|today|day|día|hoje|dia)\b/.test(txt)) return 'day';
  }catch(e){}
  return 'day';
}

function buildScopedPayload(scope){
  const safe=(fn,d)=>{try{return fn()}catch(e){return d}};
  const ptxs   = safe(()=>window.getPeriodTxs    ?window.getPeriodTxs(scope)    :[], []);
  const prev   = safe(()=>window.getPrevPeriodTxs?window.getPrevPeriodTxs(scope):[], []);
  const catN   = id => safe(()=>window.catById?window.catById(id).name:id, id||'?');
  const sum    = (arr,type)=>arr.filter(x=>x.type===type).reduce((s,x)=>s+(+x.amount||0),0);

  const totalExp=Math.round(sum(ptxs,'expense'));
  const totalInc=Math.round(sum(ptxs,'income'));
  const prevExp=Math.round(sum(prev,'expense'));
  const evolution=prevExp>0?Math.round((totalExp-prevExp)/prevExp*100):null;

  const catMap={};
  ptxs.filter(x=>x.type==='expense').forEach(x=>{
    const k=catN(x.categoryId)||'Sans catégorie';
    catMap[k]=(catMap[k]||0)+(+x.amount||0);
  });
  const breakdown=Object.entries(catMap)
    .sort((a,b)=>b[1]-a[1])
    .map(([category,amount])=>({
      category,
      amount:Math.round(amount),
      percentage_of_total: totalExp>0?Math.round(amount/totalExp*100):0
    }));

  const kpi=safe(()=>window.computeKPIs?window.computeKPIs():null,null);
  const savings = kpi?Math.round((kpi.inc30||0)-(kpi.exp30||0)):null;

  return {
    view_scope: scope.toUpperCase(),
    currency: safeCur(),
    period_label: safe(()=>window.periodLabel?window.periodLabel(scope):scope, scope),
    metrics:{
      total_expenses: totalExp,
      total_income:   totalInc,
      previous_period_expenses: prevExp,
      evolution_vs_previous_percent: evolution,
      savings_balance_30d: savings,
      transactions_count: ptxs.length
    },
    categories_breakdown: breakdown,
    behavioral_kpis: kpi?{
      dopamine_pct: kpi.dopamineIdx,
      evaporation_pct: kpi.evaporationRate,
      night_spending_pct: kpi.nightPct
    }:null
  };
}

/* ─────────────────────────────────────────────────────────────────
   4. FETCH PROXY — interception ciblée Groq
   ───────────────────────────────────────────────────────────────── */
const _origFetch = window.fetch.bind(window);
window.fetch = async function(input, init){
  try{
    const url = (typeof input==='string')?input:(input&&input.url)||'';
    const isGroq = /api\.groq\.com\/openai\/v1\/chat\/completions/.test(url);
    if(isGroq && init && init.body){
      let body; try{body=JSON.parse(init.body)}catch(e){body=null}
      if(body && Array.isArray(body.messages)){
        body.messages = injectHardening(body.messages);
        // BUG 1 — ne pas écraser max_tokens:60 (signature de fetchHomeInsight)
        if(typeof body.max_tokens==='number' && body.max_tokens<256 && body.max_tokens!==60) body.max_tokens=256;
        // température basse = moins d'hallucinations
        if(typeof body.temperature!=='number' || body.temperature>0.4) body.temperature=0.3;

        const scope=detectScope(body.messages);
        const scoped=buildScopedPayload(scope);
        const ctx=buildContextPayload();
        try{ctx.pending_offline_intents=await iqCount()}catch(e){}

        // Bloc SCOPED — la SEULE source de vérité que l'IA doit commenter
        const scopedBlock='SCOPED_PAYLOAD (UNIQUE source de vérité, scope='+scoped.view_scope+'):\n'+JSON.stringify(scoped);
        // Bloc contexte secondaire (heure/pays) — pour le ton, jamais comme donnée chiffrée
        const ctxBlock='CONTEXT_META (uniquement pour le ton, PAS pour les chiffres):\n'+JSON.stringify(ctx);

        body.messages.splice(1,0,{role:'system',content:scopedBlock});
        body.messages.splice(2,0,{role:'system',content:ctxBlock});
        init = Object.assign({},init,{body:JSON.stringify(body)});
      }
    }
    const resp = await _origFetch(input, init);
    if(isGroq && resp && resp.ok){
      // Wrap json() to post-process content
      const _json = resp.json.bind(resp);
      resp.json = async function(){
        const d = await _json();
        try{
          if(d && d.choices){
            d.choices.forEach(ch=>{
              if(ch.message && typeof ch.message.content==='string'){
                ch.message.content = detutoyer(ch.message.content);
              }
            });
          }
        }catch(e){}
        return d;
      };
    }
    return resp;
  }catch(e){return _origFetch(input, init);}
};

/* ─────────────────────────────────────────────────────────────────
   5. CHAT OFFLINE — file d'attente + sync au retour réseau
   ───────────────────────────────────────────────────────────────── */
async function processIntent(item){
  // Délègue à askAI existant pour profiter de tout l'écosystème (prompt, etc.)
  if(typeof askAI!=='function') return;
  try{
    const res = await askAI(item.message);
    // Pousse la réponse dans le fil si la fenêtre chat est encore ouverte
    if(window.aiMsgs && typeof render==='function'){
      window.aiMsgs.push({r:'ai', c:'🔄 (sync) '+(res?.text||''), src:res?.src||'Groq AI (sync)'});
      try{render()}catch(e){}
    }
    return true;
  }catch(e){ log('processIntent failed',e); return false; }
}
async function flushIntents(){
  if(!navigator.onLine) return;
  const items = await iqAll();
  if(!items.length) return;
  log('Flushing',items.length,'queued intents');
  for(const it of items){
    const ok = await processIntent(it);
    if(ok) await iqDel(it.id);
    await new Promise(r=>setTimeout(r,400)); // throttle léger
  }
  if(typeof toast==='function'){try{toast('💬 Messages synchronisés')}catch(e){}}
}
window.addEventListener('online', ()=>{ setTimeout(flushIntents,1200); });

/* Hook sur la fonction send() locale du chat (définie dans setupChat).
   On enveloppe askAI : si hors-ligne → enqueue + réponse locale immédiate. */
const _origAskAI = window.askAI;
if(typeof _origAskAI==='function'){
  window.askAI = async function(userMsg){
    if(!navigator.onLine){
      // Pré-extraction locale invisible
      const ex = localExtract(userMsg);
      try{ await iqPush({message:userMsg, extracted:ex}); }catch(e){}
      const pendingMsg = (safeLang()==='en')
        ? `📡 Hors-ligne. Message ajouté à la file (#${await iqCount()}). Ivy l'analysera dès le retour réseau.`
        : `📡 Hors-ligne. Message en file (#${await iqCount()}). Ivy l'analysera dès le retour réseau.`;
      // Toujours déclencher l'IA locale pour ne pas laisser l'utilisateur sec
      let local=''; try{local=(typeof localAI==='function')?localAI(userMsg):''}catch(e){}
      return { text: pendingMsg + (local?('\n\n'+local):''), src:'Queued (offline)' };
    }
    return _origAskAI.call(this, userMsg);
  };
}

/* ─────────────────────────────────────────────────────────────────
   6. SERVICE WORKER — bandeau "nouvelle version disponible"
   ───────────────────────────────────────────────────────────────── */
function showUpdateToast(reg){
  let el=document.getElementById('finos-update-toast');
  if(!el){
    el=document.createElement('div'); el.id='finos-update-toast';
    el.innerHTML='<span>⚡ Nouvelle version d\u2019\u00e9lite disponible.</span><button id="finos-update-btn">Actualiser</button>';
    document.body.appendChild(el);
    el.querySelector('#finos-update-btn').addEventListener('click',()=>{
      try{ reg.waiting && reg.waiting.postMessage({type:'SKIP_WAITING'}); }catch(e){}
      setTimeout(()=>location.reload(), 350);
    });
  }
  requestAnimationFrame(()=>el.classList.add('show'));
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.ready.then(reg=>{
    if(reg.waiting && navigator.serviceWorker.controller){ showUpdateToast(reg); }
    reg.addEventListener('updatefound', ()=>{
      const w=reg.installing; if(!w) return;
      w.addEventListener('statechange', ()=>{
        if(w.state==='installed' && navigator.serviceWorker.controller){
          showUpdateToast(reg);
        }
      });
    });
    // Re-check every 30 min
    setInterval(()=>{try{reg.update()}catch(e){}}, 30*60*1000);
  }).catch(()=>{});
}

/* ─────────────────────────────────────────────────────────────────
   7. CONVERSION AUTOMATIQUE DES MONTANTS AU CHANGEMENT DE DEVISE
   ───────────────────────────────────────────────────────────────── */
const STATIC_RATES = { // fallback grossier si offline (base = USD)
  USD:1, EUR:0.92, GBP:0.79, XOF:610, XAF:610, NGN:1600, KES:130, GHS:15,
  MAD:10, EGP:48, ZAR:18, BRL:5.4, INR:84, CNY:7.2, JPY:155
};
async function fetchRate(from,to){
  if(from===to) return 1;
  try{
    const r=await _origFetch('https://open.er-api.com/v6/latest/'+encodeURIComponent(from),{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      const v=j&&j.rates&&j.rates[to];
      if(typeof v==='number'&&isFinite(v)&&v>0) return v;
    }
  }catch(e){}
  // Fallback offline via USD pivot
  if(STATIC_RATES[from]&&STATIC_RATES[to]) return STATIC_RATES[to]/STATIC_RATES[from];
  return null;
}

async function convertAllAmounts(rate){
  // accounts
  if(Array.isArray(window.accs)){
    for(const a of window.accs){
      if(typeof a.balance==='number') a.balance = a.balance * rate;
      try{await dbPut('accounts',a)}catch(e){}
    }
  }
  // transactions
  if(Array.isArray(window.txs)){
    for(const tx of window.txs){
      if(typeof tx.amount==='number') tx.amount = tx.amount * rate;
      try{await dbPut('transactions',tx)}catch(e){}
    }
  }
  // goals
  if(Array.isArray(window.goals)){
    for(const g of window.goals){
      if(typeof g.target==='number') g.target = g.target * rate;
      if(typeof g.saved==='number')  g.saved  = g.saved  * rate;
      try{await dbPut('goals',g)}catch(e){}
    }
  }
}

const _origSaveCurrency = window.saveCurrency;
window.saveCurrency = async function(){
  const inp=document.getElementById('curInp');
  const newCur=(inp&&inp.value||'').trim().toUpperCase();
  const oldCur=safeCur();
  if(!newCur||newCur===oldCur){ if(typeof _origSaveCurrency==='function') return _origSaveCurrency.apply(this,arguments); return; }
  const wantConvert = confirm(
    `Convertir tous les montants de ${oldCur} vers ${newCur} ?\n\n`+
    `OK = convertir (taux actuels)\nAnnuler = changer la devise sans toucher aux montants`
  );
  if(wantConvert){
    try{
      const rate = await fetchRate(oldCur,newCur);
      if(!rate){ alert('Taux indisponible (hors-ligne sans table de secours). Devise changée sans conversion.'); }
      else{
        await convertAllAmounts(rate);
        log('Converted',oldCur,'→',newCur,'rate=',rate);
      }
    }catch(e){ log('convert failed',e); }
  }
  // Délègue ensuite à la fonction d'origine (persistance + render)
  if(typeof _origSaveCurrency==='function'){
    try{ inp.value = newCur; }catch(e){}
    return _origSaveCurrency.apply(this,arguments);
  }
};

/* ─────────────────────────────────────────────────────────────────
   8. Démarrage : tentative de flush si déjà online
   ───────────────────────────────────────────────────────────────── */
setTimeout(()=>{ if(navigator.onLine) flushIntents().catch(()=>{}); }, 4000);

log('Upgrade v5.1 chargé — intents/context/currency/SW prêts');
})();
</script>

window.computeNextBestAction = function computeNextBestAction(){
  try{
    if(typeof computeKPIs!=='function') return null;
    const k = computeKPIs();
    if(k.isSilent) return null;

    // 1. Runway critique (Bug 1: ne déclencher que sur données réelles)
    if(
      k.safetyDays!==9999 &&
      k.safetyDays<7 &&
      !k.isShortHistory &&
      k.burnRate>0 &&
      (txs||[]).length>=5
    ){
      const s=k.safetyDays>1?'s':'';
      return {priority:1,
        action: L('Stoppe toute dépense élastique.','Stop all discretionary spending.','Para todos los gastos discrecionales.','Para todos os gastos discricionários.'),
        reason: L('Runway: '+k.safetyDays+' jour'+s+' au rythme actuel.','Runway: '+k.safetyDays+'d at current pace.','Autonomía: '+k.safetyDays+'d al ritmo actual.','Autonomia: '+k.safetyDays+'d ao ritmo atual.'),
        impact:'critical'};
    }

    // 2. Evaporation post-revenu
    try{
      const recentInc = (txs||[]).filter(t=>t.type==='income').sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      if(recentInc){
        const hSince = (Date.now()-new Date(recentInc.date).getTime())/3600000;
        if(hSince<48 && (k.evaporationRate||0)>60){
          const block = Math.round(recentInc.amount*0.20);
          return {priority:2,
            action: L('Bloque '+fmt(block)+' '+curU()+' en épargne maintenant.','Lock '+fmt(block)+' '+curU()+' into savings now.','Bloquea '+fmt(block)+' '+curU()+' en ahorros ahora.','Bloqueia '+fmt(block)+' '+curU()+' em poupança agora.'),
            reason: L('Évaporation '+k.evaporationRate+'% détectée sur revenu récent.','Evaporation '+k.evaporationRate+'% detected on recent income.','Evaporación '+k.evaporationRate+'% detectada sobre ingreso reciente.','Evaporação '+k.evaporationRate+'% detectada na receita recente.'),
            impact:'high'};
        }
      }
    }catch(e){}

    // 3. Objectif prioritaire + surplus
    try{
      const pg = (typeof getPriorityGoal==='function')?getPriorityGoal():null;
      if(pg){
        const gap = pg.target - pg.saved;
        const surplus = Math.max(0,(k.inc30/30) - k.burnRate);
        if(gap>0 && surplus>0){
          const transfer = Math.min(Math.round(surplus), Math.round(gap));
          return {priority:3,
            action: L('Vire '+fmt(transfer)+' '+curU()+' vers "'+pg.name+'" aujourd\'hui.','Transfer '+fmt(transfer)+' '+curU()+' to "'+pg.name+'" today.','Transfiere '+fmt(transfer)+' '+curU()+' a "'+pg.name+'" hoy.','Transfere '+fmt(transfer)+' '+curU()+' para "'+pg.name+'" hoje.'),
            reason: L('Surplus journalier disponible: '+fmt(surplus)+' '+curU()+'.','Daily surplus available: '+fmt(surplus)+' '+curU()+'.','Excedente diario: '+fmt(surplus)+' '+curU()+'.','Excedente diário: '+fmt(surplus)+' '+curU()+'.'),
            impact:'medium'};
        }
      }
    }catch(e){}

    // 4. Pression élevée
    if(k.pressureDataOK && k.pressureIdx>40){
      return {priority:4,
        action: L('Pause 24h sur dépenses non essentielles.','24h pause on non-essential spending.','Pausa 24h en gastos no esenciales.','Pausa 24h em gastos não essenciais.'),
        reason: L('Indice de pression à +'+k.pressureIdx+'%.','Pressure index at +'+k.pressureIdx+'%.','Índice de presión +'+k.pressureIdx+'%.','Índice de pressão +'+k.pressureIdx+'%.'),
        impact:'medium'};
    }

    // 5. Pas de saisie + soir
    const today = (txs||[]).filter(tx=>new Date(tx.date).toDateString()===new Date().toDateString());
    if(today.length===0 && new Date().getHours()>=18){
      return {priority:5,
        action: L('Note tes dépenses du jour avant de dormir.','Log today\'s expenses before sleeping.','Anota tus gastos del día antes de dormir.','Anota as despesas do dia antes de dormir.'),
        reason: L('Aucune saisie depuis ce matin — ton cerveau oublie 60% des dépenses.','No entries since this morning — your brain forgets 60% of expenses.','Sin entradas desde la mañana — tu cerebro olvida 60% de los gastos.','Sem registros desde a manhã — o cérebro esquece 60% das despesas.'),
        impact:'low'};
    }

    // 6. Rétention élevée
    if(k.retention!==null && k.retention>=70){
      const invest = Math.round(((k.inc30||0)*0.10));
      return {priority:6,
        action: L('Investis 10% de tes revenus du mois ('+fmt(invest)+' '+curU()+').','Invest 10% of monthly income ('+fmt(invest)+' '+curU()+').','Invierte 10% de tus ingresos del mes ('+fmt(invest)+' '+curU()+').','Investe 10% das receitas do mês ('+fmt(invest)+' '+curU()+').'),
        reason: L('Tu retiens '+k.retention+'% — capitalise.','You retain '+k.retention+'% — capitalize.','Retienes '+k.retention+'% — capitaliza.','Retém '+k.retention+'% — capitalize.'),
        impact:'low'};
    }
    return null;
  }catch(e){ console.warn('[NBA] fail',e); return null; }
};

window.runStressTest = function runStressTest(){
  try{
    const k = computeKPIs();
    const burn = Math.max(0, k.burnRate||0);
    const incDaily = Math.max(0, (k.inc30||0)/30);
    const start = (k.activeBalance||0) + (k.savingsBalance||0);

    function simulate(incFactor, expFactor){
      const incJ = incDaily*incFactor;
      const expJ = burn*expFactor;
      let solde = start, runway = '30j+', soldeFin = start;
      for(let j=1;j<=30;j++){
        solde = solde + incJ - expJ;
        if(solde<=0 && runway==='30j+') runway = j+'j';
      }
      soldeFin = solde;
      return {runway, soldeFin};
    }
    const choc = simulate(0.70, 1.20);
    const baseline = {runway: k.safetyDays===9999?'30j+':(k.safetyDays>=30?'30j+':k.safetyDays+'j')};
    const optimal = simulate(1.20, 0.90);
    const epargneGen = Math.max(0, optimal.soldeFin - start);
    return {choc, baseline, optimal:{...optimal, epargneGeneree:epargneGen}, isShort:k.isShortHistory};
  }catch(e){ console.warn('[StressTest] fail',e); return null; }
};

window.computeFinancialHealthScore = function computeFinancialHealthScore(kpi){
  try{
    const k = kpi || computeKPIs();
    const safetyDays = k.safetyDays===9999?9999:k.safetyDays;
    const reserve = safetyDays>=30?20:safetyDays>=14?15:safetyDays>=7?10:safetyDays>=3?5:0;
    const retention = k.retention===null?10
      :k.retention>=50?20:k.retention>=30?15:k.retention>=10?10:k.retention>=0?5:0;
    const regular = k.isSilent?0
      :k.dataDays>=21?20:k.dataDays>=14?15:k.dataDays>=7?10:k.dataDays>=3?5:2;
    let goal = 8;
    try{
      const pg = (typeof getPriorityGoal==='function')?getPriorityGoal():null;
      if(pg){
        const pct = pg.target>0?(pg.saved/pg.target)*100:0;
        goal = pct>=75?20:pct>=50?15:pct>=25?10:pct>0?5:2;
      }
    }catch(e){}
    let behavior;
    if(k.isShortHistory){ behavior=10; }
    else {
      const d = k.dopamineIdx||0;
      behavior = d<20?20:d<40?15:d<60?10:d<80?5:0;
    }
    const total = reserve+retention+regular+goal+behavior;
    const label = total<40?T('health_critique'):total<60?T('health_fragile'):total<75?T('health_stable'):total<90?T('health_solide'):T('health_elite');
    const color = total<40?'var(--red)':total<60?'#f59e0b':total<75?'var(--ylw)':total<90?'var(--acc3)':'var(--grn)';
    return {score:total, label, color, axes:{reserve, retention, regular, goal, behavior}};
  }catch(e){ console.warn('[HealthScore] fail',e); return null; }
};

window.detectRecurringPatterns = function detectRecurringPatterns(){
  try{
    if(!(txs||[]).length) return [];
    const exp = txs.filter(t=>t.type==='expense');
    if(exp.length<3) return [];
    // Group by categoryId + amount bucket (±5%)
    const groups = {};
    exp.forEach(t=>{
      const bucket = Math.round(t.amount/10)*10;
      const key = t.categoryId+'|'+bucket;
      if(!groups[key]) groups[key]={txs:[],catId:t.categoryId,amounts:[]};
      groups[key].txs.push(t);
      groups[key].amounts.push(t.amount);
    });
    const results = [];
    Object.values(groups).forEach(g=>{
      if(g.txs.length<2) return;
      const sorted = g.txs.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
      const intervals=[];
      for(let i=1;i<sorted.length;i++){
        intervals.push((new Date(sorted[i].date)-new Date(sorted[i-1].date))/86400000);
      }
      const avg = intervals.reduce((s,v)=>s+v,0)/intervals.length;
      const amount = g.amounts.reduce((s,v)=>s+v,0)/g.amounts.length;
      const total = g.amounts.reduce((s,v)=>s+v,0);
      let freq=null;
      if(avg>=6 && avg<=8 && sorted.length>=3) freq='weekly';
      else if(avg>=27 && avg<=33 && sorted.length>=2) freq='monthly';
      if(!freq) return;
      const last = new Date(sorted[sorted.length-1].date);
      const next = new Date(last.getTime() + avg*86400000);
      let catName = g.catId;
      try{ catName = catById(g.catId).name; }catch(e){}
      let catIcon = '💸';
      try{ catIcon = catById(g.catId).icon||'💸'; }catch(e){}
      results.push({
        categoryId:g.catId, categoryName:catName, categoryIcon:catIcon,
        amount, frequency:freq, occurrences:sorted.length,
        totalSpent:total, nextExpectedDate:next
      });
    });
    return results.sort((a,b)=>b.totalSpent-a.totalSpent).slice(0,8);
  }catch(e){ console.warn('[Recurring] fail',e); return []; }
};

  try{
    if(kpi && kpi.isShortHistory) return '';
    const list = window.detectRecurringPatterns();
    if(!list.length) return '';
    const monthlyTotal = list.reduce((s,p)=>s + (p.frequency==='weekly'?p.amount*4.33:p.amount), 0);
    const rows = list.map(p=>{
      const nxt = p.nextExpectedDate.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      const freqLbl = p.frequency==='weekly'?T('recurring_weekly'):T('recurring_monthly');
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--surf3)">
        <div>
          <div style="font-weight:700;font-size:13px">${p.categoryIcon} ${p.categoryName}</div>
          <div class="tm" style="font-size:11px">${freqLbl} · ${p.occurrences}× · Prochaine: ${nxt}</div>
        </div>
        <div style="font-weight:800;font-family:var(--mono);color:var(--red)">-${fmt(p.amount)}</div>
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="ch">🔁 ${T('recurring_title').toUpperCase()}</div>
      ${rows}
      <div style="font-size:11px;color:var(--mut);margin-top:8px">${T('recurring_total')} : <strong>${fmt(monthlyTotal)} ${curU()}</strong> / mois</div>
    </div>`;
  }catch(e){ console.warn('[Recurring render] fail',e); return ''; }
};

/* ============================================================
   MODULE 5 — CASHFLOW PROJECTION
   ============================================================ */
window.buildCashflowProjection = function buildCashflowProjection(period){
  try{
    period = period || 'month';
    const STEPS = period==='day' ? 24 : period==='week' ? 7 : 30;
    const k = computeKPIs();
    const burn = Math.max(0, k.burnRate||0);
    const incDaily = Math.max(0, (k.inc30||0)/30);
    const burnPerStep = period==='day' ? burn/24 : burn;
    const incPerStep  = period==='day' ? incDaily/24 : incDaily;
    const start = (k.activeBalance||0);
    const incomeEvents = {};
    const expenseEvents = {};
    const now = Date.now();
    // Expected cycle income (only inject if it falls in projection window)
    try{
      if(k.cycleContext && k.cycleContext.daysToNextExpected>0 && k.cycleContext.expectedCycleIncome){
        const dDays = k.cycleContext.daysToNextExpected;
        let stepIdx = period==='day' ? -1 /* hors fenêtre 24h */ : Math.min(STEPS-1, Math.max(0, dDays));
        if(period==='week' && dDays>=7) stepIdx = -1;
        if(stepIdx>=0) incomeEvents[stepIdx] = (incomeEvents[stepIdx]||0) + k.cycleContext.expectedCycleIncome;
      }
    }catch(e){}
    // Recurring expenses
    try{
      const rec = (typeof window.detectRecurringPatterns==='function') ? window.detectRecurringPatterns() : [];
      rec.forEach(r=>{
        const days = Math.round((r.nextExpectedDate.getTime()-now)/86400000);
        let stepIdx = -1;
        if(period==='day'){
          const hours = Math.round((r.nextExpectedDate.getTime()-now)/3600000);
          if(hours>=0 && hours<24) stepIdx = hours;
        } else if(period==='week'){
          if(days>=0 && days<7) stepIdx = days;
        } else {
          if(days>=0 && days<30) stepIdx = days;
        }
        if(stepIdx>=0) expenseEvents[stepIdx] = (expenseEvents[stepIdx]||0) + r.amount;
      });
    }catch(e){}
    const series = [];
    let solde = start;
    for(let j=0;j<STEPS;j++){
      solde += incPerStep - burnPerStep;
      if(incomeEvents[j]) solde += incomeEvents[j];
      if(expenseEvents[j]) solde -= expenseEvents[j];
      series.push({day:j, solde, incEvent:!!incomeEvents[j], expEvent:!!expenseEvents[j]});
    }
    return {series, start, incomeEvents, expenseEvents, steps:STEPS, period};
  }catch(e){ console.warn('[Projection] fail',e); return null; }
};

window.renderProjectionCard = function renderProjectionCard(kpi, period){
  try{
    period = period || 'month';
    const totalTx = (txs||[]).length;
    if(!totalTx){ return ''; }
    if(totalTx<5){
      return `<div class="card"><div class="ch">📈 ${T('projection_title').toUpperCase()}</div>
        <div class="tm" style="font-size:12px;padding:10px 0;text-align:center">📊 ${L('Ajoute au moins 5 transactions pour activer la projection.','Add at least 5 transactions to activate the projection.','Añade al menos 5 transacciones para activar la proyección.','Adicione pelo menos 5 transações para ativar a projeção.')}</div></div>`;
    }
    const proj = window.buildCashflowProjection(period);
    if(!proj) return '';
    const STEPS = proj.steps;
    const unitLabel = period==='day' ? 'H' : 'J';
    const W=300, H=80, pad=8;
    const vals = proj.series.map(p=>p.solde);
    const minV = Math.min(0, ...vals), maxV = Math.max(0, ...vals, proj.start);
    const range = (maxV-minV)||1;
    const xs = (i)=> pad + (i/((STEPS-1)||1))*(W-2*pad);
    const ys = (v)=> pad + (1 - (v-minV)/range)*(H-2*pad);
    const yZero = ys(0);
    let line='';
    proj.series.forEach((p,i)=>{
      const x = xs(i), y = ys(p.solde);
      line += (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1)+' ';
    });
    let negArea = '';
    proj.series.forEach((p,i)=>{
      const x = xs(i);
      if(p.solde<0){
        const y = ys(p.solde);
        negArea += (negArea===''?'M':'L')+x.toFixed(1)+','+yZero.toFixed(1)+' L'+x.toFixed(1)+','+y.toFixed(1)+' ';
      }
    });
    const markers = proj.series.map((p,i)=>{
      let m='';
      if(p.incEvent) m += `<polygon points="${xs(i)},${ys(p.solde)-5} ${xs(i)-3},${ys(p.solde)+1} ${xs(i)+3},${ys(p.solde)+1}" fill="var(--grn)"/>`;
      if(p.expEvent) m += `<circle cx="${xs(i)}" cy="${ys(p.solde)}" r="2.5" fill="var(--red)"/>`;
      return m;
    }).join('');
    const negDay = proj.series.findIndex(p=>p.solde<0);
    const negAlert = (negDay>=0 && negDay<Math.ceil(STEPS/2)) ? `<div class="al al-d" style="margin-top:8px">⚠️ ${T('projection_alert').replace('{n}',negDay)}</div>` : '';
    const finalSolde = proj.series[STEPS-1].solde;
    const shortBanner = (kpi && kpi.isShortHistory) ? `<div class="tm" style="font-size:10px;margin-top:6px;font-style:italic">📊 ${L('Basé sur '+kpi.dataDays+'j — projection indicative.','Based on '+kpi.dataDays+'d — indicative projection.','Basado en '+kpi.dataDays+'d — proyección indicativa.','Baseado em '+kpi.dataDays+'d — projeção indicativa.')}</div>` : '';
    return `<div class="card">
      <div class="ch">📈 ${T('projection_title').toUpperCase()} · ${unitLabel}+${STEPS}</div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:80px;display:block">
        <line x1="${pad}" y1="${yZero}" x2="${W-pad}" y2="${yZero}" stroke="var(--red)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>
        <path d="${negArea}" fill="rgba(239,68,68,.15)"/>
        <path d="${line}" fill="none" stroke="var(--acc3)" stroke-width="2" stroke-linejoin="round"/>
        ${markers}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px">
        <span>${unitLabel}+0 : ${fmtFull(proj.start)}</span>
        <span style="color:${finalSolde>=0?'var(--grn)':'var(--red)'};font-weight:700">${unitLabel}+${STEPS} : ${fmtFull(finalSolde)}</span>
      </div>
      ${shortBanner}
      ${negAlert}
    </div>`;
  }catch(e){ console.warn('[Projection render] fail',e); return ''; }
};

/* ============================================================
   MODULE 6 — IVY MEMORY ENRICHED
   ============================================================ */
function computeStreak(){
  try{
    const days = new Set((txs||[]).map(tx=>new Date(tx.date).toDateString()));
    let cur=0, longest=0;
    // currentStreak: starting today going back
    let d = new Date(); d.setHours(0,0,0,0);
    while(days.has(d.toDateString())){ cur++; d.setDate(d.getDate()-1); }
    // longestStreak: sorted unique days
    const sorted = [...days].map(s=>new Date(s).getTime()).sort((a,b)=>a-b);
    let run=1;
    for(let i=1;i<sorted.length;i++){
      const diff = Math.round((sorted[i]-sorted[i-1])/86400000);
      if(diff===1) run++; else { if(run>longest) longest=run; run=1; }
    }
    if(run>longest) longest=run;
    return {currentStreak:cur, longestStreak:longest};
  }catch(e){ return {currentStreak:0, longestStreak:0}; }
}

function computeWeeklyRetentions(){
  try{
    const buckets = {};
    (txs||[]).forEach(tx=>{
      const d = new Date(tx.date);
      const monday = new Date(d);
      monday.setDate(d.getDate() - ((d.getDay()+6)%7));
      monday.setHours(0,0,0,0);
      const key = monday.toISOString().slice(0,10);
      if(!buckets[key]) buckets[key]={inc:0,exp:0};
      if(tx.type==='income') buckets[key].inc+=tx.amount;
      else if(tx.type==='expense') buckets[key].exp+=tx.amount;
    });
    const weeks = Object.entries(buckets).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);
    let best={pct:-Infinity,week:null}, worst={pct:Infinity,week:null};
    weeks.forEach(([k,v])=>{
      if(v.inc<=0) return;
      const pct = Math.round(((v.inc-v.exp)/v.inc)*100);
      if(pct>best.pct) best={pct, week:k};
      if(pct<worst.pct) worst={pct, week:k};
    });
    return {bestWeek:best.week?best:null, worstWeek:worst.week?worst:null};
  }catch(e){ return {bestWeek:null, worstWeek:null}; }
}

window.updateIvyMemory = async function updateIvyMemory(){
  try{
    if(typeof ALADDIN==='undefined' || !ALADDIN.getIvyState) return;
    const state = await ALADDIN.getIvyState();
    const streaks = computeStreak();
    const weeks = computeWeeklyRetentions();
    let avgBurn = 0;
    try{ avgBurn = computeKPIs().burnRate||0; }catch(e){}
    const profile = state.userProfile || {};
    profile.currentStreak = streaks.currentStreak;
    profile.longestStreak = Math.max(streaks.longestStreak, profile.longestStreak||0);
    profile.bestWeekRetention = weeks.bestWeek?weeks.bestWeek.pct:(profile.bestWeekRetention||null);
    profile.worstWeekRetention = weeks.worstWeek?weeks.worstWeek.pct:(profile.worstWeekRetention||null);
    profile.avgDailyBurn = Math.round(avgBurn);
    // Personal record: best single-day savings (income-expense)
    try{
      const byDay = {};
      (txs||[]).forEach(tx=>{
        const key = new Date(tx.date).toDateString();
        if(!byDay[key]) byDay[key]={inc:0,exp:0};
        if(tx.type==='income') byDay[key].inc+=tx.amount;
        else if(tx.type==='expense') byDay[key].exp+=tx.amount;
      });
      let recAmt = 0, recDate = null;
      Object.entries(byDay).forEach(([k,v])=>{
        const net = v.inc - v.exp;
        if(net>recAmt){ recAmt=net; recDate=k; }
      });
      if(recAmt > (profile.personalRecordEpargne?.amount||0)){
        profile.personalRecordEpargne = {amount:Math.round(recAmt), date:recDate};
      }
    }catch(e){}
    state.userProfile = profile;
    await ALADDIN.saveIvyState(state);
  }catch(e){ console.warn('[IvyMemory] fail',e); }
};

window.getIvyMemorySnapshot = async function getIvyMemorySnapshot(){
  try{
    if(typeof ALADDIN==='undefined' || !ALADDIN.getIvyState) return null;
    const state = await ALADDIN.getIvyState();
    return state.userProfile || null;
  }catch(e){ return null; }
};

try{

      try{ await window.updateIvyMemory(); }catch(e){}
      return r;
    };
  }
}catch(e){ console.warn('[IvyMemory hook] fail',e); }

/* Wrap buildCtx to inject ivyMemoire + depensesRecurrentes */
try{
  if(typeof buildCtx==='function'){
    const _origBuildCtx = buildCtx;

      const json = await _origBuildCtx.apply(this, arguments);
      try{
        const p = JSON.parse(json);

        if(mem){
          p.ivyMemoire = {
            currentStreak: mem.currentStreak||0,
            longestStreak: mem.longestStreak||0,
            bestWeekRetention: mem.bestWeekRetention,
            worstWeekRetention: mem.worstWeekRetention,
            avgDailyBurn: mem.avgDailyBurn,
            personalRecordEpargne: mem.personalRecordEpargne||null
          };
        }
        try{
          const rec = window.detectRecurringPatterns().slice(0,5).map(r=>({
            categorie:r.categoryName, montant:Math.round(r.amount),

            prochaineDate:r.nextExpectedDate.toISOString().slice(0,10)
          }));
          if(rec.length) p.depensesRecurrentes = rec;
        }catch(e){}
        return JSON.stringify(p);
      }catch(e){ return json; }
    };
  }
}catch(e){ console.warn('[buildCtx wrap] fail',e); }

setTimeout(()=>{ try{ window.updateIvyMemory(); }catch(e){} }, 2000);
